# domestic_federation — seat-specific pressure for the Federation: a managed
# press that blinds you as much as them, a strong army that toasts decision,
# few friends, and an economy that was sanctioned before this began (queues,
# reserves, cash from people who want to own things). No arc. At most four
# conditioned cards: one lifeline (economy < 35), one piece hook
# (strategic_reserve / fortress), two cross-arc hooks.

# ---- week one / two -----------------------------------------------------------

- id: dom_fed_01_two_bulletins
  advisor: spin_doctor
  seats: [federation]
  acts: [1, 2]
  tags: [domestic]
  text: >-
    The nine o'clock news is cut two ways: the queue outside the Savings Bank,
    blaming the sanctions, or the harvest. Both are true, and only one can lead
    at nine.
  left:
    text: "Run the queue. Blame the sanctions"
    effects: { public: -5, economy: 2, trust_primary: -3, commitment: 2 }
    tags: [domestic, transparency]
  right:
    text: "Run the harvest"
    effects: { public: 4, intel: -3, economy: -2, commitment: 2 }
    tags: [domestic, secrecy]

- id: dom_fed_02_sixty_one_days
  advisor: treasury
  seats: [federation]
  acts: [1, 2]
  tags: [economy, domestic]
  text: >-
    The reserve covers sixty-one days of imports. Fuel rationing from Monday
    makes it ninety, and puts a ration card in every wallet in {capital} with
    your signature on it.
  left:
    text: "Ration from Monday"
    effects: { economy: 4, public: -6, military: -2 }
    tags: [economy, domestic]
  right:
    text: "Burn the reserve"
    effects: { economy: -4, public: 2, commitment: 2 }
    tags: [economy, stall, domestic]

- id: dom_fed_03_accreditation
  advisor: press
  seats: [federation]
  acts: [1, 2]
  tags: [domestic, intel]
  text: >-
    I am the last foreign reporter in {capital}, and your ministry wants me gone
    by Friday. After me, the only pictures of this city abroad are yours, and
    nobody believes yours.
  left:
    text: "Twenty minutes. Nothing excluded"
    effects: { public: -3, trust_primary: 4, trust_secondary: 3, allies: 2, intel: 1 }
    tags: [transparency, domestic]
  right:
    text: "Put her on the plane"
    effects: { public: 3, trust_primary: -5, allies: -4, intel: -2, economy: -1 }
    tags: [secrecy, domestic]

# ---- week two / three ---------------------------------------------------------

- id: dom_fed_04_the_savings_bank
  advisor: spin_doctor
  seats: [federation]
  acts: [2, 3]
  tags: [domestic, economy]
  text: >-
    The bank opens at nine, the queue forms at five, and a {other_adj} crew
    films at four. Dig up the pavement and the queue moves two streets; open at
    six with cash and it is gone.
  left:
    text: "Open at six, with cash"
    effects: { economy: -4, public: 5, trust_secondary: 1 }
    tags: [economy, domestic, transparency]
  right:
    text: "Dig up the pavement"
    effects: { public: -3, trust_secondary: -3, intel: -2, economy: -1 }
    tags: [domestic, secrecy]

- id: dom_fed_05_the_corridor
  advisor: ally_leader
  seats: [federation]
  acts: [2, 3]
  tags: [alliance, economy, diplomacy]
  text: >-
    Forty grain trains a week from Monday, if one Compact observer stands in
    your rail yards and watches what goes back the other way. Your generals will
    hate it; ask your bakers.
  left:
    text: "Take the trains and the observer"
    effects: { economy: 6, military: -3, intel: -2, trust_primary: 3 }
    tags: [alliance, economy, diplomacy]
    odds:
      label: Her cabinet agrees
      base: 0.55
      tags: [alliance, diplomacy]
      success:
        effects: { allies: 4, public: 2 }
      failure:
        text: "Her coalition partner vetoes it. The trains stop at the border with the grain aboard."
        effects: { economy: -2, allies: -2, public: -2 }
  right:
    text: "Refuse the observer"
    effects: { economy: -3, military: 2, allies: -3 }
    tags: [secrecy, economy]

- id: dom_fed_06_the_figures
  advisor: opposition
  seats: [federation]
  acts: [2, 3]
  conditions: { flags_any: [proxy:clash, proxy:advisers_in, proxy:brigade_deployed] }
  tags: [domestic, military]
  text: >-
    My party is allowed eleven seats, and today I use one to ask for the Vestria
    casualty figures to be read in the chamber. The mothers outside the ministry
    are counting the buses.
  left:
    text: "Read them out"
    effects: { public: -5, military: -2, trust_primary: 2, intel: 3 }
    tags: [transparency, domestic]
  right:
    text: "Keep them secret"
    effects: { public: 2, intel: -3, commitment: 2, military: 1 }
    tags: [secrecy, domestic]

- id: dom_fed_07_the_straits_price
  advisor: treasury
  seats: [federation]
  acts: [2, 3]
  conditions: { flags_any: [blockade:declared, cables:cut, undersea_cables:cut] }
  tags: [economy, domestic]
  text: >-
    With the Straits shut, diesel in {capital} costs twice what it did on
    Monday, and haulage firms are parking their lorries. A price cap costs
    eleven million a day; shelves vote.
  left:
    text: "Cap the price"
    effects: { economy: -5, public: 4, commitment: 2 }
    tags: [economy, domestic, public_commitment]
  right:
    text: "Let the price rise"
    effects: { economy: -2, public: -6, military: -1 }
    tags: [economy, domestic]

# ---- week three / four --------------------------------------------------------

- id: dom_fed_08_voskra
  advisor: aide
  seats: [federation]
  acts: [3, 4]
  timer: 10
  timeout: right
  tags: [domestic]
  text: >-
    The Voskra tractor plant has been idle three weeks, and four thousand people
    stand in its square, quietly. The governor has asked twice for troops, the
    ministry once for you.
  left:
    text: "Go to Voskra tomorrow"
    effects: { public: 5, military: -2, economy: -1, intel: 2 }
    tags: [domestic, reassurance]
  right:
    text: "Send the governor his troops"
    effects: { public: -6, military: 2, escalation: 1, trust_primary: -2 }
    tags: [domestic, military]

- id: dom_fed_09_two_hundred_letters
  advisor: family
  seats: [federation]
  acts: [3, 4]
  tags: [personal, domestic]
  text: >-
    The wives of the Third Division have written to me, not you: two hundred
    letters asking when the Division comes home. I have read forty, and I would
    like you to read one.
  left:
    text: "Give me all of them"
    effects: { public: 3, military: -3, intel: 2 }
    tags: [personal, domestic, transparency]
  right:
    text: "Send them to the ministry"
    effects: { public: -3, military: 2, commitment: 1 }
    tags: [personal, domestic, stall]

- id: dom_fed_10_ninety_days
  advisor: treasury
  seats: [federation]
  acts: [3, 4]
  conditions: { pieces_any: [strategic_reserve, fortress] }
  tags: [economy, domestic, alliance]
  text: >-
    Grain for eighty-eight days, fuel for seventy; the sanctions bounce off. The
    Compact sells cheap grain if the Amberline crossing opens to its lorries,
    and lorries go both ways.
  left:
    text: "Open the Amberline crossing"
    effects: { economy: 5, allies: 3, military: -4, intel: -2 }
    tags: [economy, diplomacy, alliance]
  right:
    text: "Keep the border shut"
    effects: { economy: -2, allies: -3, public: 2, military: 1 }
    tags: [economy, secrecy, domestic]

- id: dom_fed_11_three_hundred_names
  advisor: peace_leader
  seats: [federation]
  acts: [3, 4]
  tags: [domestic]
  text: >-
    Three hundred students were taken from Liberation Square at two, and their
    parents rang me, not the police. I have every name, and by dawn so will
    {other_adj} television.
  left:
    text: "Release them tonight"
    effects: { public: 4, military: -5, trust_primary: 3, trust_secondary: 2, escalation: -2 }
    tags: [deescalate, domestic, reassurance]
  right:
    text: "Charge them"
    effects: { public: -3, military: 3, trust_primary: -4, trust_secondary: -4, intel: -2 }
    tags: [domestic, secrecy]

# ---- week four / endgame ------------------------------------------------------

- id: dom_fed_12_the_word
  advisor: spin_doctor
  seats: [federation]
  acts: [4, 5]
  tags: [domestic, nuclear]
  text: >-
    The ministry wants 'existential' in tonight's address. I tested it: six
    points for three days, then every bulletin must top the last, while
    'difficult' buys nothing and lasts.
  left:
    text: "Say existential"
    effects: { public: 6, commitment: 7, escalation: 4, trust_primary: -5 }
    tags: [public_commitment, nuclear, escalatory, domestic]
  right:
    text: "Say difficult"
    effects: { public: -4, commitment: -1, trust_primary: 2 }
    tags: [domestic, reassurance]

- id: dom_fed_13_fourteen_billion
  advisor: legal
  seats: [federation]
  acts: [4, 5]
  tags: [economy, domestic]
  text: >-
    Fourteen billion of {rival_adj} money sits in {capital}, and emergency
    powers let you take it by noon. Seizure is forever, whatever the decree
    says; a freeze is worth nothing.
  left:
    text: "Seize the assets"
    effects: { economy: 6, trust_primary: -7, allies: -3, escalation: 3 }
    tags: [sanction, escalatory, economy]
  right:
    text: "Freeze, don't seize"
    effects: { economy: -1, public: -3, trust_primary: -2 }
    tags: [sanction, stall, economy]

- id: dom_fed_14_the_second_bulletin
  advisor: press
  seats: [federation]
  acts: [4, 5]
  timer: 10
  timeout: right
  tags: [domestic, intel]
  text: >-
    The square at Voskra is on every {other_adj} channel tonight and none of
    yours, and half of {capital} has a cousin with a satellite dish. How long
    do you think that holds?
  left:
    text: "Show it tonight. All of it"
    effects: { public: -6, intel: 3, commitment: -2, trust_secondary: 2 }
    tags: [transparency, domestic]
  right:
    text: "Keep it off the air"
    effects: { commitment: 2 }
    tags: [secrecy, domestic]
    odds:
      label: It holds
      base: 0.45
      tags: [intel]
      success:
        effects: { public: 2, military: 1 }
      failure:
        text: "By Thursday the footage is on every phone in the city, with your bulletin beside it for comparison."
        effects: { public: -10, military: -3, intel: -2 }

- id: dom_fed_15_the_toast
  advisor: aide
  seats: [federation]
  acts: [4, 5]
  tags: [domestic, military]
  text: >-
    The Chief of Staff dines with his colonels tonight; the toast is to
    '{leader} who does not hesitate'. Your place is set at the head of the
    table, and they will drink to it empty.
  left:
    text: "Take the seat"
    effects: { military: 5, escalation: 3, commitment: 3, public: 2 }
    tags: [military, domestic, public_commitment]
  right:
    text: "Send regrets"
    effects: { military: -6, intel: 2, escalation: -1 }
    tags: [domestic, stall]

