# ultimatum — a deadline, theirs or yours, and the hours on either side of it.
# Theirs: withdraw the battalion from Hollin Ridge in Vestria within seventy-two
# hours. Yours: their armoured column leaves the Sallow crossing in Amberline by
# Friday noon. Forces: the commitment trap (say it on camera and you own it;
# walking back costs more the more you have said), Red Lines (commitment_trap
# cards), Strategic Ambiguity (misperception: they read you both ways at once),
# the Spin Doctor (a climbdown is a framing problem until it is not) and the
# Hotline Protocol (one call a week nobody at home makes you pay for).
# Flags: ultimatum:received, ultimatum:issued, ultimatum:deadline_passed,
#        ultimatum:met, ultimatum:backed_down, ultimatum:called_bluff.
# Cross-hooks (flags_any): blockade:declared, proxy:escalated.
# Piece hooks: red_lines, spin_doctor, strategic_ambiguity, hotline_protocol.

# ---------------------------------------------------------------- entries (non-chained)

- id: ultimatum_01_seventy_two_hours
  arc: ultimatum
  advisor: hotline
  acts: [2, 3]
  weight: 1.5
  tags: [commitment_trap, diplomacy]
  conditions: { flags_none: [ultimatum:received, ultimatum:issued] }
  note: Entry, early. Their deadline. Left commits on camera; right buys information with face.
  text: >-
    '{Rival} requires the {us_adj} battalion off Hollin Ridge within three
    days, or it will act to protect its citizens.' The translator offers to
    read it again; nobody says yes.
  left:
    text: "Reject it. On camera, tonight"
    effects: { commitment: 8, public: 4, escalation: 5, trust_primary: -5 }
    tags: [public_commitment, deterrence]
    set: [ultimatum:received]
    follow: [{ card: ultimatum_05_on_the_record, in: 1 }]
  right:
    text: "Confirm it arrived. Nothing more"
    effects: { public: -4, military: -3, intel: 4, commitment: -2 }
    tags: [stall, diplomacy]
    set: [ultimatum:received]
    follow: [{ card: ultimatum_06_the_call, in: 2 }]

- id: ultimatum_02_the_generals_clock
  arc: ultimatum
  advisor: hawk_general
  acts: [2, 4]
  weight: 1.2
  tags: [commitment_trap, military]
  conditions: { flags_none: [ultimatum:received, ultimatum:issued] }
  note: Entry, mid. Our deadline. The passive voice is where the cost lives.
  text: >-
    Their forty tanks have sat at the Sallow crossing for nine days, and every
    day they sit they become furniture. Give them until Friday noon, and the
    consequences would be arranged.
  left:
    text: "Friday noon. Say it on camera"
    effects: { commitment: 10, escalation: 6, military: 4, public: 3, trust_primary: -6 }
    tags: [public_commitment, deterrence, military]
    set: [ultimatum:issued]
    follow: [{ card: ultimatum_09_the_wording, in: 1 }]
  right:
    text: "Friday noon. Tell them privately"
    effects: { commitment: 4, escalation: 3, military: -3, public: -2, trust_primary: -2 }
    tags: [deterrence, secrecy]
    set: [ultimatum:issued]
    follow: [{ card: ultimatum_10_the_private_word, in: 2 }]

- id: ultimatum_03_the_broadcast
  arc: ultimatum
  advisor: rival_leader
  acts: [3, 5]
  weight: 1.2
  tags: [commitment_trap, domestic, diplomacy]
  conditions: { flags_none: [ultimatum:received, ultimatum:issued] }
  note: Entry, late. A man with a domestic audience, speaking to it first.
  text: >-
    'If the battalion on Hollin Ridge has not started leaving by midnight on
    day four, {rival} is free to act.' He says it on live television to his
    own people, then the anthem plays.
  left:
    text: "Answer him tonight, on camera"
    effects: { commitment: 8, public: 5, escalation: 5, trust_primary: -5 }
    tags: [public_commitment, deterrence, domestic]
    set: [ultimatum:received]
    follow: [{ card: ultimatum_05_on_the_record, in: 1 }]
  right:
    text: "Let the Foreign Ministry answer"
    effects: { public: -5, commitment: -2, trust_primary: 2, military: -3 }
    tags: [diplomacy, stall]
    set: [ultimatum:received]
    follow: [{ card: ultimatum_06_the_call, in: 2 }]

- id: ultimatum_04_the_pattern
  arc: ultimatum
  advisor: hotline
  acts: [3, 5]
  weight: 1.2
  tags: [commitment_trap, diplomacy, misperception]
  conditions:
    flags_any: [blockade:declared, proxy:escalated]
    flags_none: [ultimatum:received, ultimatum:issued]
  note: Cross-hook entry. The month so far has become a pattern, and the pattern has a deadline.
  text: >-
    '{Rival} sees a pattern in {us_adj} actions; unless the battalion leaves
    Hollin Ridge by Friday, it will restore balance by other means.' Then:
    '{Other_capital} has been told.'
  left:
    text: "Restore it yourselves. We stay"
    effects: { commitment: 8, escalation: 6, public: 3, trust_primary: -6, allies: 2 }
    tags: [public_commitment, deterrence]
    set: [ultimatum:received]
    follow: [{ card: ultimatum_05_on_the_record, in: 1 }]
  right:
    text: "Ask what 'other means' means"
    effects: { public: -3, intel: 5, commitment: -2, military: -2, trust_primary: 1 }
    tags: [diplomacy, stall, intel]
    set: [ultimatum:received]
    follow: [{ card: ultimatum_06_the_call, in: 1 }]

# ---------------------------------------------------------------- their deadline (chained)

- id: ultimatum_05_on_the_record
  arc: ultimatum
  advisor: spin_doctor
  acts: [2, 5]
  tags: [commitment_trap, domestic]
  note: The word is out. Live in it or start thinning it.
  text: >-
    You said 'never' at 21:14 and by 21:20 it was the headline in three
    countries. We either live in that word or start thinning it tonight, one
    quiet briefing at a time.
  left:
    text: "Live in it. Every word"
    effects: { commitment: 6, public: 3, escalation: 3, trust_primary: -3 }
    tags: [public_commitment, domestic]
    follow: [{ card: ultimatum_06_the_call, in: 1 }]
  right:
    text: "Thin it out. Quietly"
    effects: { commitment: -4, public: -3, military: -2, trust_primary: 2 }
    tags: [walk_back, secrecy, domestic]
    follow: [{ card: ultimatum_06_the_call, in: 1 }]

- id: ultimatum_06_the_call
  arc: ultimatum
  advisor: hotline
  acts: [2, 5]
  tags: [diplomacy, commitment_trap]
  note: The offer. A pause is not a withdrawal, and everyone in both rooms knows the difference.
  text: >-
    '{Rival_leader} will extend the deadline three days if {us} announces a
    pause on the ridge.' A pause, not a withdrawal; the translator says it
    twice, the second time a question.
  left:
    text: "Announce the pause"
    effects: { escalation: -8, military: -5, commitment: -10, public: -4, trust_primary: 5 }
    tags: [deescalate, walk_back, diplomacy]
    set: [ultimatum:backed_down]
    follow: [{ card: ultimatum_26_the_ledger, in: 3 }]
  right:
    text: "Call the bluff. Hold"
    effects: { commitment: 8, escalation: 3 }
    tags: [deterrence, public_commitment]
    odds:
      label: They blink
      base: 0.45
      tags: [adversary]
      success:
        text: "At 05:40 their embassy rings to say the deadline has been 'clarified'. Nothing at Hollin Ridge has moved, theirs included."
        effects: { escalation: -6, public: 8, trust_primary: -4 }
        set: [ultimatum:called_bluff]
        follow: [{ card: ultimatum_25_the_formula, in: 3 }]
      failure:
        text: "06:00 comes and goes. At 06:12 their guns start firing on the ridge, one round every four minutes, so nobody can mistake it for anything else."
        effects: { escalation: 14, allies: -6, military: 2 }
        set: [ultimatum:deadline_passed]
        follow: [{ card: ultimatum_07_the_hour_after, in: 0 }]

- id: ultimatum_07_the_hour_after
  arc: ultimatum
  advisor: aide
  acts: [2, 5]
  timer: 10
  timeout: left
  tags: [commitment_trap, military, domestic]
  note: The deadline has passed and the guns are talking. Timeout raises the alert, the worse side.
  text: >-
    Forty minutes past the deadline, their guns fire on the ridge, a round
    every four minutes. The General wants a full alert; the Foreign Minister
    wants one sentence sent first.
  left:
    text: "Raise the alert. Fire back"
    effects: { military: 6, escalation: 10, public: 3, trust_primary: -8 }
    tags: [military, mobilise, escalatory]
    follow: [{ card: ultimatum_08_indicative, in: 1 }]
  right:
    text: "Send her sentence first"
    effects: { military: -5, public: -3, escalation: -3, trust_primary: 4, commitment: -3 }
    tags: [diplomacy, deescalate, stall]
    follow: [{ card: ultimatum_08_indicative, in: 1 }]

- id: ultimatum_08_indicative
  arc: ultimatum
  advisor: rival_leader
  acts: [2, 5]
  tags: [commitment_trap, diplomacy, domestic]
  note: Resolution for their passed deadline. Somebody in his room fought for a word, and won.
  text: >-
    'The hour was indicative; {rival} has shown strength and restraint, and
    will hold exercises at the crossing as needed.' Someone in his room
    fought for the word 'indicative'.
  left:
    text: "Let him have the word"
    effects: { escalation: -7, trust_primary: 6, public: -6, military: -4, commitment: -4 }
    tags: [deescalate, reassurance]
    set: [ultimatum:called_bluff]
  right:
    text: "Say what the hour was. Out loud"
    effects: { public: 7, commitment: 5, escalation: 5, trust_primary: -9, allies: -2 }
    tags: [public_commitment, deterrence, domestic]
    set: [ultimatum:called_bluff]

# ---------------------------------------------------------------- our deadline (chained)

- id: ultimatum_09_the_wording
  arc: ultimatum
  advisor: legal
  acts: [2, 5]
  tags: [commitment_trap, diplomacy]
  note: Name the consequence and it can be weighed. Leave it vague and they assume the worst and the mildest at once.
  text: >-
    'Consequences' promises nothing, so every ultimatum uses it. Name the
    depot at Tessel and they can weigh it; stay vague and they assume the
    worst and the mildest at once.
  left:
    text: "Name it. Tessel, Friday noon"
    effects: { commitment: 8, escalation: 5, military: 3, trust_primary: -5, public: 2 }
    tags: [public_commitment, commitment_trap, deterrence]
    follow: [{ card: ultimatum_11_friday_noon, in: 2 }]
  right:
    text: "Leave it at 'consequences'"
    effects: { commitment: 3, intel: -3, trust_primary: -3, military: -2, escalation: 2 }
    tags: [secrecy, misperception, deterrence]
    follow: [{ card: ultimatum_11_friday_noon, in: 2 }]

- id: ultimatum_10_the_private_word
  arc: ultimatum
  advisor: dove_fm
  acts: [2, 5]
  tags: [misperception, diplomacy, commitment_trap]
  note: A private ultimatum is the most dangerous kind, the kind they can decide to have misunderstood.
  text: >-
    Four people in {rival_capital} know your private deadline, and nobody has
    heard it on camera. Half-secret is the dangerous kind, the kind they can
    choose to have misunderstood.
  left:
    text: "Say it on camera"
    effects: { commitment: 8, public: 3, escalation: 5, trust_primary: -4 }
    tags: [public_commitment, deterrence]
    follow: [{ card: ultimatum_11_friday_noon, in: 1 }]
  right:
    text: "Withdraw it before they test it"
    effects: { commitment: -5, military: -6, public: -2, trust_primary: 3, escalation: -3 }
    tags: [walk_back, deescalate]
    set: [ultimatum:backed_down]
    follow: [{ card: ultimatum_26_the_ledger, in: 3 }]

- id: ultimatum_11_friday_noon
  arc: ultimatum
  advisor: aide
  acts: [2, 5]
  timer: 10
  timeout: left
  tags: [commitment_trap, military]
  note: Our deadline arrives. Left holds to it and rolls; right extends, which is a calendar.
  text: >-
    It is 11:52 and two of forty tanks have backed onto transporters; the
    General calls it theatre, the Foreign Minister a start. Your aircraft are
    circling, eight minutes to noon.
  left:
    text: "Noon is noon. Hold to it"
    effects: { military: 3, escalation: 5, commitment: 4 }
    tags: [deterrence, military, commitment_trap]
    odds:
      label: They blink
      base: 0.5
      tags: [adversary, military]
      success:
        text: "At 11:58 the column begins to move, slowly, in the right direction, filmed from both sides. The aircraft turn for home at 12:03."
        effects: { public: 9, military: 4, trust_primary: -5, escalation: -5 }
        set: [ultimatum:met]
        follow: [{ card: ultimatum_25_the_formula, in: 3 }]
      failure:
        text: "Noon. Two more tanks back onto transporters; thirty-eight do not, and your aircraft are still circling at the edge of their radar."
        effects: { escalation: 6, military: -2, public: -3 }
        set: [ultimatum:deadline_passed]
        follow: [{ card: ultimatum_12_the_consequence, in: 0 }]
  right:
    text: "Extend to Saturday. Recall them"
    effects: { commitment: -8, public: -6, military: -6, escalation: -4, trust_primary: 2 }
    tags: [walk_back, stall]
    follow: [{ card: ultimatum_13_the_second_deadline, in: 1 }]

- id: ultimatum_12_the_consequence
  arc: ultimatum
  advisor: hawk_general
  acts: [2, 5]
  timer: 9
  timeout: left
  tags: [commitment_trap, military, strike]
  note: The trap, in person. Forty minutes of fuel. Timeout delivers the strike, the worse side.
  text: >-
    Forty minutes of fuel, and the Tessel depot emptied at ten because they
    can read a map. Strike and their column may move; bring the aircraft home
    and your next deadline is paper.
  left:
    text: "Strike the depot"
    effects: { escalation: 14, military: 8, public: 4, trust_primary: -12, allies: -4 }
    tags: [limited_strike, military, escalatory, commitment_trap]
    follow: [{ card: ultimatum_14_the_answer, in: 1 }]
  right:
    text: "Bring the aircraft home"
    effects: { public: -9, commitment: -10, military: -7, allies: -5, trust_primary: 3, escalation: -4 }
    tags: [walk_back, concede]
    set: [ultimatum:backed_down]
    follow: [{ card: ultimatum_26_the_ledger, in: 2 }]

- id: ultimatum_13_the_second_deadline
  arc: ultimatum
  advisor: opposition
  acts: [2, 5]
  tags: [commitment_trap, domestic]
  note: A deadline that moves is a calendar. He will back Saturday if Saturday is real.
  text: >-
    I backed Friday noon on camera, and a deadline that moves is a calendar.
    Tell me Saturday is real and I defend it on air at six; if not, I stay
    silent, and you know the price.
  left:
    text: "Saturday is real. Say so"
    effects: { commitment: 10, public: 4, escalation: 5, trust_primary: -4 }
    tags: [public_commitment, commitment_trap, domestic]
    follow: [{ card: ultimatum_12_the_consequence, in: 2 }]
  right:
    text: "Drop the deadline. Quietly"
    effects: { commitment: -8, public: -7, military: -5, trust_primary: 4, escalation: -5, allies: -3 }
    tags: [walk_back, concede, deescalate]
    set: [ultimatum:backed_down]
    follow: [{ card: ultimatum_26_the_ledger, in: 2 }]

- id: ultimatum_14_the_answer
  arc: ultimatum
  advisor: hotline
  acts: [2, 5]
  tags: [diplomacy, commitment_trap, escalatory]
  note: Resolution for the delivered strike. The column moves and the word 'rotation' does a great deal of work.
  text: >-
    '{Rival} regards the attack on Tessel as an act of war and will respond at
    a time of its choosing.' Silence, then: 'The column will complete its
    scheduled rotation on Monday.'
  left:
    text: "Take Monday. Offer talks"
    effects: { escalation: -8, trust_primary: 5, public: -4, military: -4 }
    tags: [deescalate, diplomacy]
    set: [ultimatum:met]
  right:
    text: "Warn them off. Publicly"
    effects: { escalation: 6, commitment: 6, public: 4, trust_primary: -7, military: 3 }
    tags: [deterrence, public_commitment]
    set: [ultimatum:met]
    odds:
      label: They blink
      base: 0.4
      tags: [adversary]
      success:
        text: "Monday comes and the column goes. Nothing else does."
        effects: { public: 5, escalation: -4, trust_primary: -3 }
      failure:
        text: "At 03:10 on Monday a fuel depot outside {capital} burns for six hours. Nobody claims it, and nobody needs to."
        effects: { escalation: 12, public: -6, economy: -4 }

# ---------------------------------------------------------------- developments (pieces)

- id: ultimatum_15_two_readings
  arc: ultimatum
  advisor: dove_fm
  acts: [2, 5]
  tags: [misperception, diplomacy, commitment_trap]
  conditions:
    flags_any: [ultimatum:received, ultimatum:issued]
    flags_none: [ultimatum:deadline_passed, ultimatum:backed_down]
    pieces_any: [strategic_ambiguity]
  note: Strategic Ambiguity, the gift. They are acting on both readings at once.
  text: >-
    {Rival_capital} reads your silence two ways: about to strike, or about to
    fold. They act on both, so their reserves mobilise while their trade
    delegation stays in {capital}.
  left:
    text: "Tell them which. Privately"
    effects: { trust_primary: 6, commitment: 4, intel: 3, military: -3, public: -2 }
    tags: [diplomacy, back_channel, transparency]
  right:
    text: "Let them keep both"
    effects: { intel: -4, escalation: 4, trust_primary: -3, military: 3 }
    tags: [secrecy, misperception, deterrence]

- id: ultimatum_16_the_wrong_signal
  arc: ultimatum
  advisor: hawk_general
  acts: [2, 5]
  tags: [misperception, military]
  conditions:
    flags_any: [ultimatum:received, ultimatum:issued]
    flags_none: [ultimatum:deadline_passed]
    pieces_any: [strategic_ambiguity]
  note: Strategic Ambiguity, the bill. A routine exercise has been read as the answer.
  text: >-
    A brigade left for its spring exercise at 05:00, as every year, and at
    07:00 their embassy asked if that was our answer. Stand it down visibly
    or finish it; either is an answer.
  left:
    text: "Stand it down. Visibly"
    effects: { military: -6, public: -3, trust_primary: 5, escalation: -4, commitment: -3 }
    tags: [deescalate, reassurance, military]
  right:
    text: "Finish the exercise"
    effects: { military: 4, escalation: 5, commitment: 3 }
    tags: [military, deterrence, misperception]
    odds:
      label: They understand
      base: 0.5
      tags: [adversary, intel]
      success:
        text: "Their embassy rings back at noon. Someone has found the exercise in last year's notice."
        effects: { trust_primary: 2, escalation: -3 }
      failure:
        text: "Two of their regiments leave barracks at 14:00. Their embassy does not ring back."
        effects: { escalation: 8, trust_primary: -6, intel: -2 }

- id: ultimatum_17_any_means_any
  arc: ultimatum
  advisor: legal
  acts: [2, 5]
  timer: 10
  timeout: left
  tags: [commitment_trap, military]
  conditions:
    flags_any: [ultimatum:received, ultimatum:issued]
    flags_none: [ultimatum:deadline_passed, ultimatum:backed_down]
    pieces_any: [red_lines]
  note: Red Lines, the gift and the bill in one. Two hundred metres for eleven minutes. Timeout answers, the worse side.
  text: >-
    You said 'any crossing' on camera; at 03:10 six {rival_adj} soldiers
    stepped into Vestria for eleven minutes. Your battalion commander heard
    you too, and asks what 'any' means.
  left:
    text: "Any means any. Answer it"
    effects: { military: 5, escalation: 9, commitment: 6, trust_primary: -7, public: 3 }
    tags: [military, public_commitment, commitment_trap, escalatory]
    odds:
      label: They withdraw
      base: 0.55
      tags: [adversary, military]
      success:
        text: "Their unit pulls back four kilometres by dusk, with an apology about the map."
        effects: { public: 5, trust_primary: -3, escalation: -3 }
      failure:
        text: "The battalion fires on the next patrol at 19:40. One of theirs is dead on our side of a line nobody has drawn."
        effects: { escalation: 10, trust_primary: -8, allies: -3 }
  right:
    text: "That was not a crossing"
    effects: { commitment: -6, public: -6, military: -5, trust_primary: 3, escalation: -2 }
    tags: [walk_back, stall]

- id: ultimatum_18_your_own_words
  arc: ultimatum
  advisor: opposition
  acts: [2, 5]
  tags: [commitment_trap, domestic]
  conditions:
    flags_all: [ultimatum:received]
    flags_none: [ultimatum:backed_down]
    pieces_any: [red_lines]
  note: Red Lines, the bill. The promise was 'within the hour' and the hour was 13:00.
  text: >-
    You promised to answer any deadline from {rival_capital} within the hour,
    and I applauded on film. It is 14:00, the hour was 13:00, and at four
    someone will ask me if you did.
  left:
    text: "Answer it now. Whatever it takes"
    effects: { commitment: 8, escalation: 6, public: 4, trust_primary: -5, military: 3 }
    tags: [public_commitment, deterrence, domestic, commitment_trap]
  right:
    text: "Say it was a figure of speech"
    effects: { public: -8, commitment: -5, allies: -2, trust_primary: 2 }
    tags: [walk_back, domestic]

- id: ultimatum_19_the_climbdown
  arc: ultimatum
  advisor: spin_doctor
  acts: [2, 5]
  weight: 1.2
  tags: [commitment_trap, domestic]
  conditions:
    flags_all: [ultimatum:backed_down]
    pieces_any: [spin_doctor]
  note: Spin Doctor, the gift. Nobody says 'climbdown' if we do not.
  text: >-
    Nobody says 'climbdown' unless we do, so it is a 'pause pending review',
    reporting after the by-election. They will know it is a lie, and a lie
    they see through is a courtesy.
  left:
    text: "Pause pending review"
    effects: { public: 6, trust_primary: -5, commitment: 2, intel: -2 }
    tags: [secrecy, domestic, misperception]
  right:
    text: "Say what we did and why"
    effects: { public: -6, trust_primary: 6, allies: 3, commitment: -3 }
    tags: [transparency, domestic, reassurance]

- id: ultimatum_20_the_half_life
  arc: ultimatum
  advisor: spin_doctor
  acts: [2, 5]
  tags: [commitment_trap, domestic]
  conditions:
    flags_any: [ultimatum:received, ultimatum:issued]
    flags_none: [ultimatum:backed_down, ultimatum:deadline_passed]
    pieces_any: [spin_doctor]
  note: Spin Doctor, the bill. He sold the word too well and now it polls at seventy-one.
  text: >-
    I sold 'never' to every front page and it polls at seventy-one; nobody
    quietly buys a word back from there. I break it now, in briefings nobody
    reads, or you mean it by Friday.
  left:
    text: "Start breaking it. Quietly"
    effects: { commitment: -6, public: -5, military: -3, trust_primary: 3 }
    tags: [walk_back, secrecy, domestic]
  right:
    text: "Keep it. Mean it"
    effects: { commitment: 8, public: 3, escalation: 4, trust_primary: -3 }
    tags: [public_commitment, deterrence, domestic]

- id: ultimatum_21_the_open_line
  arc: ultimatum
  advisor: hotline
  acts: [2, 5]
  weight: 1.2
  tags: [diplomacy, commitment_trap, deescalate]
  conditions:
    flags_any: [ultimatum:received, ultimatum:issued]
    flags_none: [ultimatum:deadline_passed, ultimatum:backed_down]
    pieces_any: [hotline_protocol]
  note: Hotline Protocol, the gift. The call costs nothing at home; the freeze still costs.
  text: >-
    '{Rival_leader} will take a call at 22:00, no agenda, private on both
    sides.' The line stays open afterwards, which it never has, and you can
    hear a clock in {rival_capital}.
  left:
    text: "Take the call. Offer a freeze"
    effects: { escalation: -9, trust_primary: 8, military: -5, public: -4, commitment: -5 }
    tags: [deescalate, diplomacy, back_channel]
    spend_charge: deescalation
  right:
    text: "Not while the deadline stands"
    effects: { commitment: 5, escalation: 4, trust_primary: -6, military: 2 }
    tags: [deterrence, stall]

- id: ultimatum_22_three_calls
  arc: ultimatum
  advisor: hotline
  acts: [2, 5]
  timer: 9
  timeout: right
  tags: [diplomacy, misperception, commitment_trap]
  conditions:
