# ---------------------------------------------------------------- the road to the room (chained)

- id: summit_05_preconditions
  arc: summit
  advisor: hawk_general
  acts: [2, 5]
  tags: [diplomacy, military, deterrence]
  note: Their yes has a price and the price is the thing the meeting was for.
  text: >-
    Their answer at 04:00 is yes, if we cancel the spring exercises before
    anyone flies. Cancel and you arrive having already paid; they will know
    what the next thing costs.
  left:
    text: "Cancel them. Board the plane"
    effects: { military: -7, public: -4, trust_primary: 8, escalation: -5, commitment: -4 }
    tags: [concede, deescalate, reassurance]
    follow: [{ card: summit_07_the_venue, in: 1 }]
  right:
    text: "No conditions. Meet or don't"
    effects: { military: 3, trust_primary: -4, commitment: 5, escalation: 3, public: 2 }
    tags: [deterrence, public_commitment]
    follow: [{ card: summit_08_no_plans_to_travel, in: 2 }]

- id: summit_06_silence_from_kaskad
  arc: summit
  advisor: ambassador
  acts: [2, 5]
  tags: [misperception, diplomacy, back_channel]
  note: Nine days of silence, read two ways in their capital. The colleague wrote a very good memoir.
  text: >-
    Nine days, no invitation, but they told {other_capital} one would be
    considered, which is how a proud man asks. A colleague let one run a
    week too long and wrote a fine memoir.
  left:
    text: "Send the invitation. Today"
    effects: { trust_primary: 6, public: -4, commitment: -3, military: -3, escalation: -3 }
    tags: [diplomacy, reassurance]
    follow: [{ card: summit_07_the_venue, in: 1 }]
  right:
    text: "Wait one more week"
    effects: { trust_primary: -5, escalation: 5, intel: 2, military: 2 }
    tags: [stall, deterrence, misperception]
    follow: [{ card: summit_08_no_plans_to_travel, in: 2 }]

- id: summit_07_the_venue
  arc: summit
  advisor: envoy
  acts: [2, 5]
  tags: [diplomacy, alliance]
  note: Whoever travels is the one who wanted it. She can tell each side the other asked first.
  text: >-
    Both sides will meet and neither will say where, as whoever travels
    wanted it more. I have a house at Vellmar, a neutral flag, and can tell
    each side the other asked first.
  left:
    text: "Vellmar. Tell them we asked"
    effects: { trust_primary: 7, trust_secondary: 3, public: -5, military: -3, commitment: -3 }
    tags: [diplomacy, reassurance, concede]
    set: [summit:agreed]
    follow: [{ card: summit_10_the_night_before, in: 3 }]
  right:
    text: "They come to {capital} or nowhere"
    effects: { public: 4, commitment: 5, trust_primary: -4, military: 2 }
    tags: [deterrence, public_commitment]
    odds:
      label: They accept
      base: 0.4
      tags: [adversary, diplomacy]
      success:
        text: "They accept, on condition it is called a working visit and their plane is not filmed landing."
        effects: { public: 6, trust_primary: -2, allies: 2 }
        set: [summit:agreed]
        follow: [{ card: summit_10_the_night_before, in: 3 }]
      failure:
        text: "Their answer is a photograph of their delegation at the airport, not boarding."
        effects: { trust_primary: -5, escalation: 4, public: -3 }
        follow: [{ card: summit_08_no_plans_to_travel, in: 1 }]

- id: summit_08_no_plans_to_travel
  arc: summit
  advisor: press
  acts: [2, 5]
  timer: 10
  timeout: right
  tags: [diplomacy, domestic, misperception]
  note: Who blinks first about attending. Timeout is neither of us going, the worse side.
  text: >-
    {Rival_capital} says {rival_leader} 'has no plans to travel', twelve
    hours after your office leaked a date. I am on at nine: are you flying
    to a meeting he skips, or not at all?
  left:
    text: "We are going. He will come"
    effects: { commitment: 6, public: -3, trust_primary: 4, military: -3 }
    tags: [public_commitment, reassurance, diplomacy]
    odds:
      label: He boards
      base: 0.5
      tags: [adversary, diplomacy]
      success:
        text: "His plane leaves {rival_capital} at 05:10, unannounced, and his office issues a correction about the word 'plans'."
        effects: { public: 6, trust_primary: 4, escalation: -4 }
        set: [summit:agreed]
        follow: [{ card: summit_10_the_night_before, in: 2 }]
      failure:
        text: "You land at Vellmar at 08:00. He does not."
        effects: { public: -8, trust_primary: -5, allies: -3, escalation: 3 }
        set: [summit:collapsed]
        follow: [{ card: summit_14_the_empty_chair, in: 0 }]
  right:
    text: "Then neither are we"
    effects: { public: 3, commitment: 4, trust_primary: -7, escalation: 5, allies: -3 }
    tags: [deterrence, walk_back, domestic]
    set: [summit:collapsed]
    follow: [{ card: summit_14_the_empty_chair, in: 1 }]

- id: summit_10_the_night_before
  arc: summit
  advisor: family
  acts: [2, 5]
  tags: [personal, domestic]
  note: Wheels up at six. Only one of them sleeps.
  text: >-
    Wheels up at six, and the soup has gone cold. Tell me if you are going as
    the office or as yourself, because I have met both, and only one of them
    sleeps.
  left:
    text: "Go as yourself. For an hour"
    effects: { trust_primary: 6, commitment: -4, military: -3, public: -2 }
    tags: [personal, reassurance]
    follow: [{ card: summit_11_the_room, in: 1 }]
  right:
    text: "Go as the office"
    effects: { trust_primary: -3, commitment: 4, military: 2, public: 2 }
    tags: [personal, deterrence]
    follow: [{ card: summit_11_the_room, in: 1 }]

- id: summit_11_the_room
  arc: summit
  advisor: rival_leader
  acts: [2, 5]
  timer: 10
  timeout: right
  tags: [diplomacy, personal, misperception]
  note: The summit itself. He asks in your language, badly, and waits. Timeout says none, the worse side.
  text: >-
    'My forty generals call this a mistake, and I tell none of them this: I
    do not know what your battalion on the ridge is for.' He asks in your
    language, badly, how many you have.
  left:
    text: "Tell him the truth. All of it"
    effects: { trust_primary: 10, commitment: -5, military: -5, intel: -3 }
    tags: [transparency, personal, reassurance]
    set: [summit:held]
    follow: [{ card: summit_12_the_last_sentence, in: 1 }]
  right:
    text: "Say none. Ask about his"
    effects: { trust_primary: -5, commitment: 4, intel: 3, military: 2 }
    tags: [secrecy, deterrence, intel]
    set: [summit:held]
    follow: [{ card: summit_13_the_walkout, in: 1 }]

- id: summit_12_the_last_sentence
  arc: summit
  advisor: dove_fm
  acts: [2, 5]
  tags: [diplomacy, reassurance, alliance]
  note: Resolution. The communique is agreed except for the last sentence, which is theirs and about Vestria.
  text: >-
    All agreed but their last line, leaving Vestria to 'the parties
    concerned', which our ally will call a sell-out. Sign and we fly home
    with a paper; strike it and with a handshake.
  left:
    text: "Sign it, sentence and all"
    effects: { escalation: -14, trust_primary: 10, allies: -8, public: -4, commitment: -5 }
    tags: [diplomacy, concede, deescalate]
    set: [summit:communique]
  right:
    text: "Strike the line. Shake hands"
    effects: { escalation: -6, trust_primary: -3, allies: 4, public: 2, military: -2, commitment: 2 }
    tags: [diplomacy, alliance, stall]

- id: summit_13_the_walkout
  arc: summit
  advisor: rival_leader
  acts: [2, 5]
  timer: 9
  timeout: right
  tags: [diplomacy, misperception, personal]
  note: The General's note is on his desk and on the front page. He is standing; his delegation is watching him. Timeout lets him go.
  text: >-
    'Your General's note is on my desk and on my front pages: this meeting
    buys you six weeks, and I did not come to be six weeks.' He stands; his
    people watch to see if they should.
  left:
    text: "Sit down. I will explain the note"
    effects: { public: -3, military: -6, trust_primary: 4, commitment: -3 }
    tags: [transparency, reassurance, diplomacy]
    odds:
      label: He sits
      base: 0.55
      tags: [adversary, diplomacy]
      success:
        text: "He sits. It takes eleven minutes, and the delegation sits after him, one by one, like a jury."
        effects: { trust_primary: 6, escalation: -4 }
        follow: [{ card: summit_12_the_last_sentence, in: 1 }]
      failure:
        text: "He leaves by the lake door so the cameras at the front will miss it. They have it by noon anyway."
        effects: { trust_primary: -6, escalation: 6, public: -5 }
        set: [summit:collapsed]
        follow: [{ card: summit_14_the_empty_chair, in: 1 }]
  right:
    text: "Let him go. Let them film it"
    effects: { public: 5, trust_primary: -10, escalation: 8, allies: -2, commitment: 4 }
    tags: [deterrence, domestic, escalatory]
    set: [summit:collapsed]
    follow: [{ card: summit_14_the_empty_chair, in: 1 }]

- id: summit_14_the_empty_chair
  arc: summit
  advisor: press
  acts: [2, 5]
  tags: [domestic, diplomacy, misperception]
  note: Resolution for collapse. Two chairs, a lake, and two minutes of airtime.
  text: >-
    Two chairs, a lake, a hundred and forty journalists who came for a
    handshake and are filing about the weather. You have two minutes at
    nine; say something that is not 'regret'.
  left:
    text: "Say the door stays open"
    effects: { public: -6, trust_primary: 4, escalation: -3, military: -3 }
    tags: [reassurance, diplomacy, deescalate]
  right:
    text: "Say we were never going to beg"
    effects: { public: 6, trust_primary: -8, escalation: 6, allies: -3 }
    tags: [deterrence, public_commitment, domestic]

# ---------------------------------------------------------------- developments (pieces)

- id: summit_09_the_handshake
