    officers ask who runs the policy.
  left:
    text: "She is. Say so, in the building"
    effects: { military: -7, trust_primary: 5, allies: -2, escalation: -3 }
    tags: [diplomacy, reassurance, domestic]
  right:
    text: "Route it through Defence"
    effects: { military: 5, trust_primary: -6, escalation: 3, intel: 2 }
    tags: [deterrence, military, secrecy]

- id: summit_20_half_of_them
  arc: summit
  advisor: rival_leader
  acts: [2, 5]
  tags: [nuclear, reassurance, diplomacy, misperception]
  conditions:
    flags_all: [summit:proposed]
    flags_none: [summit:collapsed]
    pieces_any: [no_first_use]
  note: No First Use, the gift. Half of his generals believe it, and he does not know which half he is.
  text: >-
    'Half my generals believe you will not fire first; half think a man who
    says that has arranged not to need to. I do not know which half I am;
    show me what you would show them.'
  left:
    text: "Inspectors at the silos. Theirs"
    effects: { trust_primary: 10, military: -8, intel: 3, public: -3, allies: -3 }
    tags: [transparency, nuclear, reassurance]
  right:
    text: "Tell him half is enough"
    effects: { trust_primary: -3, military: 2, escalation: 2, commitment: 2 }
    tags: [deterrence, stall, nuclear]

- id: summit_21_the_other_half
  arc: summit
  advisor: hawk_general
  acts: [2, 5]
  timer: 10
  timeout: left
  tags: [military, nuclear, misperception]
  conditions:
    flags_all: [summit:proposed]
    pieces_any: [no_first_use]
  note: No First Use, the bill. A man who is sure you will not fire first has no reason to hurry. Timeout sends the regiment.
  text: >-
    They believe you will not fire first, so two of their regiments crossed
    the river at Sallow in daylight; a man sure of that need not hurry. A
    regiment can reach the ridge by dusk.
  left:
    text: "Send a regiment. Ridge by dusk"
    effects: { military: 6, escalation: 7, trust_primary: -6, public: 3 }
    tags: [military, mobilise, deterrence]
    odds:
      label: They pull back
      base: 0.45
      tags: [adversary, military]
      success:
        text: "Their regiments recross at dawn. Their notice calls it the end of an exercise."
        effects: { trust_primary: -3, escalation: -4, public: 3 }
      failure:
        text: "They stay, and now two regiments face one across a river forty metres wide."
        effects: { escalation: 8, trust_primary: -5, military: 2 }
  right:
    text: "Hold. Let them come closer"
    effects: { military: -5, trust_primary: 4, escalation: 3, public: -4, intel: 2 }
    tags: [stall, reassurance, military]

- id: summit_22_the_square
  arc: summit
  advisor: press
  acts: [2, 5]
  tags: [domestic, deescalate, diplomacy]
  conditions:
    flags_all: [summit:proposed]
    flags_none: [summit:collapsed]
    pieces_any: [peace_leader]
  note: The Peace Movement loves it. A banner with your face on it, which is new.
  text: >-
    The peace crowd has the square again, three hundred thousand by the
    police count, a million by theirs, until you fly. Candles, and a banner
