  advisor: hawk_general
  acts: [2, 5]
  tags: [deterrence, domestic, military]
  conditions:
    flags_all: [summit:proposed]
    flags_none: [summit:held, summit:collapsed]
    pieces_any: [hawk_general]
  note: The General hates the optics. Nothing is being advised against; things are being noted.
  text: >-
    The photograph is you shaking his hand under two flags, the same week
    their tanks sat at the crossing. Nobody advises against it; the timing is
    noted, as is who was not asked.
  left:
    text: "No photograph. Keep the table"
    effects: { trust_primary: -5, military: 3, public: 2, allies: -2, commitment: 2 }
    tags: [deterrence, domestic]
  right:
    text: "Shake his hand. Both flags"
    effects: { military: -6, trust_primary: 7, public: -3, escalation: -3 }
    tags: [reassurance, diplomacy, deescalate]

