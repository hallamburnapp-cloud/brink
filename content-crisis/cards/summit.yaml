- id: summit_16_the_academic
  arc: summit
  advisor: dove_fm
  acts: [2, 5]
  tags: [back_channel, diplomacy, secrecy]
  conditions:
    flags_all: [summit:proposed]
    flags_none: [summit:collapsed, summit:held]
    pieces_any: [back_channel]
  note: The Back-Channel's gift. A promise about a document that does not exist, made to people who will remember it.
  text: >-
    Our man and theirs lunched abroad: they come if 'withdrawal' is in
    nothing we sign, and nobody admits the lunch. I can promise the second;
    the first is a paper not yet written.
  left:
    text: "Promise both. Deniably"
    effects: { trust_primary: 8, commitment: -4, allies: -3, public: -2 }
    tags: [back_channel, secrecy, diplomacy]
    odds:
      label: It holds
      base: 0.6
      tags: [back_channel]
      success:
        text: "It holds. Their delegation list arrives three days later, through the same lunch."
        effects: { trust_primary: 4, escalation: -4 }
        set: [summit:agreed]
        follow: [{ card: summit_10_the_night_before, in: 3 }]
      failure:
        text: "Someone on their side uses the word in a speech, to a home crowd, on purpose. The lunch is off and so, for now, is the table."
        effects: { trust_primary: -5, escalation: 4, intel: -2 }
  right:
    text: "Refuse. Nothing off the record"
    effects: { trust_primary: -5, public: 3, allies: 2, commitment: 3 }
    tags: [transparency, deterrence]

- id: summit_17_consecutive_days
  arc: summit
  advisor: press
  acts: [2, 5]
  tags: [back_channel, domestic, secrecy]
  conditions:
    flags_all: [summit:proposed]
    pieces_any: [ambassador, back_channel]
  note: The channel's bill. Same restaurant, same table by the window, consecutive days.
  text: >-
    A professor lunched with their deputy minister on Tuesday and your
    Ambassador on Wednesday, same restaurant, same window table, and I have
    the photographs. Is there a channel?
  left:
    text: "Deny it. There is no channel"
    effects: { public: 3, trust_primary: -7, intel: -3, commitment: 2 }
    tags: [secrecy, domestic]
  right:
    text: "Confirm it. Let her print it"
    effects: { public: -5, allies: -4, trust_primary: 3, military: -2 }
    tags: [transparency, domestic, back_channel]

- id: summit_18_the_promise
  arc: summit
  advisor: dove_fm
  acts: [2, 5]
  tags: [reassurance, nuclear, diplomacy]
  conditions:
    flags_all: [summit:proposed]
    flags_none: [summit:collapsed, summit:held]
    pieces_any: [dove_fm]
  note: The Dove's gift. One sentence before the plane; they hear weakness first and the other thing later.
  text: >-
    One sentence in public before we fly: while the talks last, {us} will
    not fire first. They will hear weakness, the General is right; the rest
    they hear later, when we need it.
  left:
    text: "Say it. On camera"
    effects: { trust_primary: 9, military: -6, public: -4, escalation: -4, commitment: 4 }
    tags: [reassurance, public_commitment, nuclear]
  right:
    text: "Keep it for the room"
    effects: { trust_primary: -3, military: 2, public: 2, escalation: 2 }
    tags: [deterrence, secrecy]

- id: summit_19_eleven_calls
  arc: summit
  advisor: hawk_general
  acts: [2, 5]
  tags: [domestic, military, diplomacy]
  conditions:
    flags_all: [summit:proposed]
    pieces_any: [dove_fm]
  note: The Dove's bill. Their side has started answering military notifications through her office.
  text: >-
    Eleven calls in nine days between the Foreign Minister and theirs, and
