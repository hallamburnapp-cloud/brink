  weight: 1.2
  tags: [diplomacy, alliance]
  conditions: { flags_none: [summit:proposed] }
  note: Entry, mid. The Assembly's house, with the Assembly's paragraph attached.
  text: >-
    The Assembly offers its lake house at Vellmar from the fourteenth;
    {rival_capital} has quietly said yes. The price is the inspections your
    General has refused for two years.
  left:
    text: "Take the house. Accept inspections"
    effects: { trust_primary: 5, trust_secondary: 4, military: -6, allies: 3, commitment: 3 }
    tags: [diplomacy, alliance, transparency]
    set: [summit:proposed]
    follow: [{ card: summit_05_preconditions, in: 2 }]
  right:
    text: "Pick our own venue"
    effects: { trust_secondary: -4, allies: -3, commitment: 3, public: 3 }
    tags: [deterrence, stall, diplomacy]
    set: [summit:proposed]
    follow: [{ card: summit_07_the_venue, in: 1 }]

