# summit — a leaders' meeting is floated, and then everything that comes before
# one: preconditions, a venue, and who is seen to want it more. Forces: the
# difference between deterrence and reassurance (what makes them believe you is
# what makes you look weak at home), the back channel (an academic's lunches,
# the Ambassador's old friends), the Dove and No First Use (trust that accrues
# while your generals watch it accrue), the Assembly's Secretary (a house on a
# lake, at a price), the Peace Movement (a full square) and the General (the
# photograph). The world: our battalion sits on Hollin Ridge in Vestria; their
# column sits at the Sallow crossing in Amberline; the Assembly's house is at
# Vellmar, on the lake.
# Flags: summit:proposed, summit:agreed, summit:collapsed, summit:held, summit:communique.
# Cross-hooks (flags_any): ultimatum:received, debris:event, blockade:declared.
# Piece hooks: ambassador, back_channel, dove_fm, no_first_use (and peace_leader,
# hawk_general for the optics).

# ---------------------------------------------------------------- entries (non-chained)

- id: summit_01_a_lunch_in_amberline
  arc: summit
  advisor: ambassador
  acts: [2, 3]
  weight: 1.5
  tags: [diplomacy, back_channel]
  conditions: { flags_none: [summit:proposed] }
  note: Entry, early. The sentence is the whole message. Asking first costs face at home; waiting costs trust.
  text: >-
    The man who taught {rival_leader} his second language lunched with me
    yesterday and said, over the fish, that his pupil would not refuse a
    meeting. He did not say who should ask.
  left:
    text: "Ask for it. Publicly, tonight"
    effects: { trust_primary: 7, escalation: -4, public: -5, military: -4, commitment: -3 }
    tags: [diplomacy, reassurance, public_commitment]
    set: [summit:proposed]
    follow: [{ card: summit_05_preconditions, in: 1 }]
  right:
    text: "Let them ask first"
    effects: { trust_primary: -3, intel: 3, public: 2, escalation: 2 }
    tags: [stall, deterrence]
    set: [summit:proposed]
    follow: [{ card: summit_06_silence_from_kaskad, in: 2 }]

