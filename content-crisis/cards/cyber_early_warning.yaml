# CYBER EARLY WARNING — malware inside the early-warning network. Forces: entanglement of
# dual-use systems (the correlator watches for missiles and routes civilian traffic),
# attribution ambiguity (cyber_unit / cyber_director make it resolvable by odds), the logic
# of touching someone's warning system, and transparency versus secrecy.
# Flags: cyber_ew:intrusion, cyber_ew:attributed, cyber_ew:purged, cyber_ew:counterhacked,
# cyber_ew:disclosed. Cross-hooks (flags_any): false_alarm:reported, blackout:started.

# ---------------------------------------------------------------- entry 1 (acts 2–3)
- id: cyberew_01_resident
  arc: cyber_early_warning
  advisor: cyber_director
  acts: [2, 3]
  weight: 1.6
  tags: [cyber, entanglement, warning]
  conditions: { flags_none: [cyber_ew:intrusion] }
  note: Arc entry. The correlator cannot be half offline.
  text: >-
    Someone's program has been on our missile-warning computer since spring, just
    reading. It also runs the emergency phones for three provinces, and I cannot
    switch off half of it.
  left:
    text: "Take it offline. All of it."
    effects: { military: -5, public: -4, economy: -2, intel: -2 }
    tags: [cyber, investigate, entanglement]
    set: [cyber_ew:intrusion]
    follow: [{ card: cyberew_04_dark_sector, in: 1 }]
  right:
    text: "Leave it. Watch what it reads."
    effects: { intel: -4, escalation: 2, military: 2 }
    tags: [cyber, stall, secrecy, intel]
    set: [cyber_ew:intrusion]
    follow: [{ card: cyberew_05_it_writes, in: 2 }]

# ---------------------------------------------------------------- entry 2 (acts 3–4)
- id: cyberew_02_liaison_sample
  arc: cyber_early_warning
  advisor: intel_director
  acts: [3, 4]
  weight: 1.3
  tags: [cyber, alliance, intel]
  conditions: { flags_none: [cyber_ew:intrusion] }
  note: Arc entry. An ally found it first and kept it.
  text: >-
    Our ally's spies sent us code from their air-defence network; it matches ours on
    the missile-warning computer exactly. They found theirs six weeks ago and chose
    not to tell us.
  left:
    text: "Ask our ally's prime minister why"
    effects: { allies: -5, intel: 4, commitment: 2 }
    tags: [alliance, alliance_demand, intel]
    set: [cyber_ew:intrusion]
  right:
    text: "Say nothing. Sweep everything."
    effects: { military: -3, intel: 2, allies: 2, economy: -1 }
    tags: [cyber, investigate, secrecy]
    set: [cyber_ew:intrusion]

# ---------------------------------------------------------------- entry 3 (acts 4–5)
- id: cyberew_03_correlator_word
  arc: cyber_early_warning
  advisor: press
  acts: [4, 5]
  weight: 1.3
  timer: 9
  timeout: right
  tags: [cyber, domestic, transparency]
  conditions: { flags_none: [cyber_ew:intrusion] }
  note: Arc entry, late. The press has the story first. Timeout is no comment, the worse side.
  text: >-
    Was the missile-warning network hacked in the spring, and did you know before or
    after the last alert? Two of your people gave me the machine's name, and I print
    at six either way.
  left:
    text: "Confirm it. Get ahead of it."
    effects: { public: -6, allies: 3, trust_primary: 2, intel: -2 }
    tags: [transparency, domestic, cyber]
    set: [cyber_ew:intrusion, cyber_ew:disclosed]
  right:
    text: "No comment. Find her two people."
    effects: { public: -3, intel: -3, military: 2, commitment: 3 }
    tags: [secrecy, domestic, investigate]
    set: [cyber_ew:intrusion]

# ---------------------------------------------------------------- follow-ups of entry 1
- id: cyberew_04_dark_sector
  arc: cyber_early_warning
  advisor: watch_officer
  acts: [2, 5]
  timer: 8
  timeout: left
  tags: [cyber, entanglement, warning]
  note: Follows 01 left. Timeout brings the process back with the phones, the worse side.
  text: >-
    Our northern radar is dark since 03:50, back in twenty hours. Three provinces'
    emergency calls go via Amberline, nine seconds late, and the governors are
    on breakfast television.
  left:
    text: "Bring it back now, bug and all"
    effects: { public: 4, military: 3, intel: -6, escalation: 2 }
    tags: [stall, entanglement, cyber]
  right:
    text: "Stay dark until it is clean"
    effects: { public: -5, economy: -2, intel: 5, military: -2 }
    tags: [investigate, cyber, entanglement]
    set: [cyber_ew:purged]

- id: cyberew_05_it_writes
  arc: cyber_early_warning
  advisor: cyber_director
  acts: [2, 5]
  timer: 9
  timeout: left
  tags: [cyber, warning, misperception]
  note: Follows 01 right. Timeout purges tonight and burns what we learned, the worse side.
  text: >-
    At 01:15 the warning screen showed a missile for four seconds that no radar saw,
    and the intruder touched the screen a fifth of a second first. It is writing
    now, not just reading.
  left:
    text: "Purge it tonight"
    effects: { military: 3, intel: 3, escalation: 3, trust_primary: -3 }
    tags: [cyber, military]
    set: [cyber_ew:purged]
  right:
    text: "Unplug it from the launch chain"
    effects: { military: -6, intel: 4, escalation: -2 }
    tags: [deescalate, cyber, nuclear, investigate]

# ---------------------------------------------------------------- attribution
- id: cyberew_06_consistent_with
  arc: cyber_early_warning
  advisor: cyber_director
  acts: [2, 5]
  weight: 1.2
  tags: [cyber, attribution, misperception]
  conditions:
    flags_all: [cyber_ew:intrusion]
    flags_none: [cyber_ew:attributed]
    pieces_none: [cyber_unit, cyber_director]
  note: Attribution without the pieces. A coin flip dressed as a decision.
  text: >-
    The code looks like {rival}'s, and like the two services that copied {rival},
    and anyone who bought from them. The General sees no difference, and he is not
    the one quoted.
  left:
    text: "Name {rival}"
    effects: { escalation: 6, trust_primary: -8, public: 4, commitment: 5 }
    tags: [attribution, public_commitment, cyber]
    set: [cyber_ew:attributed]
    odds:
      label: It sticks
      base: 0.5
      tags: [attribution]
      success:
        text: "Two allied spy services back us within the day. Nobody asks how they know either."
        effects: { public: 3, allies: 3 }
      failure:
        text: "A neutral forensics firm publishes a report pointing at {other}. It is wrong too, but it is loud, and now nobody is right."
        effects: { public: -5, trust_secondary: -4, intel: -3 }
  right:
    text: "Say nothing until we are sure"
    effects: { military: -3, public: -3, intel: 2 }
    tags: [stall, attribution, intel]

- id: cyberew_07_working_hours
  arc: cyber_early_warning
  advisor: cyber_director
  acts: [2, 5]
  weight: 1.4
  tags: [cyber, attribution, intel]
  conditions:
    flags_all: [cyber_ew:intrusion]
    flags_none: [cyber_ew:attributed]
    pieces_any: [cyber_unit, cyber_director]
  note: Attribution with the pieces. Resolvable by an attribution/cyber roll; failure points somewhere else.
  text: >-
    The hacker keeps office hours: weekdays, 09:00 to 17:40, one time zone, and a
    two-week gap that is one capital's holiday. A careful service can fake that,
    and I need a day.
  left:
    text: "Take the day. Be sure."
    effects: { intel: 3, military: -2 }
    tags: [attribution, cyber, investigate]
    odds:
      label: Proven
      base: 0.5
      tags: [attribution, cyber]
      success:
        text: "It is {rival}, no doubt left. The trail runs through a contractor in {rival_capital} whose only customer is their spy service."
        effects: { intel: 6, trust_primary: -5, escalation: 3 }
        set: [cyber_ew:attributed]
      failure:
        text: "The trail runs into {other} and stops there, very neatly. When everything points at one place, that is a finding too, and not the one you wanted."
        effects: { intel: -4, trust_secondary: -4, escalation: 2 }
  right:
    text: "Act on it now. Name them."
    effects: { escalation: 6, trust_primary: -7, public: 3, commitment: 4 }
    tags: [attribution, public_commitment, cyber, escalatory]
    set: [cyber_ew:attributed]

# ---------------------------------------------------------------- the purge or the feed
- id: cyberew_08_the_purge
  arc: cyber_early_warning
  advisor: cyber_director
  acts: [2, 5]
  weight: 1.3
  tags: [cyber, intel, secrecy]
  conditions: { flags_all: [cyber_ew:intrusion], flags_none: [cyber_ew:purged] }
  text: >-
    Wipe it in one pass and within the hour they know we found it, and how. Or leave
    it in and feed it a slightly wrong picture, if you can live with your warning
    screen lying to you.
  left:
    text: "Wipe it"
    effects: { military: 3, intel: 2, trust_primary: -3, escalation: 2 }
    tags: [cyber, military]
    set: [cyber_ew:purged]
  right:
    text: "Feed it. Learn what they want."
    effects: { military: -4, intel: -3, commitment: 2 }
    tags: [cyber, secrecy, intel, stall]
    follow: [{ card: cyberew_09_what_it_asked, in: 2 }]

- id: cyberew_09_what_it_asked
  arc: cyber_early_warning
  advisor: intel_director
  acts: [2, 5]
  tags: [cyber, intel, misperception]
  note: Follows 08 right. What they asked for tells you what they fear, or what they want you to fear.
  text: >-
    Three nights running the intruder asks about the south, only the south, where
    we keep nothing. Either they are deciding what to put there, or they want us to
    watch them look.
  left:
    text: "Put something there first"
    effects: { military: 6, escalation: 7, trust_primary: -6, economy: -2, intel: 4 }
    tags: [military, mobilise, deterrence, escalatory]
  right:
    text: "Pull the plug. Leave it empty."
    effects: { intel: 5, military: -4, escalation: -2, trust_primary: 2 }
    tags: [cyber, deescalate, reassurance]
    set: [cyber_ew:purged]

# ---------------------------------------------------------------- counterhack
- id: cyberew_10_reciprocity
  arc: cyber_early_warning
  advisor: hawk_general
  acts: [2, 5]
  weight: 1.3
  timer: 10
  timeout: left
  tags: [cyber, military, escalatory, nuclear]
  conditions:
    flags_all: [cyber_ew:intrusion]
    flags_none: [cyber_ew:counterhacked]
    pieces_any: [cyber_unit]
  note: Cyber Unit moment. Timeout blinds them, the worse side. Either outcome leads to 11.
  text: >-
    We have been inside their northern radar for a year and never used it. Tonight
    it can blind them for six hours, and they will feel it the way we felt theirs,
    which is the point.
  left:
    text: "Blind them"
    effects: { military: 7, escalation: 10, trust_primary: -10, public: 2 }
    tags: [cyber, strike, military, escalatory]
    set: [cyber_ew:counterhacked]
    follow: [{ card: cyberew_11_their_reading, in: 1 }]
    odds:
      label: It works
      base: 0.6
      tags: [cyber, military]
      success:
        text: "Six hours of nothing on their northern screens. They know it was us; they do not know how, and it is the how that will keep them up."
        effects: { intel: 4 }
      failure:
        text: "Forty minutes, not six hours, and their engineers now have our tool. Our people call this burning the access, and it sounds smaller than it is."
        effects: { intel: -6, military: -4, escalation: 4 }
  right:
    text: "Hold. Keep the access."
    effects: { military: -5, intel: 3, commitment: -2 }
    tags: [stall, cyber, secrecy]

- id: cyberew_11_their_reading
  arc: cyber_early_warning
  advisor: intel_director
  acts: [2, 5]
  tags: [cyber, misperception, nuclear, escalatory]
  note: Follows 10 left. They read a hand on their early warning the only way anyone does.
  text: >-
    Six hours after their screens went dark their bombers scattered, and two of
    their nine missile fields are readier than we have ever seen. They read it
    as we did a month ago.
  left:
    text: "Tell them it was us. It is over."
    effects: { escalation: -7, trust_primary: 5, public: -5, military: -6 }
    tags: [transparency, deescalate, diplomacy, cyber]
    spend_charge: deescalation
  right:
    text: "Let them sit in it"
    effects: { escalation: 9, trust_primary: -7, military: 4, intel: -2 }
    tags: [deterrence, escalatory, secrecy]

# ---------------------------------------------------------------- disclosure
- id: cyberew_12_day_twenty_nine
  arc: cyber_early_warning
  advisor: legal
  acts: [2, 5]
  weight: 1.2
  tags: [cyber, transparency, alliance]
  conditions:
    flags_all: [cyber_ew:intrusion]
    flags_none: [cyber_ew:disclosed]
    pieces_none: [transparency]
  note: Disclosure without the Transparency doctrine. Public cost to tell.
  text: >-
    The treaty says report a hack within thirty days; today is day twenty-nine.
    Telling shows {rival} what we know, silence shows our allies what we are;
    tomorrow silence is illegal.
  left:
    text: "Tell them. Tonight."
    effects: { public: -5, allies: 6, trust_primary: 3, intel: -3 }
    tags: [transparency, alliance, cyber]
    set: [cyber_ew:disclosed]
  right:
    text: "Let day thirty pass"
    effects: { allies: -5, intel: 2, military: 2, commitment: 3 }
    tags: [secrecy, stall, cyber]

- id: cyberew_13_page_eleven
  arc: cyber_early_warning
  advisor: press
  acts: [2, 5]
  weight: 1.3
  tags: [cyber, transparency, domestic]
  conditions:
    flags_all: [cyber_ew:intrusion]
    flags_none: [cyber_ew:disclosed]
    pieces_any: [transparency]
  note: Transparency doctrine reverses the disclosure cost. You already told everyone.
  text: >-
    Your own weekly report lists the hack on page eleven, and the {rival_adj}
    embassy read it before I did. The story is that you told everyone nine days ago
    and nobody noticed.
  left:
    text: "Yes, we meant to. Brief it fully."
    effects: { public: 4, trust_primary: 4, allies: 3, military: -4, intel: -2 }
    tags: [transparency, domestic, cyber, reassurance]
    set: [cyber_ew:disclosed]
  right:
    text: "Pull the page"
    effects: { public: -6, trust_primary: -5, military: 2, commitment: 2 }
    tags: [secrecy, domestic, walk_back]

# ---------------------------------------------------------------- piece moments
- id: cyberew_14_paper_and_phone
  arc: cyber_early_warning
  advisor: watch_officer
  acts: [2, 5]
  weight: 1.2
  tags: [cyber, space, warning, entanglement]
  conditions: { flags_all: [cyber_ew:intrusion], pieces_any: [early_warning] }
  note: Early-Warning Constellation complication. The downlink runs through the same box.
  text: >-
    The satellite pictures come down through the hacked computer, so the intruder
    knows what we can see and, worse, what we cannot. I can run them by voice, four
    minutes slower.
  left:
    text: "Run the satellites by voice"
    effects: { intel: 4, military: -5, public: -2 }
    tags: [deescalate, space, warning, investigate]
  right:
    text: "Keep the link. Feed it lies."
    effects: { intel: -3, escalation: 2, military: 2, commitment: 2 }
    tags: [cyber, secrecy, space, warning]

- id: cyberew_15_thirty_one_attempts
  arc: cyber_early_warning
  advisor: cyber_director
  acts: [2, 5]
  weight: 1.2
  tags: [cyber, nuclear, intel]
  conditions: { flags_all: [cyber_ew:intrusion], pieces_any: [hardened_nc3] }
  note: Hardened NC3 moment and complication. The air gap held; the handoff is the door.
  text: >-
    The intruder has tried thirty-one times to climb from the warning computer into
    the launch orders, each try closer. I can shut that door; then orders go by
    courier and phone.
  left:
    text: "Shut the door"
    effects: { military: -5, intel: 4, escalation: -2, commitment: -2 }
    tags: [cyber, deescalate, nuclear, investigate]
  right:
    text: "Leave it open. Count the attempts."
    effects: { intel: 5, escalation: 3, military: 2, trust_primary: -2 }
    tags: [cyber, secrecy, intel, nuclear]

- id: cyberew_16_our_own_tool
  arc: cyber_early_warning
  advisor: cyber_director
  acts: [2, 5]
  weight: 1.2
  tags: [cyber, attribution, misperception]
  conditions: { flags_all: [cyber_ew:intrusion], pieces_any: [cyber_unit] }
  note: Cyber Unit complication. Our handwriting is on the weapon.
  text: >-
    Part of the code is ours, written by our own hackers six years ago and leaked,
    nobody knows how. Point at anyone in public and they hold up our handwriting
    within the hour.
  left:
    text: "Name them anyway"
    effects: { public: 3, trust_primary: -6, allies: -4, escalation: 4 }
    tags: [attribution, public_commitment, cyber]
    set: [cyber_ew:attributed]
  right:
    text: "Bury where it came from"
    effects: { intel: -4, public: -2, commitment: 3, military: 2 }
    tags: [secrecy, attribution, cyber]

# ---------------------------------------------------------------- cross-arc hooks
- id: cyberew_17_written_not_seen
  arc: cyber_early_warning
  advisor: intel_director
  acts: [2, 5]
  weight: 1.4
  tags: [cyber, nuclear, misperception, warning]
  conditions: { flags_all: [cyber_ew:intrusion], flags_any: [false_alarm:reported], unseen: [falarm_23_poisoned_board] }
  note: Cross-arc hook with false_alarm. Clearing false_alarm_live here is deliberate.
  text: >-
    At least one missile that woke you was typed onto the screen, not seen by
    radar. If they can show us one they can show us forty, and they know
    how long you take to decide.
  left:
    text: "No launch on the screen alone"
    effects: { military: -7, intel: 5, escalation: -4, commitment: -3 }
    tags: [deescalate, nuclear, investigate, cyber]
    clear: [false_alarm_live]
  right:
    text: "Change our timings. Tell no one."
    effects: { military: 4, escalation: 3, intel: -3, trust_primary: -3 }
    tags: [military, secrecy, nuclear]

- id: cyberew_18_the_tasking
  arc: cyber_early_warning
  advisor: cyber_director
  acts: [2, 5]
  weight: 1.4
  tags: [cyber, space, attribution, misperception]
  conditions:
    flags_all: [cyber_ew:intrusion]
    flags_any: [blackout:started, arc:satellite_blackout]
  note: Cross-arc hook with satellite_blackout.
  text: >-
    The satellite that went dark over the Straits was steered from the hacked
    computer, so the intruder knew where it would look. I cannot call that a
    coincidence, or yet a plan.
  left:
    text: "One campaign. Brief it that way."
    effects: { escalation: 5, trust_primary: -6, military: 4, commitment: 4 }
    tags: [attribution, escalatory, space, cyber]
    set: [cyber_ew:attributed]
  right:
    text: "Two events until proven otherwise"
    effects: { military: -3, public: -2, intel: 2 }
    tags: [stall, attribution, intel]

# ---------------------------------------------------------------- entanglement
- id: cyberew_19_the_hospitals
  arc: cyber_early_warning
  advisor: watch_officer
  acts: [3, 5]
  weight: 1.1
  tags: [cyber, entanglement, domestic]
  conditions: { flags_all: [cyber_ew:intrusion], flags_none: [cyber_ew:purged] }
  text: >-
    A thirty-six-hour rebuild puts the north's emergency calls on a nine-second
    delay, and two hospitals told us what that does to a heart attack. Our own
    backup is six weeks away.
  left:
    text: "Rebuild now. Thirty-six hours."
    effects: { public: -6, economy: -3, intel: 6, military: 2 }
    tags: [cyber, investigate, entanglement, domestic]
    set: [cyber_ew:purged]
  right:
    text: "Six weeks. Then rebuild."
    effects: { intel: -4, escalation: 2, public: 2, military: -3 }
    tags: [stall, entanglement, domestic]

# ---------------------------------------------------------------- resolutions
- id: cyberew_20_clean_build
  arc: cyber_early_warning
  advisor: cyber_director
  acts: [3, 5]
  weight: 1.4
  tags: [cyber, intel, transparency]
  conditions: { flags_all: [cyber_ew:purged] }
  note: Resolution after a purge.
  text: >-
    Clean as of 06:00, says the woman who found the last bug by accident. I want the
    team kept all year and our notes published; the General wants them back and
    the notes in a safe.
  left:
    text: "Keep the team. Publish the notes."
    effects: { economy: -4, military: -6, intel: 10, trust_primary: 6, allies: 6, public: -3 }
    tags: [transparency, cyber, investigate, reassurance]
    set: [cyber_ew:disclosed]
  right:
    text: "Declare it clean. Move on."
    effects: { military: 6, public: 5, intel: -8, escalation: 2 }
    tags: [secrecy, military, cyber]

- id: cyberew_21_the_motion
  arc: cyber_early_warning
  advisor: legal
  acts: [4, 5]
  weight: 1.4
  tags: [cyber, diplomacy, alliance, commitment_trap]
  conditions:
    flags_all: [cyber_ew:intrusion]
    flags_any: [cyber_ew:attributed, cyber_ew:disclosed, cyber_ew:counterhacked]
  note: Resolution at the Assembly. Be bound by it or read by it.
  text: >-
    The Assembly votes tonight to condemn hacking missile-warning systems and, in
    the same line, blacking them out. It names nobody, and everyone in the room
    reads the same newspapers.
  left:
    text: "Vote for it. Be bound."
    effects: { allies: 8, escalation: -8, trust_primary: 6, military: -8, commitment: 8 }
    tags: [diplomacy, public_commitment, deescalate, alliance]
  right:
    text: "Vote against. Keep our hands free."
    effects: { military: 5, trust_primary: -5, public: -4 }
    tags: [diplomacy, escalatory, secrecy]
    odds:
      label: Motion fails
      base: 0.45
      tags: [diplomacy, alliance]
      success:
        text: "It fails by four votes. Three of the four are ours to repay."
        effects: { allies: -4, escalation: 2 }
      failure:
        text: "It passes without us. The first country to cite it against us is {other}, within the week."
        effects: { allies: -9, escalation: 5, trust_secondary: -4 }

- id: cyberew_22_their_bombers
  arc: cyber_early_warning
  advisor: hawk_general
  acts: [3, 5]
  weight: 1.4
  timer: 8
  timeout: left
  tags: [cyber, nuclear, military, misperception]
  conditions: { flags_all: [cyber_ew:counterhacked] }
  note: Resolution after a counterhack. Timeout demonstrates, the worse side.
  text: >-
    Their radar is back but their bombers are not; a week on they sit scattered at
    airfields we did not know were finished. A show of force now would remind them
    where this goes.
  left:
    text: "Put on a show of force"
    effects: { military: 8, escalation: 10, trust_primary: -8, public: 3 }
    tags: [military, deterrence, escalatory, nuclear]
    odds:
      label: They stand down
      base: 0.4
      tags: [adversary, military]
      success:
        text: "Their bombers go home over two nights. Nobody says anything about it, which is how these things end when they end well."
        effects: { escalation: -8, military: 3 }
      failure:
        text: "Their bombers stay, and their missile fields go to the readiness we last saw the month all this started. The ladder looks the same from both ends."
        effects: { escalation: 12, trust_primary: -8, allies: -5 }
  right:
    text: "Announce our next exercise in full"
    effects: { military: -8, escalation: -9, trust_primary: 10, commitment: -4, public: -4 }
    tags: [transparency, reassurance, deescalate, nuclear]
