    effects: { military: -6, economy: -4, public: -4, trust_primary: 5, trust_secondary: 5, escalation: -4 }
    tags: [transparency, space, deescalate]
    set: [debris:cascade]
  right:
    text: "Keep launching, ours are tough"
    effects: { military: 5, economy: -2, escalation: 5, trust_primary: -5, trust_secondary: -5 }
    tags: [military, space, deterrence]
    set: [debris:cascade]

# ---- pieces: the Commercial Satellite Deal ------------------------------------

- id: debris_15_the_glass_house
  arc: debris_cascade
  advisor: contractor
  acts: [3, 5]
  tags: [entanglement, economy, space]
  conditions:
    pieces_any: [commercial_sat]
    flags_all: [debris:cascade]
  text: >-
    Debris took eleven of my satellites in four days; the board is selling the
    rest to {other_capital}. You keep your pictures, at a new price, with a
    new reader over your shoulder.
  left:
    text: "Buy it before they do"
    effects: { economy: -8, military: 3, public: -3, trust_secondary: -4 }
    tags: [economy, entanglement, space]
  right:
    text: "Let it go"
    effects: { intel: -10, economy: 3, allies: -3, trust_secondary: 3 }
    tags: [concede, economy, entanglement]

- id: debris_16_supplier_or_combatant
  arc: debris_cascade
  advisor: contractor
  acts: [2, 5]
  tags: [entanglement, space, economy]
  conditions:
    pieces_any: [commercial_sat]
    flags_all: [debris:event]
    flags_none: [debris:cascade]
    unseen: [blackout_14_the_shareholders]
  text: >-
    Three satellites you rent from me are in the debris, and my insurers want
    it in writing that they are not weapons. {Rival} wants the same sentence,
    for the opposite reason.
  left:
    text: "Call them civilian, in writing"
    effects: { trust_primary: 6, military: -5, economy: 3, intel: -3 }
    tags: [reassurance, public_commitment, entanglement, space]
  right:
    text: "Refuse the statement"
    effects: { military: 4, economy: -4, trust_primary: -6, escalation: 3 }
    tags: [deterrence, secrecy, entanglement, space]

# ---- pieces: the Cyber & Space Director ---------------------------------------

- id: debris_17_eleven_seconds
  arc: debris_cascade
  advisor: cyber_director
  acts: [2, 5]
  weight: 1.2
  tags: [attribution, intel, space]
  conditions:
    pieces_any: [cyber_director]
    flags_all: [debris:event]
    flags_none: [debris:blamed_us, debris:blamed_rival]
  text: >-
    I know who made the debris, because I have their raw radar feed, which I
    should not. Publishing the answer tells them about the feed, and the feed
    is why I can tell you anything.
  left:
    text: "Publish the answer"
    effects: { intel: -10 }
    tags: [attribution, transparency, intel, space]
    odds:
      label: Their fault
      base: 0.65
      tags: [attribution, intel]
      success:
        text: "Their rocket. To the second, on their own radar."
        set: [debris:blamed_rival]
        effects: { public: 6, trust_primary: -6, escalation: 3 }
      failure:
        text: "Our object. The feed shows it, and now so does everyone else."
        set: [debris:blamed_us]
        effects: { public: -8, trust_primary: -5, trust_secondary: -6 }
  right:
    text: "Keep the feed, keep the argument"
    effects: { intel: 5, public: -4, escalation: 2, trust_primary: -2 }
    tags: [secrecy, intel, stall]

- id: debris_18_without_consensus
  arc: debris_cascade
  advisor: envoy
  acts: [2, 5]
  tags: [diplomacy, attribution, space]
  conditions:
    pieces_any: [cyber_director]
    flags_all: [debris:event]
    flags_none: [debris:moratorium]
  text: >-
    Your Cyber Chief gave three causes for the debris, and {rival} pounced: if
    {us} cannot say, it cannot accuse. The deal now bans blame unless all
    agree, and all includes them.
  left:
    text: "Accept the clause"
    effects: { commitment: -5, trust_primary: 5, public: -4, military: -3 }
    tags: [concede, diplomacy, space]
  right:
    text: "Strike it and name them anyway"
    effects: { public: 3, trust_primary: -8, allies: -4, escalation: 5, commitment: 5 }
    tags: [public_commitment, attribution, escalatory]
    set: [debris:blamed_rival]

# ---- the bill -----------------------------------------------------------------

- id: debris_19_the_bill
  arc: debris_cascade
  advisor: treasury
  acts: [3, 5]
  tags: [economy, domestic, missile_defence]
  conditions:
    flags_all: [debris:event]
  text: >-
    The debris costs eleven percent of the defence budget, before the
    lawsuits. Cancel the next shield missiles or delay the pension rise: one
    headline here, one in {rival_capital}.
  left:
    text: "Cancel the shield missiles"
    effects: { military: -7, economy: 4, trust_primary: 5, public: -2 }
    tags: [economy, reassurance, missile_defence]
  right:
    text: "Delay the pension rise"
    effects: { public: -8, economy: 4, military: 2 }
    tags: [economy, domestic]

# ---- resolutions --------------------------------------------------------------

- id: debris_20_an_inch
  arc: debris_cascade
  advisor: envoy
  acts: [3, 5]
  tags: [diplomacy, space, domestic]
  conditions:
    flags_all: [debris:moratorium]
  text: >-
    The deal is signed and {rival} wants the three flags in the photo level,
    so ours comes down an inch. It is an inch, and every paper in {capital}
    will measure it by Sunday.
  left:
    text: "Lower the flag an inch"
    effects: { public: -4, trust_primary: 8, trust_secondary: 5, escalation: -8, commitment: -4 }
    tags: [concede, reassurance, diplomacy]
  right:
    text: "Keep our flag where it is"
    effects: { public: 3, trust_primary: -5, escalation: 2, commitment: 4 }
    tags: [public_commitment, stall]

- id: debris_21_the_unwritten
  arc: debris_cascade
  advisor: other_leader
  acts: [3, 5]
  weight: 0.9
  tags: [diplomacy, back_channel, space]
  conditions:
    flags_all: [debris:event]
    flags_none: [debris:moratorium]
  text: >-
    I have sworn in public to fire nothing in orbit until the sky clears;
    {rival_capital} swore the same to me, not to you. You may decide whether
    my word for theirs is enough.
  left:
    text: "Take him at his word"
    effects: { military: -6, trust_primary: 8, trust_secondary: 6, escalation: -8, public: -3 }
    tags: [reassurance, deescalate, back_channel, space]
    set: [debris:moratorium]
  right:
    text: "Demand they say it to us"
    effects: { military: 5, trust_primary: -7, trust_secondary: -5, escalation: 4 }
    tags: [deterrence, stall, space]

# ---- cross-arc hook -----------------------------------------------------------

- id: debris_22_two_events
  arc: debris_cascade
  advisor: hawk_general
  acts: [2, 5]
  timer: 9
  timeout: left
  tags: [military, space, misperception]
  conditions:
    flags_all: [debris:event]
    flags_any: [blackout:attributed_rival, cyber_ew:intrusion]
  text: >-
    First the eye, now the sky: they blind our satellite, then fill the orbit
    with junk so nothing can replace it. I have a strike ready for the radar
    behind it, and a window tonight.
  left:
    text: "Hit the radar"
    effects: { escalation: 6, military: 3 }
    tags: [strike, military, escalatory]
    odds:
      label: It lands
      base: 0.55
      tags: [strike, military]
      success:
        text: "Radar dark at 01:20. They will need a week to see the mess they made."
        effects: { military: 8, escalation: 8, trust_primary: -14, public: 4 }
      failure:
        text: "Two of our planes down on the way in. The radar is fine, and so is their case."
        effects: { escalation: 12, military: -6, public: -6, trust_primary: -12 }
  right:
    text: "Do not call it a pattern"
    effects: { military: -6, intel: 3, escalation: -2, commitment: -3 }
    tags: [stall, deescalate, intel]
