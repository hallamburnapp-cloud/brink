      label: It stands
      base: 0.4
      tags: [adversary, diplomacy]
      success:
        text: "A pause, and then the weather in {rival_capital}. The colonel is not mentioned again on the line, which is not the same as forgotten."
        effects: { trust_primary: -2, escalation: 1 }
      failure:
        text: "Their noon statement names the safe house by district and the colonel by rank, and calls him abducted. Two of our diplomats get a week to leave."
        effects: { trust_primary: -8, escalation: 5, public: -3 }

- id: defector_15_the_winter_colonel
  arc: defector
  advisor: ambassador
  acts: [2, 5]
  tags: [diplomacy, back_channel, misperception]
  conditions:
    flags_all: [defector:arrived]
    flags_none: [defector:returned]
  note: The anecdote is the warning. A lunch that will be noticed.
  text: >-
    The last colonel we took cost us eighty billion for a war that never came. A
    friend in {rival_capital} would tell me over lunch if they lost this one or
    lent him, and know I asked.
  left:
    text: "Have the lunch"
    effects: { trust_primary: -2, intel: -1 }
    tags: [back_channel, diplomacy, intel]
    odds:
      label: He tells you
      base: 0.5
      tags: [back_channel, intel]
      success:
        text: "'We lost him,' the friend says, 'and a year ago I would not have told you that.' Neither of them mentions the lunch again."
        effects: { intel: 8, trust_primary: 4 }
        set: [defector:believed]
      failure:
        text: "The friend talks about his grandchildren for two hours. Next morning their embassy asks, formally, why our ambassador is asking about colonels."
        effects: { intel: -3, trust_primary: -5, public: -4, allies: -3 }
  right:
    text: "No lunches. He is ours now."
    effects: { trust_primary: -2, intel: -3, commitment: 4, military: 2 }
    tags: [secrecy, stall]

