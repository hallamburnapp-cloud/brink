# ---------------------------------------------------------------- the doubted path closes
- id: defector_23_nothing_crossed
  arc: defector
  advisor: aide
  acts: [3, 5]
  chained: true
  tags: [intel, misperception]
  conditions:
    flags_all: [defector:held]
    flags_none: [defector:returned, defector:public]
  note: Closer for the doubted path. The nineteenth passes. Lyle was right, or the plan was never for the Straits.
  text: >-
