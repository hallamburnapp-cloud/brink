  arc: defector
  advisor: aide
  acts: [2, 5]
  timer: 10
  timeout: left
  tags: [military, misperception]
  conditions:
    flags_all: [defector:believed]
    flags_none: [defector:returned]
  note: Believing has a bill. The timeout signs the full order, the worse side.
  text: >-
    The General wants the Straits garrison doubled by the fifteenth. The Foreign
    Minister says every hull we move is one they must explain to themselves; it
