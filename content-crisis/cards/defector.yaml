    effects: { intel: -4, military: 3, escalation: 3, trust_primary: -2 }
    tags: [intel, military]

# ---------------------------------------------------------------- signals intercept
- id: defector_11_corroboration
  arc: defector
  advisor: intel_director
  acts: [2, 5]
  tags: [intel]
  conditions:
    flags_all: [defector:arrived]
    flags_none: [defector:returned]
    pieces_any: [signals_intercept]
  note: Signals Intercept's moment. Asking has a price; the intel roll answers.
  text: >-
    We read part of their staff net; if the colonel's plan is real, someone on it
    has said its name. I can look tonight, but if they see us looking they will
    know what we hold.
  left:
    text: "Task it"
    effects: { military: -2, trust_primary: -2 }
    tags: [intel, investigate]
    odds:
      label: It is there
      base: 0.55
      tags: [intel]
      success:
        text: "Fourteen uses of the word since March, all from their plans staff, two in the colonel's own hand. It is real."
        effects: { intel: 8, escalation: 3, military: 2 }
        set: [defector:believed]
      failure:
        text: "Nothing, not one use of the word, which fits a plant and fits a plan too secret for the net. We spent a week finding what is not there."
        effects: { intel: -5, military: -2 }
        set: [defector:doubted]
  right:
    text: "Do not burn the intercept on this"
    effects: { intel: -3, military: -2, commitment: -2, public: -1 }
    tags: [secrecy, stall, intel]

