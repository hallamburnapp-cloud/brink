# FLASHPOINT — The Intercept (fp_intercept). Acts 1–5.
# Normal path (entry fp_intercept_01_one_bird): a real launch, an intercept roll,
# then the response. Terminals set exactly one of fp:intercept_restrained,
# fp:intercept_retaliated, fp:intercept_exchange. The catastrophic branch (08)
# forces nuclear_intercept_exchange on an odds failure.
# False-alarm path (entry fp_intercept_fa_01_eleven_tracks): the board shows
# launches that are not there. Launch on Warning turns it into a launch decision
# (fa_02); otherwise waiting costs (fa_03 / fa_05). Terminals set
# fp:intercept_false_alarm_caught and clear false_alarm_live.
# Piece hooks: missile_defence + deterrence_by_denial (04a), no_first_use (09,
# first_use odds), launch_on_warning (fa_02), hardened_nc3 (fa_05), civil_defence (fa_06).

# ================================================================ normal path
- id: fp_intercept_01_one_bird
  flashpoint: fp_intercept
  advisor: watch_officer
  acts: [1, 5]
  timer: 10
  timeout: right
  tags: [nuclear, warning, missile_defence]
  note: "Entry. Real launch. Timeout lets it fly, the worse side with an unknown warhead over Caldor."
  text: >-
    One missile is up from the {rival_adj} north, eleven minutes out, and it comes
    down somewhere around Caldor. The Caldor battery wants to fire and I have told
    them to wait for you.
  left:
    text: "Fire the interceptors"
    effects: { military: 6, escalation: 5, economy: -4, trust_primary: -8 }
    tags: [missile_defence, military, nuclear]
    odds:
      label: Shot down
      base: 0.55
      tags: [intercept]
      success:
        text: >-
          Two interceptors go up and one hits, a hundred miles over the sea at
          04:58. The pieces fall into the water, and Caldor hears one boom and
          nothing else.
        effects: { public: 6, allies: 4 }
        follow: [{ card: fp_intercept_02_splash, in: 0 }]
      failure:
        text: >-
          Two interceptors, two misses. The missile comes down thirty miles off
          Caldor harbour, and the harbour cameras get all of it.
        effects: { public: -7, military: -5 }
        follow: [{ card: fp_intercept_03_two_misses, in: 0 }]
  right:
    text: "Let it fly. Track everything."
    effects: { military: -6, public: -6, intel: 10 }
    tags: [stall, intel, nuclear]
    follow:
      - { card: fp_intercept_04a_the_layer_you_did_not_use, in: 0 }
      - { card: fp_intercept_04b_splash_zone, in: 0 }

- id: fp_intercept_02_splash
  flashpoint: fp_intercept
  advisor: hawk_general
  acts: [1, 5]
  tags: [nuclear, military, missile_defence]
  note: "Intercept succeeded. The hawk has a package."
  text: >-
    The missile we shot down over Caldor was a dummy, aimed four miles from a town
    of nine thousand people. I can put a dummy of ours in the sea off their coast
    in six minutes.
  left:
    text: "Fire a dummy at their coast"
    effects: { military: 7, escalation: 8, trust_primary: -14, public: 3 }
    tags: [strike, military, escalatory, nuclear]
    follow: [{ card: fp_intercept_06_the_package, in: 0 }]
  right:
    text: "Call it a test. Ring the hotline."
    effects: { military: -7, public: -4, trust_primary: 8, escalation: -4 }
    tags: [deescalate, reassurance, diplomacy]
    follow: [{ card: fp_intercept_05_the_line, in: 0 }]

- id: fp_intercept_03_two_misses
  flashpoint: fp_intercept
  advisor: watch_officer
  acts: [1, 5]
  tags: [nuclear, military, missile_defence]
  note: "Intercept failed. Inert impact, public failure."
  text: >-
    The missile was a dummy, down thirty-one miles off Caldor, and the only damage
    is a cracked window on a fishing boat. Both our interceptors missed, and the
    fishing boat filmed it.
  left:
    text: "Answer it. Same range, same sea."
    effects: { military: 6, escalation: 8, trust_primary: -14, public: 5 }
    tags: [strike, military, escalatory, nuclear]
    follow: [{ card: fp_intercept_06_the_package, in: 0 }]
  right:
    text: "Hotline first. Then the cameras."
    effects: { military: -6, public: -7, escalation: -2, intel: 8 }
    tags: [diplomacy, stall, nuclear]
    follow: [{ card: fp_intercept_05_the_line, in: 0 }]

- id: fp_intercept_04a_the_layer_you_did_not_use
  flashpoint: fp_intercept
  advisor: hawk_general
  acts: [1, 5]
  conditions: { pieces_any: [missile_defence, deterrence_by_denial] }
  tags: [nuclear, military, missile_defence, domestic]
  note: "Complicates Missile Defence and Deterrence by Denial. You had the shield and watched."
  text: >-
    Their missile landed thirty-one miles off Caldor while the battery built to
    stop it was told to watch. Four years of promising nothing gets through, and
    the crews want an answer.
  left:
    text: "Fire back. A dummy into their sea."
    effects: { military: 8, escalation: 8, trust_primary: -14, public: 6 }
    tags: [strike, military, escalatory, nuclear]
    follow: [{ card: fp_intercept_06_the_package, in: 0 }]
  right:
    text: "Tell the truth. Then the hotline."
    effects: { military: -8, public: -8, trust_primary: 10, commitment: -8 }
    tags: [transparency, diplomacy, nuclear]
    follow: [{ card: fp_intercept_05_the_line, in: 0 }]

- id: fp_intercept_04b_splash_zone
  flashpoint: fp_intercept
  advisor: intel_director
  acts: [1, 5]
  conditions: { pieces_none: [missile_defence, deterrence_by_denial] }
  tags: [nuclear, intel, misperception]
  note: "Let it fly, no shield held. The intel director reads the impact."
  text: >-
    Their missile was a dummy, thirty miles off Caldor, and my guess is the water
    was always the target. The real test was how fast we decide, and now they know
    it is eleven minutes.
  left:
    text: "Fire back. Show them our number."
    effects: { military: 7, escalation: 8, trust_primary: -12, public: 4 }
    tags: [strike, military, escalatory, nuclear]
    follow: [{ card: fp_intercept_06_the_package, in: 0 }]
  right:
    text: "Take it to the hotline"
    effects: { military: -6, public: -5, intel: 8, escalation: -2 }
    tags: [diplomacy, deescalate, nuclear]
    follow: [{ card: fp_intercept_05_the_line, in: 0 }]

- id: fp_intercept_05_the_line
  flashpoint: fp_intercept
  advisor: hotline
  acts: [1, 5]
  tags: [nuclear, diplomacy, misperception]
  note: "Their account. Accepting it costs at home; rejecting it goes to the package."
  text: >-
    "{Rival} conducted a scheduled test into open sea, notified the Assembly at
    04:30, and regrets any alarm in Caldor." The fax is real, timed 04:31, and
    nobody read it in time.
  left:
    text: "Accept it. Demand the schedule."
    effects: { escalation: -7, trust_primary: 8, public: -6, military: -5, commitment: -6 }
    tags: [deescalate, diplomacy, nuclear]
    spend_charge: deescalation
    follow: [{ card: fp_intercept_07_the_morning_after, in: 0 }]
  right:
    text: "A fax is not a notice. Bombers up."
    effects: { escalation: 6, military: 6, trust_primary: -12, public: 4, commitment: 8 }
    tags: [mobilise, military, escalatory, public_commitment]
    follow: [{ card: fp_intercept_06_the_package, in: 0 }]

- id: fp_intercept_06_the_package
  flashpoint: fp_intercept
  advisor: hawk_general
  acts: [1, 5]
  timer: 8
  timeout: left
  tags: [nuclear, military, strike]
  note: "The retaliation. Timeout sends it, the worse side. Success is a terminal (retaliated); failure goes to the second track."
  text: >-
    One dummy missile of ours into the sea forty miles off their northern port, no
    warning, eleven minutes in the air. What they do in those eleven minutes is not
    up to me.
  left:
    text: "Send it"
    effects: { military: 6, escalation: 9, trust_primary: -16, public: 4 }
    tags: [strike, military, escalatory, nuclear]
    odds:
      label: They swallow it
      base: 0.5
      tags: [adversary]
      success:
        text: >-
          It lands. Forty minutes later their statement calls it a regrettable test
          that should have been notified, and "regrettable" is a door left open.
        effects: { escalation: -4, public: 3, commitment: 6 }
        set: [fp:intercept_retaliated]
      failure:
        text: >-
          Their coastal guns fire at it and miss. Then two more missiles rise out of
          their northern range, and this time they are heading for land.
        effects: { escalation: 6, military: -3, intel: -6 }
        follow: [{ card: fp_intercept_08_second_track, in: 0 }]
  right:
    text: "Hold it. Stand everyone down."
    effects: { military: -8, public: -6, escalation: -5, trust_primary: 6, commitment: -10 }
    tags: [deescalate, walk_back, reassurance, nuclear]
    follow: [{ card: fp_intercept_07_the_morning_after, in: 0 }]

- id: fp_intercept_07_the_morning_after
  flashpoint: fp_intercept
  advisor: aide
  acts: [1, 5]
  tags: [nuclear, domestic, transparency]
  note: "Terminal, restrained. Publishing burns the radar picture; secrecy costs the allies."
  text: >-
    The Caldor ferry sails at six, on time, and the Assembly wants a statement by
    nine. Everyone will ask how close the missile came, and the answer, four miles,
    is on my desk, unread.
  left:
    text: "Publish the track. All of it."
    effects: { escalation: -10, public: -5, allies: 5, trust_primary: 10, intel: -8 }
    tags: [transparency, deescalate, nuclear]
    set: [fp:intercept_restrained]
  right:
    text: "Four miles stays in this building"
    effects: { escalation: -7, public: 4, trust_primary: -6, allies: -4, commitment: 6 }
    tags: [secrecy, deescalate, nuclear]
    set: [fp:intercept_restrained]

- id: fp_intercept_08_second_track
  flashpoint: fp_intercept
  advisor: watch_officer
  acts: [1, 5]
  timer: 8
  timeout: left
  tags: [nuclear, warning, missile_defence]
  note: "Catastrophic branch. Left launches; right rolls the intercept and fails into the same ending."
  text: >-
    Two missiles up at 05:31 from their north, aimed at the Caldor battery and the
    bomber base at Harrow Vale, nine minutes out. Warheads unknown, and the room
    is waiting on you.
  left:
    text: "Launch our missiles"
    effects: { escalation: 30, military: 5 }
    tags: [nuclear, strike, escalatory]
    set: [fp:intercept_exchange]
    ending: nuclear_intercept_exchange
  right:
    text: "Intercept. Only intercept."
    effects: { military: 4, escalation: 5, economy: -5 }
    tags: [missile_defence, military, nuclear]
    odds:
      label: Shot down
      base: 0.5
      tags: [intercept]
      success:
        text: >-
          Two hits, 05:37 and 05:38, pieces down on farmland and sea. Both warheads
          were dummies, which the General says we can never prove we knew.
        effects: { public: 5, military: 3, allies: 3 }
        follow: [{ card: fp_intercept_09_the_question, in: 0 }]
      failure:
        text: >-
          One hit. The second comes down on the bomber base at Harrow Vale, and it
          is not a dummy.
        effects: { escalation: 30 }
        set: [fp:intercept_exchange]
        ending: nuclear_intercept_exchange

- id: fp_intercept_09_the_question
  flashpoint: fp_intercept
  advisor: hotline
  acts: [1, 5]
  tags: [nuclear, diplomacy, commitment_trap]
  note: "Terminal. No First Use moves the first_use roll. Left can end retaliated or exchange; right is exchange."
  text: >-
    "{Rival_leader} asks if {us} will use nuclear weapons in the next hour, says he
    will not, and asks you to say the same." The translator's voice is not steady,
    and he is waiting.
  left:
    text: "Tell him no. Then make it true."
    effects: { escalation: -6, military: -7, public: -4, trust_primary: 12 }
    tags: [deescalate, reassurance, nuclear, public_commitment]
    odds:
      label: He believes you
      base: 0.5
      tags: [first_use, adversary]
      success:
        text: >-
          "He hears you." A stand-down order to their northern range is read over
          the line, slowly, in their language and then in ours, so we can check the
          words.
        effects: { escalation: -7, allies: 4, commitment: 6 }
        set: [fp:intercept_retaliated]
      failure:
        text: >-
          "He has heard such words before." The line stays open while two more of
          their launchers move to fire, ours do the same, and nobody fires or backs
          down.
        effects: { escalation: 9, military: 4, trust_primary: -10 }
        set: [fp:intercept_exchange]
  right:
    text: "Say nothing he can quote"
    effects: { escalation: 10, military: 5, commitment: 10, trust_primary: -14, public: -3 }
    tags: [secrecy, deterrence, nuclear, escalatory]
    set: [fp:intercept_exchange]

# ================================================================ false-alarm path
- id: fp_intercept_fa_01_eleven_tracks
  flashpoint: fp_intercept
  advisor: watch_officer
  acts: [1, 5]
  tags: [nuclear, warning, intel, misperception]
  note: "False-alarm entry. The tracks are not there. Branches by piece: fa_02 (Launch on Warning), fa_05 (Hardened NC3), fa_03 (neither)."
  text: >-
    Eleven missiles over the pole, both radars agree, and the first is due on
    {capital} in nineteen minutes. The rules say I wake you first, and the page
    after that is the launch keys.
  left:
    text: "Bring the launch keys in"
    effects: { escalation: 6, military: 5, public: -4, commitment: 8 }
    tags: [nuclear, military, mobilise, warning]
    follow:
      - { card: fp_intercept_fa_02_the_doctrine, in: 0 }
      - { card: fp_intercept_fa_05_three_keys, in: 0 }
      - { card: fp_intercept_fa_03_the_honest_number, in: 0 }
  right:
    text: "Wake nobody. Show me the radar."
    effects: { military: -7, intel: 10, escalation: 2 }
    tags: [stall, intel, warning, nuclear]
    follow:
      - { card: fp_intercept_fa_02_the_doctrine, in: 0 }
      - { card: fp_intercept_fa_05_three_keys, in: 0 }
      - { card: fp_intercept_fa_03_the_honest_number, in: 0 }

- id: fp_intercept_fa_02_the_doctrine
  flashpoint: fp_intercept
  advisor: hawk_general
  acts: [1, 5]
  timer: 8
  timeout: left
  conditions: { pieces_any: [launch_on_warning] }
  tags: [nuclear, warning, military, misperception]
  note: "Launch on Warning makes the false alarm a launch decision. Timeout executes, the worse side. Second radar roll is intel-tagged."
  text: >-
    Eleven missiles, nineteen minutes, and the codes are open in front of you
    because a year ago you decided they would be. A second radar can look in ninety
    seconds, if we have that.
  left:
    text: "Launch now"
    effects: { escalation: 30, military: 6 }
    tags: [nuclear, strike, escalatory]
    ending: nuclear_launch_on_warning
  right:
    text: "Wait ninety seconds for the radar"
    effects: { military: -7, commitment: -10, escalation: 4 }
    tags: [stall, intel, nuclear]
    odds:
      label: Empty sky
      base: 0.5
      tags: [intel]
      success:
        text: >-
          The second radar sees an empty sky. The eleven tracks drop off the board
          one at a time, like lights going out along a street.
        effects: { intel: 8, public: -4 }
        clear: [false_alarm_live]
        set: [fp:intercept_false_alarm_caught]
        follow:
          - { card: fp_intercept_fa_06_the_sirens, in: 0 }
          - { card: fp_intercept_fa_04_the_tape, in: 0 }
      failure:
        text: >-
          The second radar shows the same eleven, because it reads the same
          computer. Six minutes to impact, and the General says nothing, because he
          does not have to.
        effects: { escalation: 30 }
        ending: nuclear_launch_on_warning

- id: fp_intercept_fa_03_the_honest_number
  flashpoint: fp_intercept
  advisor: intel_director
  acts: [1, 5]
  timer: 10
  timeout: right
  conditions: { pieces_none: [launch_on_warning, hardened_nc3] }
  tags: [nuclear, warning, intel, misperception]
  note: "No doctrine, no hardened system. Waiting costs military and public. Timeout puts the bombers up, the worse side."
  text: >-
    Eleven missiles on the board, more than they have ever fired at once, and I
    cannot swear they are real. The second radar needs four minutes the General says
    we do not have.
  left:
    text: "Wait four minutes for the radar"
    effects: { military: -8, public: -6, intel: 10, escalation: 3 }
    tags: [stall, intel, investigate, nuclear]
    set: [fp:intercept_false_alarm_caught]
    clear: [false_alarm_live]
    follow:
      - { card: fp_intercept_fa_06_the_sirens, in: 0 }
      - { card: fp_intercept_fa_04_the_tape, in: 0 }
  right:
    text: "Full alert. Bombers up. Then wait."
    effects: { escalation: 10, military: 6, trust_primary: -16, public: -3 }
    tags: [mobilise, military, escalatory, nuclear]
    set: [fp:intercept_false_alarm_caught]
    clear: [false_alarm_live]
    follow:
      - { card: fp_intercept_fa_06_the_sirens, in: 0 }
      - { card: fp_intercept_fa_04_the_tape, in: 0 }

- id: fp_intercept_fa_04_the_tape
  flashpoint: fp_intercept
  advisor: scientist
  acts: [1, 5]
  conditions: { pieces_none: [civil_defence] }
  tags: [nuclear, intel, misperception, warning]
  note: "Terminal, false alarm caught. What the board saw."
  text: >-
    No missiles, only an old practice tape loaded into the live system at 04:11 and
    a satellite computer that believed it. Unplug it and we are half blind for a
    week, or it repeats.
  left:
    text: "Unplug it. Half blind for a week."
    effects: { military: -7, intel: 12, escalation: -8 }
    tags: [investigate, intel, deescalate, warning]
    set: [fp:intercept_false_alarm_caught]
    clear: [false_alarm_live]
  right:
    text: "Keep it on. Nobody loads anything."
    effects: { intel: -10, escalation: -5, military: 3, public: -4 }
    tags: [stall, military, warning]
    set: [fp:intercept_false_alarm_caught]
    clear: [false_alarm_live]

- id: fp_intercept_fa_05_three_keys
  flashpoint: fp_intercept
  advisor: watch_officer
  acts: [1, 5]
  conditions: { pieces_any: [hardened_nc3], pieces_none: [launch_on_warning] }
  tags: [nuclear, warning, intel, misperception]
  note: "Complicates Hardened NC3. Three concurrences before the board is believed, and the third key is in a lift."
  text: >-
    Three of us must agree before we believe the board, and it is one yes, one no,
    because the satellites see nine plumes for eleven missiles. The third is in a
    lift for two minutes.
  left:
    text: "Wait for the lift"
    effects: { military: -7, public: -5, intel: 8 }
    tags: [stall, intel, nuclear]
    set: [fp:intercept_false_alarm_caught]
    clear: [false_alarm_live]
    follow:
      - { card: fp_intercept_fa_06_the_sirens, in: 0 }
      - { card: fp_intercept_fa_04_the_tape, in: 0 }
  right:
    text: "Override. Two votes will do."
    effects: { escalation: 8, military: 4, commitment: 10, trust_primary: -10 }
    tags: [military, nuclear, escalatory, secrecy]
    set: [fp:intercept_false_alarm_caught]
    clear: [false_alarm_live]
    follow:
      - { card: fp_intercept_fa_06_the_sirens, in: 0 }
      - { card: fp_intercept_fa_04_the_tape, in: 0 }

- id: fp_intercept_fa_06_the_sirens
  flashpoint: fp_intercept
  advisor: aide
  acts: [1, 5]
  conditions: { pieces_any: [civil_defence] }
  tags: [nuclear, domestic, misperception, warning]
  note: "Terminal, false alarm caught. Complicates Civil Defence, which worked, loudly."
  text: >-
    Sirens at 04:14 in {capital} and six cities, two hundred thousand people in
    shelters, and it was a tape. My draft says the system worked, which is true, and
    useless in a car park.
  left:
    text: "Tell them it was a drill"
    effects: { public: 5, allies: -4, trust_primary: -8, escalation: -4, commitment: 6 }
    tags: [secrecy, domestic, nuclear]
    set: [fp:intercept_false_alarm_caught]
    clear: [false_alarm_live]
  right:
    text: "Tell them the truth. A tape."
    effects: { public: -8, escalation: -7, trust_primary: 8, allies: 3 }
    tags: [transparency, domestic, nuclear, deescalate]
    set: [fp:intercept_false_alarm_caught]
    clear: [false_alarm_live]
