    At least one track that woke you this month was never seen by the radar;
    someone typed it onto the board. They wanted to know what you do at 03:00, and
    now they know.
  left:
    text: "Never launch on the board alone"
    effects: { military: -7, intel: 5, escalation: -3, commitment: -3 }
    tags: [deescalate, investigate, nuclear, cyber]
    set: [false_alarm:investigated]
    clear: [false_alarm_live]
  right:
    text: "Change what we do at 03:00"
    effects: { military: 4, intel: -3, escalation: 4, trust_primary: -4 }
    tags: [military, secrecy, nuclear]
    set: [false_alarm:acted]

# ---------------------------------------------------------------- resolutions
- id: falarm_24_the_pattern
  arc: false_alarm
  advisor: intel_director
  acts: [3, 5]
  weight: 1.5
  tags: [intel, nuclear, misperception]
  conditions: { flags_all: [false_alarm:reported] }
  note: Branch card. Leads to the two resolutions.
  text: >-
    More false alarms this month than in all our records. Either the system is
    failing or someone is teaching us to ignore it, and I would rather say I cannot
    tell than pick.
  left:
    text: "It is failing. Audit everything."
    effects: { military: -6, intel: 6, escalation: -3, economy: -2 }
    tags: [investigate, intel, deescalate]
    set: [false_alarm:investigated]
    clear: [false_alarm_live]
    follow: [{ card: falarm_25_post_mortem, in: 2 }]
  right:
    text: "They are preparing. High alert."
    effects: { military: 6, escalation: 7, trust_primary: -8, public: 2 }
    tags: [military, deterrence, nuclear, escalatory]
    set: [false_alarm:acted]
    follow: [{ card: falarm_26_the_call, in: 2 }]

- id: falarm_25_post_mortem
  arc: false_alarm
  advisor: scientist
  acts: [1, 5]
