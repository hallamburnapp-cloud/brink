# =============================================================== STAND-DOWN
# The endgame flashpoint finishes with escalation at 35 or below.

- id: standdown_communique
  name: "The Communiqué"
  kind: standdown
  trigger: { type: run_end }
  conditions: { flags_any: [fp:summit_communique, summit:communique], values: { escalation: { max: 35 } } }
  priority: 36
  text: >-
    It is two pages. The sentence that matters took four hours and now reads as if
    nobody argued about anything. You both signed at 5:50, once without cameras and once
    with.


    It does not solve Vestria. It uses the word 'regret' in a way both sides can read
    aloud at home. Your Foreign Minister says paper is two frightened countries agreeing
    to be frightened together. Then she goes to sleep.
  moment_label: The moment it held
  compendium: "Two pages, and one word both sides could read aloud."
  emoji: "🕊️"

- id: standdown_quiet_room
  name: "The Quiet Room"
  kind: standdown
  trigger: { type: run_end }
  conditions: { pieces_any: [back_channel, ambassador, quiet_room], values: { escalation: { max: 35 } } }
  priority: 30
  text: >-
    No communiqué. It ended in a room above a bookshop in {other_capital}, where your
    Ambassador and a man he has known thirty years drank tea and, around four, spoke of
    this one.


    He will not say what was agreed, only that a man with an audience at home needs a
    way to climb down that it cannot see. At 6:00 {rival} announced a routine
    stand-down; at 6:30 so did you. Neither mentioned the other. That was the agreement.
  moment_label: The moment it held
  compendium: "Ended through the back channel. Nobody will ever know how."
  emoji: "🫖"

- id: standdown_red_telephone
  name: "The Red Telephone"
  kind: standdown
  trigger: { type: run_end }
  conditions: { pieces_any: [hotline_protocol, open_line], values: { escalation: { max: 35 } } }
  priority: 31
  text: >-
    The line was used eleven times tonight. Each call was translated, a beat late, and
    the pauses were the message.


    It said: our ships are turning, not attacking. Once it said nothing for forty
    seconds, then 'thank you', and the readiness order went into the drawer. Your
    Foreign Minister says the telephone did not end the crisis. It only made sure nobody
    ended it by accident.
  moment_label: The moment the line held
  compendium: "Eleven calls on the hotline, and one forty-second silence."
  emoji: "🔴"

- id: standdown_word_kept
  name: "The Word Kept"
  kind: standdown
  trigger: { type: run_end }
  conditions: { pieces_any: [no_first_use], values: { escalation: { max: 35 } } }
  priority: 32
  text: >-
    You said you would never fire first, and there was an hour tonight when that was
    all the room wanted, and you did not. It cost a window; your General has said so.


    Your Spy Chief thinks, on one frightened source, that {rival} had a window of their
    own that hour and let it close because they believed your promise. The Peace
    Movement's leader has sent a card asking if you have slept, signed with just her
    first name.
  moment_label: The moment you were not first
  compendium: "You said you would never fire first, and then you had to mean it."
  emoji: "🤞"

- id: standdown_longer_table
  name: "The Longer Table"
  kind: standdown
  trigger: { type: run_end }
  conditions: { flags_any: [fp:midnight_backed_down, ultimatum:backed_down], values: { escalation: { max: 35 } } }
  priority: 34
  text: >-
    Eight minutes before the deadline you announced a pause. Not a withdrawal, a pause,
    and the translator in {rival_capital} repeated the word twice and then, for the
    first time, laughed.


    The papers are savage; the Opposition has 'capitulation' in his first sentence.
    Your Foreign Minister had the table at Vellmar extended by two metres. A longer
    table, she says, is what a climb-down looks like from the other side.
  moment_label: The moment you stepped back
  compendium: "You backed down at the deadline. The papers were savage; the table was longer."
  emoji: "📏"

- id: standdown_moratorium
  name: "Twelve Hundred Pieces"
  kind: standdown
  trigger: { type: run_end }
  conditions: { flags_any: [debris:moratorium, fp:cascade_moratorium], values: { escalation: { max: 35 } } }
  priority: 33
  text: >-
    Twelve hundred pieces of a dead satellite are circling the planet, and they are the
    only thing both governments agree on. Your Chief Scientist's chart is on a screen in
    {rival_capital} too.


    The agreement is three paragraphs. No tests above six hundred kilometres. A shared
    catalogue. A number in each capital for when something comes apart at 3:05 and
    someone must say what it was before someone else decides.
  moment_label: The moment it held
  compendium: "Twelve hundred pieces of debris, and one shared catalogue."
  emoji: "🔭"

- id: standdown_held_together
  name: "Held Together"
  kind: standdown
  trigger: { type: run_end }
  conditions: { values: { allies: { min: 70 }, escalation: { max: 35 } } }
  priority: 28
  text: >-
    Our ally's prime minister was in the corner all night with a telephone. You asked
    her before you moved and told her before you announced, and every time it cost an
    hour you did not have.


    The Compact held. Twelve governments, twelve parliaments, twelve editors with a leak
    to sell, and not one broke. Her private message to you is one line: you did what you
    said. From her, that is the whole of the alliance.
  moment_label: The moment it held
  compendium: "The alliance held. You did what you said, and they saw it."
  emoji: "🧵"

- id: standdown_line_held
  name: "The Line Held"
  kind: standdown
  trigger: { type: run_end }
  conditions: { flags_any: [fp:line_stood_off, blockade:lifted], values: { escalation: { max: 35 } } }
  priority: 29
  text: >-
    A freighter that had not answered a hail in six hours, and a captain who asked twice
    what to do when it reached the line. On your order he did nothing, for three hours,
    with his guns trained.


    The freighter turned at 4:10. Nobody has said why; your Admiral thinks the two
    captains talked by lamp and neither will report it. The line was lifted without a
    statement. He has a medal that does not say what it is for.
  moment_label: The moment nobody fired
  compendium: "Two captains, three hours, and a signal lamp."
  emoji: "🔦"

- id: standdown_ceasefire
  name: "Vestria, Quiet"
  kind: standdown
  trigger: { type: run_end }
  conditions: { flags_any: [proxy:ceasefire, proxy:withdrawn], values: { escalation: { max: 35 } } }
  priority: 27
  text: >-
    The ceasefire in Vestria is not a peace. It is a line both sides pretend is where
    the other stopped, along a river, because rivers do not need lawyers.


    Our advisers are coming out the way they went in, in twos, with their flags in
    their pockets. Your General calls it a retreat. Your Foreign Minister calls it the
    first thing tonight that {rival_capital} could copy without losing face. They copied
    it an hour later.
  moment_label: The moment it held
  compendium: "A river, a ceasefire, and advisers leaving in twos."
  emoji: "🏳️"

- id: standdown_empty_sky
  name: "The Empty Sky"
  kind: standdown
  trigger: { type: run_end }
  conditions: { flags_any: [fp:intercept_false_alarm_caught, false_alarm:stood_down, false_alarm:investigated], values: { escalation: { max: 35 } } }
  priority: 35
  text: >-
    The radar showed eleven missiles inbound and the room believed it. You did not, or
    you did and waited anyway, which your Spy Chief says is the same thing.


    The second radar saw an empty sky. The tracks went off the screen one at a time. It
    was a fault and a sunrise. The Duty Officer has asked for a transfer, not for what
    happened but for what nearly did. You said yes; the only easy decision of the night.
  moment_label: The moment you waited
  compendium: "A false alarm caught in time. Ninety seconds, an empty sky."
  emoji: "🌅"

- id: standdown_unloved
  name: "The Unloved Peacemaker"
  kind: standdown
  trigger: { type: run_end }
  conditions: { values: { public: { max: 40 }, escalation: { max: 35 } } }
  priority: 24
  text: >-
    Nobody will thank you. A crisis that does not happen leaves no rubble to point at,
    and the papers have decided this was a night of weakness.


    The Opposition calls you the least popular leader to see a crisis through, with
    regret. In {rival_capital}, your Foreign Minister says, a man is being told he stood
    up to you and won. Let him; his people are going home too. Then she says goodnight,
    and means it as a fact.
  moment_label: The moment it held
  compendium: "A peace nobody wanted. The danger dial low, your numbers lower."
  emoji: "🥀"

- id: standdown_generic
  name: "Stand-Down"
  kind: standdown
  trigger: { type: run_end }
  conditions: { values: { escalation: { max: 35 } } }
  priority: 10
  text: >-
    It is over the way these things are over: not with a signature but with a 6:00 at
    which nothing happens. Both sides stand down a notch, each calling it routine,
    neither correcting the other.


    Your Chancellor will hand round what it cost, a large number, and nobody will say
    what the other number would have been. Your Private Secretary reads today's
    schedule. It has a lunch in it. You had forgotten those existed.
  moment_label: The moment it held
  compendium: "A 6:00 at which nothing happened."
  emoji: "🌤️"

# ================================================================= SURVIVAL
# The run ends with escalation above 35: nobody stood down, nobody fired.

- id: survival_cold_peace
  name: "Cold Peace"
  kind: survival
  trigger: { type: run_end }
  conditions: { values: { escalation: { min: 36, max: 60 } } }
  priority: 20
  text: >-
    Nobody stood down. Nobody fired. The night ends with both armies where they were at
    four and every sign they will stay there for a generation.


    The Straits have a line across them that both fleets treat as weather. Vestria has
    a front. The hotline is tested twice a week; both sides answer, formally, and hang
    up. Your Spy Chief calls it stable; your Foreign Minister, a room with the door
    locked from both sides.
  moment_label: The moment it stayed
  compendium: "Dawn, and a cold peace locked from both sides."
  emoji: "❄️"

- id: survival_armed_truce
  name: "Armed Truce"
  kind: survival
  trigger: { type: run_end }
  conditions: { values: { military: { min: 70 }, escalation: { min: 36 } } }
  priority: 24
  text: >-
    The army of {us} has never been stronger or more expensive, and your General has
    something better than a window: a peace that requires him.


    {Rival} has matched every move. That is the truce: two very large armies across the
    river and the Straits, each sure the other would move if it blinked, so neither
    blinks. It holds as long as nobody trips. Your General calls that peace. Your
    Foreign Minister calls it a tripwire.
  moment_label: The moment the guns stayed loaded
  compendium: "Two armies who trust each other not to blink."
  emoji: "🛡️"

- id: survival_long_watch
  name: "The Long Watch"
  kind: survival
  trigger: { type: run_end }
  conditions: { values: { escalation: { min: 61 } } }
  priority: 21
  text: >-
    The night ends and the crisis does not. It has become how things are: phones in the
    bedroom, red clocks nobody took down, a screen read aloud every hour because if it
    stopped someone would have to decide what that meant.


    You are not at war. Your Spy Chief says the distance to war is measured in minutes,
    not weeks. Your partner has stopped asking if you have eaten. He leaves the
    plate. It is a quieter kindness.
  moment_label: The moment it stayed
  compendium: "Dawn, with the danger dial high. The crisis became the weather."
  emoji: "🌃"

- id: survival_frozen_front
  name: "Frozen Front"
  kind: survival
  trigger: { type: run_end }
  conditions: { flags_any: [proxy:escalated, proxy:brigade_deployed], values: { escalation: { min: 36 } } }
  priority: 25
  text: >-
    There is a front in Vestria, along the river and a dead railway, manned on both
    sides by soldiers who have cut the flags off their sleeves and are fooling nobody.


    Both capitals call them volunteers. There are cemeteries on both banks with the same
    date on the stones, and the families know whose army they were in. Your Foreign Minister says frozen things thaw. Your General says that is why you
    keep them cold.
  moment_label: The moment it froze
  compendium: "A front in Vestria. Volunteers on both sides, and cemeteries."
  emoji: "🏔️"

- id: survival_hollow_victory
  name: "Hollow Victory"
  kind: survival
  trigger: { type: run_end }
  conditions: { values: { public: { max: 35 }, escalation: { min: 36 } } }
  priority: 23
  text: >-
    By every measure your Spy Chief keeps, you won. {Rival} stepped back from the
    Straits, the column turned round, and your General's report says 'decisive' four
    times.


    The country has not noticed. It noticed the sirens, the queue at the bank, and a
    night of wondering whether the children should go to school. Your Spin Doctor says
    the story is that you won. You ask him who he is telling it to.
  moment_label: The moment they stopped listening
  compendium: "On paper, you won. Nobody at home was reading the paper."
  emoji: "🏆"

- id: survival_they_blinked
  name: "They Blinked"
  kind: survival
  trigger: { type: run_end }
  conditions: { flags_any: [fp:midnight_called_bluff, ultimatum:called_bluff], values: { escalation: { min: 36 } } }
  priority: 27
  text: >-
    The deadline came and you did not move. Forty minutes later {rival_capital}
    announced 'a technical adjustment', which is what a government says when it has
    decided the other side means it.


    Your Spin Doctor has the headline and it is a good one. Your Foreign Minister has
    booked a flight. A country made to blink in public, she says, will want to be seen
    not to next time, and next time is a matter of scheduling.
  moment_label: The moment they blinked
  compendium: "They blinked at the deadline, and everyone saw it, which is the problem."
  emoji: "👁️"

- id: survival_quiet_dawn
  name: "A Quiet Dawn"
  kind: survival
  trigger: { type: run_end }
  conditions: { values: { public: { min: 35, max: 65 }, military: { min: 35, max: 65 }, allies: { min: 35, max: 65 }, economy: { min: 35, max: 65 }, escalation: { max: 39 } } }
  priority: 29
  text: >-
    At 6:00 the phone stops. Nobody has resigned, nobody has fired, and the markets
    open at the price they closed. Your General says it could have gone worse, which
    from him is a kindness.


    You go home. The street is being swept. Nobody out there knows how close it was,
    and the whole point of tonight was that they never will.
  moment_label: "The call that kept it quiet"
  compendium: "Reached 6:00 with every dial in the middle and the danger dial low. The rarest kind of night."
  emoji: "🌅"

- id: survival_red_dawn
  name: "A Red Dawn"
  kind: survival
  trigger: { type: run_end }
  conditions: { values: { escalation: { min: 75 } } }
  priority: 30
  text: >-
    The sun comes up on two armies that have not stood down, a hotline that is still
    open, and a country that slept through it. It is dawn. It is not peace.


    Your Private Secretary brings coffee and the morning papers, which lead with the
    weather. Your General has not left the building. Neither have you.
  moment_label: "The card that ran hottest"
  compendium: "Reached 6:00 with the danger dial in the red. Over for tonight, and only for tonight."
  emoji: "🌄"

- id: survival_empty_chair
  name: "The Empty Chair at Vellmar"
  kind: survival
  trigger: { type: run_end }
  conditions: { flags_any: [fp:summit_walkout, fp:summit_collapsed, summit:collapsed], values: { escalation: { min: 36 } } }
  priority: 26
  text: >-
    The summit failed. One of you left the lake house before dawn, and the cameras
    recorded which, and the footage will play for a decade under the word 'collapse'.


    And then, oddly, nothing else fell. Both sides went home angry, and found that being
    angry at each other was a thing they could do for weeks without doing anything
    else. The paper is still on the table. The house has been kept open. Nobody has said
    why.
  moment_label: The moment the cars left
  compendium: "The summit failed. The house on the lake is still open."
  emoji: "🏚️"

- id: survival_line_stays
  name: "The Line Stays"
  kind: survival
  trigger: { type: run_end }
  conditions: { flags_any: [blockade:ours, blockade:declared, fp:line_boarded], values: { escalation: { min: 36 } } }
  priority: 22
  text: >-
    The line across the Straits is still there at dawn and has become geography. Your
    Admiral's captains board two ships a day, and the crews on both sides have started
    to recognise each other.


    Your Chancellor says the two blockades together cost roughly what a small war would,
    spread more evenly. The frigate's captain asked when he comes home. Your Admiral
    told him: when the line does. Nobody has asked when that is.
  moment_label: The moment it stayed
  compendium: "The line across the Straits stayed. The crews recognise each other now."
  emoji: "🚢"

- id: survival_still_here
  name: "Still Here"
  kind: survival
  trigger: { type: run_end }
  conditions: { values: { escalation: { min: 36 } } }
  priority: 10
  text: >-
    The night ends. That is the whole of the achievement and it is not a small one;
    there were hours when everyone in the room would have signed for it.


    Nothing is resolved. The Straits, Vestria, the man in {rival_capital}: all of it is
    exactly where it was, only more tired. Your Private Secretary reads today's
    schedule. It is the same as yesterday's. She says that as if it were good news, and
    it is.
  moment_label: The moment it stayed
  compendium: "Nothing resolved, nothing lost, everyone more tired."
  emoji: "🌙"

