  text: >-
    Every crisis needs satellites, cables and chips, and the Coalition makes them. One
    night of the world buying all it could carry produced the best quarter in Qorum's
    history.


    The Standing Committee has studied the quarter and noticed that your brother-in-law
    runs the company that made most of it, and that the export licences were signed in
