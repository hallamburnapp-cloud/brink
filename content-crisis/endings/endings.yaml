# ENDINGS — every way a night stops. Story endings sit at priority 10–40 so that the
# scaling-core endings in scaling.yaml (accidents, the Deadman Switch, antes) win
# when they apply. Forced endings are referenced by exact id from the flashpoint
# decks (fp_intercept, fp_line_at_sea, fp_cascade, fp_midnight) and advisors.yaml.
# Fallbacks are priority 0 and never chosen while an authored ending matches.
#
# Flags used here are the ones the decks set: proxy:*, blockade:*, summit:*,
# debris:*, ultimatum:*, false_alarm:*, blackout:*, cyber_ew:* and fp:<id>_<outcome>.
# Everything is flags_any so a missing hook never blocks an ending.
#
# Voice (REDESIGN.md): two paragraphs, 420 characters, speakers by role, one night
# from 3:00 to 6:00. Names only where the world already has them.

# ================================================================== FORCED
# Referenced by name from other files. Trigger forced; priority is irrelevant.

- id: nuclear_launch_on_warning
  name: "Nineteen Minutes"
  kind: nuclear
  trigger: { type: forced }
  priority: 50
  text: >-
    Eleven missiles on the radar and nineteen minutes to {capital}. The plan you signed
    a year ago in a quiet office was written for exactly this screen, and it fired
    before anyone in the room could say wait.


    Ninety seconds later the second radar swung north and saw nothing. A fault and a
    sunrise. By then your missiles were eleven minutes out, and their plan did not wait
    ninety seconds either.
  moment_label: The moment the plan decided
  compendium: "A false alarm met a plan that did not wait. The plan won."
  emoji: "⏱️"

- id: nuclear_intercept_exchange
  name: "Harrow Vale"
  kind: nuclear
  trigger: { type: forced }
  priority: 50
  text: >-
    Two missiles out of the north at 5:31, nine minutes to the bomber base at Harrow
    Vale. One of them came down, and it was not a dud, and after that nobody was
    choosing anything.


    Your General's reply was already loaded. It went. Theirs answered. By 6:10 the map
    the Duty Officer reads had stopped being a map of a country. Whether the first two
    were a test, nobody will ever sit to ask.
  moment_label: The moment the second missile landed
  compendium: "Two missiles, nine minutes, and the bomber base at Harrow Vale."
  emoji: "💥"

- id: nuclear_straits
  name: "Not Ordinary"
  kind: nuclear
  trigger: { type: forced }
  priority: 50
  text: >-
    Our frigate was burning, their destroyer was going down by the stern, and you gave
    your General ninety minutes to clear the Straits. Their submarine out of Greyholm
    was in range at minute forty.


    Their navy has a rule nobody believed, and the torpedo fired under it was not
    ordinary. The captain's last signal is four words; your Admiral asked that it stay
    sealed. A war that starts at sea does not stay there.
  moment_label: The moment the Straits were cleared
  compendium: "You cleared the Sorrel Straits. Their navy had a rule for that."
  emoji: "⚓"

- id: nuclear_blind
  name: "Blind"
  kind: nuclear
  trigger: { type: forced }
  priority: 50
  text: >-
    5:41. The computer that could have said whether the flash over their northern range
    was a launch or falling debris was the one thing in the building that was dark. The
    Hotline was ringing, so somebody decided.


    It was debris, eleven pieces of an old satellite burning up over their range.
    Your Chief Scientist had it right, too late: their bunker had a flash of its own to
    explain, and nobody there waited for a third.
  moment_label: The moment nobody could see
  compendium: "Both sides went blind in the same hour, and somebody fired at a flash."
  emoji: "🌑"

- id: nuclear_midnight
  name: "Midnight"
  kind: nuclear
  trigger: { type: forced }
  priority: 50
  text: >-
    An hour before the deadline, {rival_leader} of {rival} rang the line himself; he
    would rather ask you than his generals. Whatever you said, the men behind him
    counted to nine, and the count was not translated.


    Your missiles reached their targets. Theirs reached theirs. The red deadline clocks
    in the corridor are the last things here that work. Your Private Secretary had a
    note for 6:00. It said: sleep.
  moment_label: The moment the count ran out
  compendium: "The deadline hour, both sides' missiles in the air, and a count nobody translated."
  emoji: "🕛"

- id: special_resigned
  name: "The Line at the Bottom"
  kind: special
  trigger: { type: forced }
  priority: 50
  text: >-
    You sign with your Private Secretary's pen, because yours is in the other office
    and there is no reason to go there now. She witnesses it and does not read past the
    line, as promised.


    The party will pick someone by noon. The crisis will not notice; the screen down
    the corridor is exactly where you left it. Your partner is waiting in the car. He
    asks if you have eaten. The first question tonight you can answer.
  moment_label: The moment you signed
  compendium: "You resigned. The country got a leader it could hear. The screen did not move."
  emoji: "🖋️"

# ================================================================= NUCLEAR
# Escalation reaches 100 without a forced card. Flavour by build and by arc.

- id: nuclear_generals_war
  name: "The General's War"
  kind: nuclear
  trigger: { type: meter, key: escalation, at: 100 }
  conditions: { pieces_any: [hawk_general] }
  priority: 30
  text: >-
    Your General never said 'the enemy'. He said 'them', and 'window', and every time
    he said it a slide that showed the cost went missing from the briefing. You
    noticed. You liked it better without.


    The last window was four minutes wide and he had a plan for it; he always did, that
    was the point of him. He is still in his chair, reading the screen aloud in the
    passive voice: mistakes were made, cities were lost.
  moment_label: The moment you took his word for it
  compendium: "Your General had a plan for every window. The danger dial filled."
  emoji: "🪖"

- id: nuclear_vestria
  name: "Vestria"
  kind: nuclear
  trigger: { type: meter, key: escalation, at: 100 }
  conditions: { flags_any: [proxy:escalated, proxy:brigade_deployed] }
  priority: 32
  text: >-
    Vestria was a border nobody could find without a lawyer. Then volunteers, then a
    brigade with the flags cut off its sleeves, then a column at the river that was
    either relief or the attack.


    Nineteen of theirs dead with papers in their coats. Four hundred of ours at Hollin
    Ridge. Then a town called Tessel, and a bridge, and by the time the two capitals
    spoke there was no Vestria left to speak about.
  moment_label: The moment it stopped being someone else's war
  compendium: "A border war that stopped being a border war."
  emoji: "🗺️"

- id: nuclear_forty_miles
  name: "Forty Miles of Water"
  kind: nuclear
  trigger: { type: meter, key: escalation, at: 100 }
  conditions: { flags_any: [blockade:shots_fired, fp:line_shots] }
  priority: 31
  text: >-
    A line across the Straits and a captain asking twice what to do when the freighter
    reached it. The first shots were warnings. At four thousand yards the other bridge
    could not tell.


    A blockade is a promise to shoot, made to people you hope will not test it. Yours
    was. Your Admiral asked to be relieved at 4:00; you said no. She was on the
    frigate's bridge when the Straits stopped being a place.
  moment_label: The moment the shots were not warnings
  compendium: "Shots across the line at sea, and then everywhere else."
  emoji: "🌊"

- id: nuclear_standing_orders
  name: "Standing Orders"
  kind: nuclear
  trigger: { type: meter, key: escalation, at: 100 }
  conditions: { pieces_any: [predelegation] }
  priority: 34
  text: >-
    You gave the authority away because a leader can be killed and orders cannot.
    Something had to keep deciding if you stopped. Something did.


    A brigadier at the northern range lost his link to {capital} for eleven minutes.
    You wrote his orders for that in a calmer month; he followed them exactly, and
    nobody can say he was wrong. You were here, by a working telephone. He did not ring
    it. His orders did not say to.
  moment_label: The moment you were not asked
  compendium: "Someone followed your orders exactly, without you."
  emoji: "📋"

- id: nuclear_ladder
  name: "The Ladder"
  kind: nuclear
  trigger: { type: meter, key: escalation, at: 100 }
  conditions: { pieces_any: [escalate_to_deescalate] }
  priority: 33
  text: >-
    The theory was elegant: go up one rung so they see how far down is, and they climb
    down with you. It worked twice. The third time you could no longer tell working
    from tested.


    {Rival} had read the same books. In the fourth exchange of messages the ladder ran
    out of rungs, and nobody had planned for the roof. Your Foreign Minister's
    resignation is one line: a ladder is a thing you climb.
  moment_label: The moment the ladder ran out
  compendium: "You climbed to show them the way down. They climbed too."
  emoji: "↕️"

- id: nuclear_believed
  name: "Believed"
  kind: nuclear
  trigger: { type: meter, key: escalation, at: 100 }
  conditions: { pieces_any: [madman_theory, brinkmanship] }
  priority: 29
  text: >-
    The art was to make them believe you might. A general quoted, a deadline passed
    without a word, 'unpredictable' in three papers. Your Spy Chief said {rival_leader}
    believed you were not fully in control.


    He was right to. The trouble with a trick is that the audience acts on it. Tonight
    {rival_capital} did the sensible thing about a neighbour who might. Everything after
    that is physics.
  moment_label: The moment they took you at your word
  compendium: "You made them believe you might. They believed you."
  emoji: "🎭"

- id: nuclear_after_vellmar
  name: "The Paper at Vellmar"
  kind: nuclear
  trigger: { type: meter, key: escalation, at: 100 }
  conditions: { flags_any: [fp:summit_collapsed, fp:summit_walkout, summit:collapsed] }
  priority: 28
  text: >-
    A house on a lake at Vellmar, a paper on the table, and for six hours the paper was
    the whole world. Then one of you walked out, on camera.


    A summit that fails is worse than none; everyone on both planes said so. The other
    choice was a paragraph nobody could sign and go home, so both of you went home
    without it. The paper is still on the table, in one of the few buildings for a
    hundred miles with its lights on.
  moment_label: The moment the cars left
  compendium: "The summit failed, and the failure was the last thing left to go wrong."
  emoji: "📝"

- id: nuclear_after_midnight
  name: "After Midnight"
  kind: nuclear
  trigger: { type: meter, key: escalation, at: 100 }
  conditions: { flags_any: [fp:midnight_passed, fp:midnight_called_bluff, ultimatum:deadline_passed] }
  priority: 27
  text: >-
    The first deadline passed and nothing happened, the most dangerous thing a deadline
    can do. It taught everyone, here and in {rival_capital}, that deadlines are
    survivable.


    There was a second deadline, then a third, and the room learned to sleep through
    the red clocks. The one that mattered was never announced. You were asleep when it
    came, and by the time anyone crossed the corridor there was nothing left to decide.
  moment_label: The moment the deadline meant nothing
  compendium: "One deadline was survived, so nobody believed the last one."
  emoji: "⏰"

- id: nuclear_dark_sky
  name: "Dark Sky"
  kind: nuclear
  trigger: { type: meter, key: escalation, at: 100 }
  conditions: { flags_any: [debris:cascade, fp:cascade_escalated, blackout:retaliated, cyber_ew:counterhacked] }
  priority: 26
  text: >-
    Nobody can say who blinded whom first. By tonight neither side could be sure what
    the other's eyes in orbit were seeing, and that is worse than blind.


    The last satellite you could trust went dark at 5:09; theirs four minutes later,
    and the generals drew the only conclusion generals draw from a coincidence. Your
    Chief Scientist says the debris will circle the planet for two hundred years. He
    says it like weather.
  moment_label: The moment the sky went dark
  compendium: "Two sides went blind in the same hour and each assumed why."
  emoji: "🛰️"

- id: nuclear_second_use
  name: "The Second Use"
  kind: nuclear
  trigger: { type: meter, key: escalation, at: 100 }
  conditions: { pieces_any: [no_first_use] }
  priority: 25
  text: >-
    You said you would never be the first to fire. You put it in a speech and a signed
    letter, and you meant it. You kept your word.


    You were second. There is no paragraph for second; second is only arithmetic, and
    your General had the arithmetic ready; he never believed the promise changed what he
    was for. The Peace Movement's leader sent one text at 5:02. It says she believed
    you. It is not meant as a comfort.
  moment_label: The moment the promise stopped mattering
  compendium: "Never first, kept to the letter. The letter was not the problem."
  emoji: "✉️"

- id: nuclear_deep_bunker
  name: "The Deep Bunker"
  kind: nuclear
  trigger: { type: meter, key: escalation, at: 100 }
  conditions: { pieces_any: [fortress, civil_defence, bunker] }
  priority: 24
  text: >-
    The lift takes ninety seconds, the blast doors four. Then a room with your name on
    a chair, three hundred metres of rock, and a telephone that rings for a while and
    then does not.


    You built this for exactly this night, and it works. That is the terrible part. The
    sirens cleared {capital} in nine minutes; the shelters are full. A country well
    prepared to lose everything has lost it in good order.
  moment_label: The moment the doors closed
  compendium: "The bunker worked. That was the terrible part."
  emoji: "🚪"

- id: nuclear_last_card
  name: "The Last Card"
  kind: nuclear
  trigger: { type: meter, key: escalation, at: 100 }
  priority: 10
  text: >-
    There is no single moment, only a night of decisions, each defensible, each a
    little closer to the edge than the last, because the last one had not ended the
    world and so the edge must be further off than it looked.


    The last card was not the worst one. It was only the last. In {rival_capital} a man
    with your job is looking at a screen like yours and reaching the same conclusion.
    You have never had more in common.
  moment_label: The moment it went wrong
  compendium: "It was not one decision. It was all of them."
  emoji: "☢️"

# ================================================================= REMOVED
# An office meter hits 0 or 100 and the crisis goes on without you.

# ---- public 0: impeachment, palace, party

- id: removed_public_0_republic
  name: "Impeached"
  kind: removed
  trigger: { type: meter, key: public, at: 0 }
  seats: [republic]
  priority: 20
  text: >-
    The vote is 312 to 96 and takes eleven minutes, which the Opposition notes is less
    time than you gave the Assembly of Nations. Reasonable tone, lethal timing.


    Your Attorney General explains what you may still do, sign the handover, and what
    you may later be seen to have done, everything else. A democracy is a country that
    can fire you in the middle of the night. You have said so in speeches.
  moment_label: The moment the House stopped listening
  compendium: "The people were gone, so the House went too. Impeached before dawn."
  emoji: "🏛️"

- id: removed_public_0_federation
  name: "The Palace"
  kind: removed
  trigger: { type: meter, key: public, at: 0 }
  seats: [federation]
  priority: 20
  text: >-
    Nobody votes. The guard at the east gate is replaced by one you do not recognise,
    and then your Chancellor comes in without knocking and does not sit. He has a car
    waiting. The car is a courtesy.


    A managed press can manage anything except a country that has stopped believing
    it, and the squares stopped days ago. The next Premier has a good jaw and a general
    behind each shoulder. The crisis has not noticed.
  moment_label: The moment the guard changed
  compendium: "The people stopped believing, and the palace found a new Premier."
  emoji: "🏰"

- id: removed_public_0_coalition
  name: "The Party Withdraws"
  kind: removed
  trigger: { type: meter, key: public, at: 0 }
  seats: [coalition]
  priority: 20
  text: >-
    The Standing Committee meets in the dark, which it never does, and its statement
    is one line: the Party thanks you for your service. It does not say to whom.


    The Coalition does not have coups. It has meetings, and after this one a younger
    man with an engineering degree and a patient face is Chairman. You may keep the
    house. Your name is already gone from the record, which is how you know the crisis
    will be long.
  moment_label: The moment the Committee met
  compendium: "The Party withdrew its Chairman and kept the crisis."
  emoji: "🪑"

- id: removed_public_0_square
  name: "The Square"
  kind: removed
  trigger: { type: meter, key: public, at: 0 }
  conditions: { pieces_any: [peace_leader] }
  priority: 25
  text: >-
    The Peace Movement never asked the crowd to come. Its leader just kept telling them
    the truth, unhurried, and it turned out to be more persuasive than your Spin
    Doctor.


    Four hundred thousand people are in the square below the office. They are not
    chanting. They have brought chairs. She is on the steps saying, quite gently, that
    she is sure you meant well. The cabinet has counted the chairs and found its
    conscience.
  moment_label: The moment they brought chairs
  compendium: "The peace movement did not shout. It sat down."
  emoji: "🕯️"

# ---- public 100: acclamation

- id: removed_public_100
  name: "Acclamation"
  kind: removed
  trigger: { type: meter, key: public, at: 100 }
  priority: 15
  text: >-
    They love you. At the rally a woman holds up a sign that says you are the only one
    who tells the truth, and the crowd repeats it until it is not a sentence.


    Tonight the legislature voted, by acclamation, to suspend the inconvenient parts of
    the constitution. You did not ask. You did not have to. A young officer down the
    corridor is already learning to say 'the emergency' the way you say it.
  moment_label: The moment they stopped voting
  compendium: "Everyone loved you. The constitution did not survive the applause."
  emoji: "📣"

- id: removed_public_100_managed
  name: "The Only Channel"
  kind: removed
  trigger: { type: meter, key: public, at: 100 }
  conditions: { pieces_any: [spin_doctor, propaganda, press_office] }
  priority: 22
  text: >-
    Your Spin Doctor was right about everything but the half-life. The framing worked
    so well that tonight there is one story in the country, and it is yours.


    A public that hears nothing else does not support you; it has no other option. The
    cheering on the only channel was long and, the Press notes, very evenly mixed. The
    emergency is temporary, the draft says. It has no date. A date is a hostage.
  moment_label: The moment there was one story
  compendium: "The truth was managed. There is one channel now."
  emoji: "📺"

# ---- military 0: the officers stop obeying

- id: removed_military_0
  name: "Nobody Answers"
  kind: removed
  trigger: { type: meter, key: military, at: 0 }
  priority: 15
  text: >-
    The order goes down the line. Your Private Secretary reports that northern command
    has acknowledged it. Twenty minutes later she reports that acknowledging is not the
    same thing.


    Nobody mutinies. Nobody needs to; orders from you have simply stopped meaning
    anything. The officers are waiting for a signature they can obey, and it is not
    yours. You are still {leader}. It says so on the door.
  moment_label: The moment the line went quiet
  compendium: "The officers stopped obeying without saying so."
  emoji: "📵"

- id: removed_military_0_admiral
  name: "The Admiral's Signal"
  kind: removed
  trigger: { type: meter, key: military, at: 0 }
  conditions: { pieces_any: [admiral] }
  priority: 22
  text: >-
    Your Admiral was loyal to the end, which is why she is the one who tells you. She
    comes in uniform and stands, because sitting would be a lie.


    The fleet has stopped acknowledging. Signals arrive, are logged, are not acted on,
    and the captain of our frigate in the Straits has been told by someone who is not
    you what to do when he cannot reach you. She salutes. It is the last one you will
    get, and she means it.
  moment_label: The moment the Admiral stood
  compendium: "The fleet stopped listening. Your Admiral came to tell you herself."
  emoji: "🫡"

- id: removed_military_0_unsigned
  name: "Returned for Clarification"
  kind: removed
  trigger: { type: meter, key: military, at: 0 }
  conditions: { pieces_any: [dove_fm, no_first_use, minimal_deterrence] }
  priority: 20
  text: >-
    Every time you stepped back, your Foreign Minister said it counted abroad. At the
    airbase, pilots stood down a fourth time sit with helmets in their laps.


    The readiness order came back unsigned from three commands. Not refused. Returned
    for clarification, which is what officers say for exactly this. Your Foreign
    Minister is flying to {rival_capital} with a real breakthrough. There is nobody at
    home to enforce it.
  moment_label: The moment the order came back
  compendium: "The doves won every argument and lost the officers."
  emoji: "🖇️"

# ---- military 100: the junta no longer needs you

- id: removed_military_100
  name: "The Junta"
  kind: removed
  trigger: { type: meter, key: military, at: 100 }
  priority: 15
  text: >-
    You gave them everything they asked for, then things they had not thought to ask
    for. Nobody took power; they stopped needing you to hand it over.


    The generals now meet without you and brief you afterwards. The war is going well,
    they say; nobody remembers declaring one. Some things still need your signature.
    They come in a folder your Private Secretary has marked, in her own hand,
    ceremonial.
  moment_label: The moment the room changed
  compendium: "The generals no longer need you to say yes."
  emoji: "⚔️"

- id: removed_military_100_hawk
  name: "The General's Chair"
  kind: removed
  trigger: { type: meter, key: military, at: 100 }
  conditions: { pieces_any: [hawk_general, field_marshal, iron_nerve] }
  priority: 22
  text: >-
    Your General did not take power; he would find that vulgar. Over a night of getting
    what he asked for, he became the one the room looked at when a decision was needed,
    and you noticed you were looking at him too.


    The chair beside yours has moved a few inches closer every hour. It is now at the
    head of the table. Nobody moved it; things were moved. He asks if you have
    questions. You have learned not to.
  moment_label: The moment you looked at him
  compendium: "The General's chair moved to the head of the table. Nobody moved it."
  emoji: "♟️"

- id: removed_military_100_federation
  name: "The Marshals"
  kind: removed
  trigger: { type: meter, key: military, at: 100 }
  seats: [federation]
  priority: 20
  text: >-
    The Federation has always been an army with a state attached. Tonight you fed the
    army and starved the state, and the Marshals have decided the arrangement can be
    simplified.


    They are respectful. There is no announcement: the Premier is unwell, the Premier
    is resting, the Premier has asked the Marshals to carry the burden. Your name stays
    on the decrees for now. The war, they tell you, is going well.
  moment_label: The moment they simplified it
  compendium: "The Marshals carry the burden. The Premier is resting."
  emoji: "🎩"

# ---- allies 0: abandonment

- id: removed_allies_0
  name: "Alone"
  kind: removed
  trigger: { type: meter, key: allies, at: 0 }
  priority: 15
  text: >-
    The Compact's statement arrives. The sentence that matters is in paragraph eleven:
    the alliance 'reaffirms its commitment to a peaceful resolution'. Your name is not
    in it. Neither is {us}.


    Our ally's prime minister rings afterwards, in private and blunt. She asked what
    you would do, you told her, then you did other things, and she has a parliament of
    her own. She is sorry. She means it. She will not be visiting.
  moment_label: The moment the Compact moved on
  compendium: "The alliance reaffirmed its commitment to peace, and left you out."
  emoji: "🧭"

- id: removed_allies_0_republic
  name: "The Empty Chair"
  kind: removed
  trigger: { type: meter, key: allies, at: 0 }
  seats: [republic]
  priority: 20
  text: >-
    The Republic was the country everyone calls first. Tonight the Compact met without
    you, and the chair with your flag was moved to the wall before the cameras came in.


    Our ally's prime minister asked what you would do; you told her, then decided things
    at three that she read about at four. A leader consulted afterwards
    is not an ally; she is an audience. The Republic spent forty years explaining that
    to others.
  moment_label: The moment the chair was moved
  compendium: "The country everyone called first was not called."
  emoji: "📞"

- id: removed_allies_0_federation
  name: "The Last Friend"
  kind: removed
  trigger: { type: meter, key: allies, at: 0 }
  seats: [federation]
  priority: 20
  text: >-
    The Federation never had many friends. It had Amberline, which needed your gas, and
    a few governments that needed your silence. Tonight Amberline announced it will buy
    from {other}.


    A country with few friends cannot afford to spend them. You spent them the way the
    Marshals spend battalions. Kaskad is a very large city and has never felt so small.
    Your Chancellor has the numbers. He has stopped making the joke.
  moment_label: The moment Amberline changed suppliers
  compendium: "The Federation's last friend found a better offer."
  emoji: "🧊"

# ---- allies 100: protectorate

- id: removed_allies_100
  name: "Protectorate"
  kind: removed
  trigger: { type: meter, key: allies, at: 100 }
  priority: 15
  text: >-
    The alliance has never been closer. The Compact's joint command now sits in
    {capital}, and its council decides at 6:00 what {us} will announce at 9:00.


    Our ally's prime minister says she is sorry it had to happen this way. It did not
    have to. You made it happen one wise consultation at a time. You are still
    {leader}. In the history of this night you appear in the index under 'see also'.
  moment_label: The moment they decided for you
  compendium: "The alliance decides. You announce."
  emoji: "🤝"

- id: removed_allies_100_consulted
  name: "Consulted"
  kind: removed
  trigger: { type: meter, key: allies, at: 100 }
  conditions: { pieces_any: [alliance_first, allied_basing, tripwire] }
  priority: 22
  text: >-
    Alliance first was a habit, then a reflex, then an address: the Compact's office on
    the second floor, whose light is on before yours.


    Every base you offered was accepted, and every hour spent consulting them taught
    them they need not ask. Tonight they moved a squadron out of Sennet and sent a warm
    note after. Our ally's prime minister calls it the most successful
    alliance of its generation. She does not say whose.
  moment_label: The moment the light was on before yours
  compendium: "Consultation became permission."
  emoji: "🏢"

- id: removed_allies_100_coalition
  name: "The Customers"
  kind: removed
  trigger: { type: meter, key: allies, at: 100 }
  seats: [coalition]
  priority: 20
  text: >-
    The Coalition's allies were always customers, and tonight the customers held a
    shareholders' meeting: a resolution that the satellites and cables they all depend
    on are 'too important to be left to one government'.


    They took nothing; they now hold it jointly. The Chairman may attend the
    oversight board, in an advisory capacity. Your Chancellor says the country is safer
