  moment_label: The moment the customers met
  compendium: "The Coalition's customers took joint ownership of the crisis."
  emoji: "🏦"

# ---- economy 0: collapse

- id: removed_economy_0
  name: "The Queue"
  kind: removed
  trigger: { type: meter, key: economy, at: 0 }
  priority: 15
  text: >-
    The currency is a symptom, your Chancellor says. The disease is the queue outside
    the bank in {capital}, which an hour ago became a crowd, and has now stopped being a
    crowd.


    A crisis is a balance sheet with a body count, he said at three, and made a joke,
    and you laughed. There is no joke now. There is a letter from the central bank and
    one from the party, saying the same thing in different fonts.
  moment_label: The moment the queue stopped moving
  compendium: "The crisis was a balance sheet, and the sheet ran out."
  emoji: "🍞"

- id: removed_economy_0_federation
  name: "Bread"
  kind: removed
  trigger: { type: meter, key: economy, at: 0 }
  seats: [federation]
  priority: 20
  text: >-
    The Federation was sanctioned before tonight began; you knew the depth of the well
    when you began drawing on it. You did not know the hour it would run dry.


    Kaskad has bread. The problem was never bread. The problem is the queue at the bank
    on Marshal Avenue, on camera, and a press that can no longer manage where cameras
    point. The Marshals offer to take the economy off your hands, and the rest
    of you with it.
  moment_label: The moment the well ran dry
  compendium: "The Federation held the line longer than anyone, and could not pay for it."
  emoji: "🥖"

- id: removed_economy_0_reserve
  name: "The Bottom of the Barrel"
  kind: removed
  trigger: { type: meter, key: economy, at: 0 }
  conditions: { pieces_any: [strategic_reserve, war_bonds, war_economy] }
  priority: 22
  text: >-
    The reserve was for exactly this; everyone said so each time you opened it. Your
    Chancellor put the number on one sheet, and it has been getting shorter, like a
    candle.


    The sheet is blank. The bonds trade at a price he calls 'a rumour'; the factories
    turned over to the war cannot be turned back, and the people who worked in them are
    outside. He has one last dry joke: you were right, it was for exactly this.
  moment_label: The moment the sheet was blank
  compendium: "The reserve was for exactly this, and this was bigger."
  emoji: "🛢️"

# ---- economy 100: the war-profiteering scandal

- id: removed_economy_100
  name: "The Contracts"
  kind: removed
  trigger: { type: meter, key: economy, at: 100 }
  priority: 15
  text: >-
    The economy has never done better. That was the first line of your Chancellor's
    brief, and the last anyone heard, because the Press had the second line: who has
    been doing better.


    The contracts were legal. What you can be seen to have done is eleven companies,
    four founded this month, all run by people photographed with you, one at a
