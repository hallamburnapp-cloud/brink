# Endings that belong to the scaling core: accidents that ended the world, the
# Deadman Switch, bluffs called, bets won too well, danger peaks and the endless
# night. They condition only on engine-set flags (CONTENT.md §4.6) so they
# are reachable whatever the decks do. Priorities sit above the story endings
# (20–40) because when an accident ended the run, that is the story.

# ------------------------------------------------------------------ nuclear

- id: core_nuclear_rogue
  name: Someone Fired
  kind: nuclear
  trigger: { type: meter, key: escalation, at: 100 }
  conditions: { flags_all: [accident:fatal, accident:last_rogue_commander] }
  priority: 45
  text: >-
    The order did not come from this room. It came from a bunker four hundred kilometres east, from a
    colonel whose line to his own capital had been dead for nineteen minutes, and who had been told
    years ago what to do about that.

    Your General has the map up before you ask. Two tracks, then six, then the rest. Your Private
    Secretary is still holding the phone she was about to hand you.
  moment_label: The moment it left your hands
  compendium: A colonel at the end of a dead line did what his orders said. Danger full.
  emoji: "☎️"

- id: core_nuclear_false_alarm
  name: The Tracks Were Not There
  kind: nuclear
  trigger: { type: meter, key: escalation, at: 100 }
  conditions: { flags_all: [accident:fatal, accident:last_false_alarm] }
  priority: 45
  text: >-
    The Duty Officer read the screen the way he was trained to, one track at a time, and the screen
    was lying. Sunlight on a cloud bank. A test tape left in a live console. Nobody will ever know
    which.

    You had a minute. Everyone in the room spent it the same way. The other side saw you move, and
    they had a minute too.
  moment_label: The moment the screen lied
  compendium: A warning that was never real became the war that was. Danger full.
  emoji: "📡"

- id: core_nuclear_misread
  name: What They Meant
  kind: nuclear
  trigger: { type: meter, key: escalation, at: 100 }
  conditions: { flags_all: [accident:fatal, accident:last_misread] }
  priority: 45
  text: >-
    The message from {rival_capital} had four sentences. Your Spy Chief was fairly sure about the
    third. Your Foreign Minister asked for the original. Your General asked how long you had.

    It was a warning about their own hard-liners, sent as a courtesy. It landed in a room that had
    spent all night learning to hear threats. Your reply went out at 3:12. They read it no better
    than you read theirs.
  moment_label: The moment the sentence turned
  compendium: A message meant one thing and was heard as another, right at the top. Danger full.
  emoji: "📄"

- id: core_nuclear_attribution
  name: The Wrong Address
  kind: nuclear
  trigger: { type: meter, key: escalation, at: 100 }
  conditions: { flags_all: [accident:fatal, accident:last_attribution_error] }
  priority: 45
  text: >-
    Somebody hit the relay station. Your Cyber Chief said "looks like" and the room heard "was". By
    dawn the answer was on its way to {rival}, who had nothing to do with it and every reason to think
    you knew that.

    In a month, a team in a third country would have found the fingerprints and a contractor with a
    grudge. There will not be a month. Your Foreign Minister's last note is one line: we answered the
    wrong letter.
  moment_label: The moment the blame landed
  compendium: You hit back at the wrong country, from the top of the ladder. Danger full.
  emoji: "🎯"

- id: core_nuclear_deadman
  name: The Second Time
  kind: nuclear
  trigger: { type: meter, key: escalation, at: 100 }
  conditions: { flags_all: [deadman:fired] }
  priority: 42
  text: >-
    The first time, the switch held. A machine you had bought for exactly this hour pulled the world
    back to a number you could live with, and you kept climbing.

    There is no second switch. There never was. The Arms Dealer said so when he sold you the first
    one, in the smooth way he says everything, and you heard it as a feature. Your Private Secretary
    turns the last page of the schedule over. Nothing on the back.
  moment_label: The moment the switch was already spent
  compendium: The Deadman Switch saved you once. You went back up. Danger full.
  emoji: "🔁"

- id: core_nuclear_endless
  name: The Endless Night
  kind: nuclear
  trigger: { type: meter, key: escalation, at: 100 }
  conditions: { flags_all: [endless] }
  priority: 41
  text: >-
    You had won. The file was closed, the crisis had passed, and the people who study these things
    would have called it a success. You opened it again because the danger was still climbing and
    you wanted to see how far it went.

    This far. One day a historian will try to explain why the crisis was allowed to run past its end.
    They will not find a reason. There was not one. There was a score.
  moment_label: The moment past the end
  compendium: You kept going after the win, until there was nowhere left to go. Danger full.
  emoji: "♾️"

- id: core_nuclear_called
  name: Called
  kind: nuclear
  trigger: { type: meter, key: escalation, at: 100 }
  conditions: { flags_all: [ante:missed_x2] }
  priority: 38
  text: >-
    Twice you drew a line and twice they walked through it, because you drew it and then did nothing
    to make it a line. A threat you cannot back is a request.

    The third time, you backed it. {rival} had learned by then what your threats were worth, read the
    real one as another bluff, and answered it the way you answer a bluff. Your General says nothing.
    Everything he ever wanted to say is on the map.
  moment_label: The moment the last bluff was believed
  compendium: Two bluffs called, and then the one that was not a bluff. Danger full.
  emoji: "🃏"

- id: core_nuclear_leverage
  name: You Never Lost a Hand
  kind: nuclear
  trigger: { type: meter, key: escalation, at: 100 }
  conditions: { flags_all: [ante:smashed_x3] }
  priority: 39
  text: >-
    You never lost a hand. Every bet was met and doubled; the other side folded a little further each
    time, and the room grew quieter, because there is less to say to a man who is always right.

    Each win was a step towards the edge. When there was nowhere left to stand, {rival} had nothing
    left to lose. The last number on the wall was the biggest of the night. It will be the last anyone
    in this building writes down.
  moment_label: The moment the winning stopped
  compendium: Every bet won, and then the edge. Danger full.
  emoji: "📈"

# --------------------------------------------------------------- standdown

- id: core_standdown_minimal
  name: Nobody Will Make a Film
  kind: standdown
  trigger: { type: run_end }
  conditions: { flags_none: [peak:50], values: { escalation: { max: 35 } } }
  priority: 45
  text: >-
    Nobody will make a film about it. Nothing blew up, and by breakfast the papers had decided it was
    never a crisis at all.

    Your Foreign Minister knows better. She knows how often you were offered a faster way through,
    and what it cost you each time you said no. The public is not grateful; it was never frightened
    enough to be. In {rival_capital}, someone very like you is hearing the same thing.
  moment_label: The moment nothing happened
  compendium: Dawn, and the danger never got past halfway. The quiet way through.
  emoji: "🌫️"

- id: core_standdown_from_the_brink
  name: From the Brink
  kind: standdown
  trigger: { type: run_end }
  conditions: { flags_all: [peak:90], values: { escalation: { max: 35 } } }
  priority: 44
  text: >-
    Tonight the Duty Officer stopped reading the screen aloud, because the numbers had passed the
    point where saying them helped. You were there. You had put them there.

    And then, call by call, you brought them down. Not to where they started; nothing goes back to
    where it started. To a number a country can sleep at. Your Spy Chief's last note: {rival} is sure
    you would have gone all the way. He is not sure you would.
  moment_label: The moment it turned
  compendium: Danger nearly full, then all the way back down. The whole ladder, both directions.
  emoji: "🪜"

- id: core_standdown_switch
  name: The Switch Held
  kind: standdown
  trigger: { type: run_end }
  conditions: { flags_all: [deadman:fired], values: { escalation: { max: 35 } } }
  priority: 43
  text: >-
    For eleven seconds, by the log, the crisis was over and so was everything else. Then a machine
    you had bought for exactly that hour did its job, and the room came back to a number that was
    merely terrible.

    You did not climb again. That is the whole story, and nobody outside this room will ever know it.
    The Arms Dealer wants a meeting about the next model. Your Private Secretary has not put it in
    the schedule.
  moment_label: The moment it came back
  compendium: The Deadman Switch fired, and you stood down afterwards.
  emoji: "🔌"

- id: core_standdown_smashed
  name: The Bill Comes Later
  kind: standdown
  trigger: { type: run_end }
  conditions: { flags_all: [ante:smashed_x3], values: { escalation: { max: 35 } } }
  priority: 41
  text: >-
    The other side gave way at every turn, and at the end you let them off the last one. The joint
    statement is generous. Your generals are not.

    Your Chancellor has it on one sheet: what the night cost them, what it cost you, and how long the
    difference will hold. He puts the sheet face down. He says the joke is on the next government.
    In {rival_capital}, a man with your job has begun to write down what he owes you.
  moment_label: The moment you let them go
  compendium: Every bet won, and then you let them go. A favour, banked.
  emoji: "🧾"

# ---------------------------------------------------------------- survival

- id: core_survival_ninety
  name: Living at Ninety
  kind: survival
  trigger: { type: run_end }
  conditions: { flags_all: [accident:fired], values: { escalation: { min: 80 } } }
  priority: 44
  text: >-
    Dawn. Nobody has stood down. Nobody has fired. The board is a wall of red the night shift has
    stopped noticing, the way you stop hearing a generator.

    There was an accident, once, and nearly a second. The Duty Officer will not talk about the first,
    which is how you know it was close. This is the peace you built: every light on, and nobody
    allowed to leave. {rival} is in the same room. It is all you have in common.
  moment_label: The moment it stayed
  compendium: Dawn with the danger dial nearly full and one accident behind you. The wall of red.
  emoji: "🟥"

- id: core_survival_borrowed
  name: Borrowed Time
  kind: survival
  trigger: { type: run_end }
  conditions: { flags_all: [deadman:fired], values: { escalation: { min: 36 } } }
  priority: 42
  text: >-
    It ends here, officially, with the world where it is. The log holds one entry that will never be
    made public: a line crossed, and a machine that uncrossed it.

    You went back to the same height and stayed there. Your Foreign Minister asked, privately, what
    the second machine would do. You said there was no second machine. She said that was her point.
    The switch is still lit. It is the only thing in the room that is.
  moment_label: The moment you went back
  compendium: The Deadman Switch fired and you finished the night high anyway.
  emoji: "⏳"

- id: core_survival_called
  name: Bluff Called
  kind: survival
  trigger: { type: run_end }
  conditions: { flags_all: [ante:missed], values: { escalation: { min: 36 } } }
  priority: 36
  text: >-
    You drew a line you could not hold, and {rival} walked through it, and the night ended before
    it mattered. That is the official version. Your General's version is shorter.

    Your Spy Chief is sure they have changed their mind about you. Every line you draw for ten
    years will be tested, some by people not yet in post, who know you only as the leader whose
    bluff was called. The crisis is over. The reputation is not.
  moment_label: The moment they walked through it
  compendium: Dawn, with at least one bluff called. They will remember.
  emoji: "🚧"

# ----------------------------------------------------------------- endless

- id: core_removed_endless_public
  name: They Made You King
  kind: removed
  trigger: { type: meter, key: public, at: 100 }
  conditions: { flags_all: [endless] }
  priority: 41
  text: >-
    The crisis was over long ago. You kept it going, and the country loved you for it. Frighten
    people long enough and they will trade anything for the one who tells them where to stand.

    This morning the Assembly voted to suspend the parts of the constitution slowing you down. You
    did not have to ask. Your Private Secretary has resigned. Her note says she will not be
    needed. It is not clear if that is a comfort.
  moment_label: The moment they stopped voting
  compendium: You kept the crisis going and the country adored you for it. The constitution did not survive.
  emoji: "👑"

- id: core_removed_endless_military
  name: The Uniform Speaks
  kind: removed
  trigger: { type: meter, key: military, at: 100 }
  conditions: { flags_all: [endless] }
  priority: 41
  text: >-
    You gave the generals everything they asked for, and then everything they had not thought to ask
    for, and at some point the arithmetic of a room changes. Your General did not take power. He
    simply stopped needing to ask.

    The last decision that was yours was the decision to keep going. Everything since has been made
    down the corridor, by people who find you a useful signature. The signature is still needed. For
    now.
  moment_label: The moment the room changed
  compendium: You kept the crisis going until the generals no longer needed you. No coup required.
  emoji: "🎖️"
