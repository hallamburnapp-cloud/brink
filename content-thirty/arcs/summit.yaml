# The Summit: Marram will host if we ask first. Ask and be snubbed, or wait, and the Old Ambassador tries the side door.
#   summit-01 (MRM) -> left summit-02 (they come; a miss: fail.follow summit-03) / right summit-03 (no summit yet) -> summit-04
# summit-01's left button has both `follow` and `fail.follow`: the engine schedules one or the other, never both.
- id: summit-01
  arc: summit
  adviser: ambassador
  region: MRM
  day: [12, 26]
  text: Marram will host a summit if we ask first. Their president and I once shared a very long dinner. Ask, and the Federation must either come or look afraid.
  left:  { text: Ask Marram to host,   tag: RISKY, odds: 65, hint: "Holds 65% · if snubbed, Marram heats", follow: summit-02, fail: { follow: summit-03 } }
  right: { text: Wait for them to ask, tag: HOME,  hint: "Nothing changes abroad · a quiet day at home", follow: summit-03 }

- id: summit-02
  arc: summit
  adviser: foreign
  region: MRM
  day: [13, 28]
  text: "Wintermast will come to Marram. It wants the seating, the flags and the first speech, and it wants us to announce that we asked. The Federation likes to be seen agreeing to things slowly."
  left:  { text: Give them the first speech, tag: CALM,  hint: "Danger down · Marram fills with cameras", follow: summit-04 }
  right: { text: Insist on equal footing,    tag: RISKY, odds: 70, hint: "Holds 70% · if they walk, Marram heats", follow: summit-04 }

- id: summit-03
  arc: summit
  adviser: ambassador
  region: MRM
  day: [13, 28]
  text: "No summit yet. Marram is embarrassed, Wintermast is pleased, and three Farsouth papers say the Republic cannot get a meeting. I have a cousin in Marram's protocol office. Let me try the side door."
  left:  { text: Try the side door,  tag: RISKY, odds: 65, hint: "Holds 65% · if not, Marram heats", follow: summit-04 }
  right: { text: Let it go for now,  tag: HOME,  hint: "Nothing changes abroad · the papers move on" }

- id: summit-04
  arc: summit
  adviser: foreign
  region: MRM
  day: [14, 30]
  text: "The summit opens in Marram tomorrow. Wintermast has one proposal: both sides pull back from the Scatter, and the first to move looks weak. The Scatter, who were not asked, would rather we both left."
  left:  { text: Pull back first,         tag: CALM,  hint: "Danger down · Tern Isle eases", relieve: TRN }
  right: { text: Wait for them to move,   tag: RISKY, odds: 55, hint: "Holds 55% · if they sit tight, Marram heats" }
