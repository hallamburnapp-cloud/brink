- id: survival_cold_peace
  name: "Cold Peace"
  kind: survival
  trigger: { type: run_end }
  conditions: { values: { escalation: { min: 36, max: 60 } } }
  priority: 20
  text: >-
    Nobody stood down. Nobody fired. The fortnight ends with the readiness levels where
    they were on the tenth day and every sign that they will stay there for a
    generation.


    The Straits have a line across them that both fleets now treat as weather. Vestria
    has a front. The hotline is tested twice a week at 09:00 and both sides answer,
    formally, and hang up. Lyle calls it stable. Marrow calls it a room with the door
    locked from both sides.


    Rennick's board is still lit at night. There is no longer anyone in the building
    who remembers it dark.
  moment_label: The moment it stayed
  compendium: "Survived. A cold peace, locked from both sides."
  emoji: "❄️"

- id: survival_armed_truce
  name: "Armed Truce"
  kind: survival
  trigger: { type: run_end }
  conditions: { values: { military: { min: 70 }, escalation: { min: 36 } } }
  priority: 24
  text: >-
    The armed forces of {us} have never been stronger, readier or more expensive.
    Vasska has his windows and his packages, and this morning he has something better:
    a peace that requires him.


    {Rival} has matched every move. That is the truce. Two very large armies looking at
    each other across the Aum and the Straits, each sure the other would move if they
    blinked, and so neither blinks, and so the budgets grow, and Roke has stopped doing
    the joke.


    It will hold as long as nobody trips. Vasska says that is what deterrence is.
    Marrow says that is what a tripwire is. They are both right, which is what makes it
    a truce.
  moment_label: The moment the guns stayed loaded
  compendium: "Survived under arms. Two armies who trust each other not to blink."
  emoji: "🛡️"

- id: survival_long_watch
  name: "The Long Watch"
  kind: survival
  trigger: { type: run_end }
  conditions: { values: { escalation: { min: 61 } } }
  priority: 21
  text: >-
    The fortnight ends and the crisis does not. It has simply become the way things
    are: the phones in the bedroom, the red clocks that Facilities never took down, the
    board that Rennick reads aloud every four hours because if he stopped, someone
    would have to decide whether that meant something.


    You are not at war. Lyle assesses this with high confidence. He also assesses, with
    the same confidence, that the distance between where you are and war is now
    measured in minutes rather than weeks, and that both capitals have got used to the
    arithmetic.


    Jonah has stopped asking if you have eaten. He leaves the plate. It is still a
    kindness. It is just a quieter one.
  moment_label: The moment it stayed
  compendium: "Survived, high on the ladder. The crisis became the weather."
  emoji: "🌃"

- id: survival_frozen_front
  name: "Frozen Front"
  kind: survival
  trigger: { type: run_end }
  conditions: { flags_any: [proxy:escalated, proxy:brigade_deployed], values: { escalation: { min: 36 } } }
  priority: 25
  text: >-
    There is a front in Vestria. It runs along the Aum, then east to Hollin Ridge, then
    along a railway that no longer carries anything, and it is manned on both sides by
    soldiers who have taken the flags off their sleeves and are not fooling anyone.


    Nobody has declared anything. Both capitals refer to the men as volunteers. There
    are cemeteries on both sides of the Aum now with the same date on the stones, and
    the families know exactly whose army the volunteers were in.


    The Assembly of Nations calls it a frozen conflict. Marrow says frozen things thaw.
    Vasska says that is why you keep them cold.
  moment_label: The moment it froze
  compendium: "Survived with a front in Vestria. Volunteers on both sides, and cemeteries."
  emoji: "🏔️"

- id: survival_hollow_victory
  name: "Hollow Victory"
  kind: survival
  trigger: { type: run_end }
  conditions: { values: { public: { max: 35 }, escalation: { min: 36 } } }
  priority: 23
  text: >-
    By every measure Lyle keeps, you won. {Rival} has stepped back from the Straits,
    the column at the Aum turned round, and Vasska's after-action report uses the word
    'decisive' four times.


    The country has not noticed. It noticed the sirens, the queue at the bank, the
    fortnight of not knowing whether the children should go to school, and a leader who
    kept saying the situation was under control in a voice that did not sound like it.
    You are the least popular winner in the country's history. Ahlgren has said so,
    regretfully.


    Karrick has a plan to fix the framing. You ask him what the story is. He says the
    story is that you won. You ask him who he is telling it to.
  moment_label: The moment they stopped listening
  compendium: "Survived and, on paper, won. Nobody at home was reading the paper."
  emoji: "🏆"

- id: survival_they_blinked
  name: "They Blinked"
  kind: survival
  trigger: { type: run_end }
  conditions: { flags_any: [fp:midnight_called_bluff, ultimatum:called_bluff], values: { escalation: { min: 36 } } }
  priority: 27
  text: >-
    The deadline was midnight and you did not move. At 00:40 {rival_capital} announced
    a technical adjustment to its deployment posture, which is the phrase a government
    uses when it has decided the other side means it.


    Karrick has the headline and it is a good one. Vasska has the after-action report
    and it uses the word 'resolve' until it stops meaning anything. Lyle has one line
    of dissent, and he has put it at the end, where it will not be read: we assess with
    moderate confidence that they will not blink twice.


    Marrow has already booked a flight. She says a country that has been made to blink
    in public will want to be seen not to next time, and next time is a matter of
    scheduling.
  moment_label: The moment they blinked
  compendium: "Survived. They blinked at midnight, and everyone saw it, which is the problem."
  emoji: "👁️"

- id: survival_quiet_dawn
  name: "A Quiet Dawn"
  kind: survival
  trigger: { type: run_end }
  conditions: { values: { public: { min: 35, max: 65 }, military: { min: 35, max: 65 }, allies: { min: 35, max: 65 }, economy: { min: 35, max: 65 }, escalation: { max: 39 } } }
  priority: 29
  text: >-
    At 6:00 the phone stops. Nobody has resigned, nobody has fired, and the markets
    open at the price they closed. The General says it could have gone worse, which
    from him is a kindness.


    You go home. The street is being swept. Nobody out there knows how close it was,
    and the whole point of tonight was that they never will.
  moment_label: "The call that kept it quiet"
  compendium: "Reached 6:00 with every dial in the middle and the danger dial low. The rarest kind of night."
  emoji: "🌅"

- id: survival_red_dawn
  name: "A Red Dawn"
  kind: survival
  trigger: { type: run_end }
  conditions: { values: { escalation: { min: 75 } } }
  priority: 30
  text: >-
    The sun comes up on two armies that have not stood down, a hotline that is still
    open, and a country that slept through it. It is dawn. It is not peace.


    Your aide brings coffee and the morning papers, which lead with the weather. The
    General has not left the building. Neither have you.
  moment_label: "The card that ran hottest"
  compendium: "Reached 6:00 with the danger dial in the red. Over for tonight, and only for tonight."
  emoji: "🌄"

- id: survival_empty_chair
  name: "The Empty Chair at Vellmar"
  kind: survival
  trigger: { type: run_end }
  conditions: { flags_any: [fp:summit_walkout, fp:summit_collapsed, summit:collapsed], values: { escalation: { min: 36 } } }
  priority: 26
  text: >-
    The summit failed. One of you left the house on the lake before dawn and the
    cameras at the front door recorded which, and that footage will play for a decade
    under the word 'collapse'.


    And then, oddly, nothing else fell. Both delegations went home angry, and both
    governments found that being angry at each other was a thing they could do for
    weeks without doing anything else. Lindqvist calls it the least bad outcome she has
    ever been blamed for.


    The paper is still on the table at Vellmar. The house has been kept open. Nobody
    has said why.
  moment_label: The moment the cars left
  compendium: "Survived after a failed summit. The house on the lake is still open."
  emoji: "🏚️"

- id: survival_line_stays
  name: "The Line Stays"
  kind: survival
  trigger: { type: run_end }
  conditions: { flags_any: [blockade:ours, blockade:declared, fp:line_boarded], values: { escalation: { min: 36 } } }
  priority: 22
  text: >-
    The blockade of the Sorrel Straits is in its third week and has become a fact of
    geography. Ships queue at both ends. Insurers in {other_capital} have a line for
    it. Volanski's captains board two a day, politely, and the crews on both sides have
    started to recognise each other.


    {Rival} has not run it since the Sable Meridian and has not lifted its own answer
    since the day after. Roke says the two blockades together cost roughly what a small
    war would, spread more evenly.


    Ostrova has asked when the Kestrel comes home. Volanski has told him what she was
    told: when the line does. Nobody has asked when that is.
  moment_label: The moment it stayed
  compendium: "Survived with the line across the Straits. Ships queue; the crews recognise each other."
  emoji: "🚢"

- id: survival_still_here
  name: "Still Here"
  kind: survival
  trigger: { type: run_end }
  conditions: { values: { escalation: { min: 36 } } }
  priority: 10
  text: >-
    The fortnight ends. That is the whole of the achievement and it is not a small one;
    there were nights this fortnight when the people in the room would have signed for
    it.


    Nothing is resolved. The Straits, Vestria, the satellites, the man in
    {rival_capital} with the domestic audience: all of it is exactly where it was, only
    more tired. Lyle assesses the situation as stable, and then, unusually, adds a
    sentence of his own. It says the word 'stable' is doing a great deal of work.


    Mara Quell reads tomorrow's schedule. It is the same as today's. She says that as
    if it were good news, and it is.
  moment_label: The moment it stayed
  compendium: "Survived. Nothing resolved, nothing lost, everyone more tired."
  emoji: "🌙"

