# pressure — the seat-agnostic domestic and economic deck. No arc, no
# conditions: these keep the deck deep between arcs. Markets, the press, the
# opposition, the security council, sleep and family, legal advice, the
# military's patience, allied phone calls, rumours, minor states asking for
# help, the peace movement. Every card is a real dilemma; hidden values carry
# the slow story. Act bands: 10 × [1,2], 10 × [2,3], 10 × [3,4], 10 × [4,5].

# ---- week one / two -----------------------------------------------------------

- id: press_01_the_opening_bell
  advisor: treasury
  acts: [1, 2]
  tags: [economy, domestic]
  text: >-
    The markets open at nine and the futures say eleven per cent down. A bank
    guarantee by eight stops the fall; a floor is cheaper, right up until it
    isn't.
  left:
    text: "Guarantee the banks"
    effects: { economy: -3, public: 3, commitment: 4 }
    tags: [economy, public_commitment, domestic]
  right:
    text: "Let it find a floor"
    effects: { economy: -5, public: -2, trust_secondary: 2 }
    tags: [economy, stall, domestic]

- id: press_02_the_first_question
  advisor: press
  acts: [1, 2]
  timer: 10
  timeout: right
  tags: [domestic, intel]
  text: >-
    Your security council met at two this morning and the Foreign Minister
    left through the kitchen. I print at six, so tell me what it was about or
    tell me it never happened.
  left:
    text: "Confirm it. Give her the context"
    effects: { public: -3, intel: -2, trust_primary: 2, commitment: 2 }
    tags: [transparency, domestic]
  right:
    text: "Deny there was a meeting"
    effects: { trust_primary: -1 }
    tags: [secrecy, domestic]
    odds:
      label: It holds
      base: 0.55
      tags: [intel]
      success:
        effects: { public: 2, military: 1 }
      failure:
        text: "The kitchen door is on the front page at six, with a photograph."
        effects: { public: -7, allies: -2, commitment: -2 }

- id: press_03_the_loyal_opposition
  advisor: opposition
  acts: [1, 2]
  tags: [domestic]
  text: >-
    I can stand beside you at noon and say 'united', and it holds your numbers
    for a week. The price is a seat in the room for the next readiness order,
    not a briefing after.
  left:
    text: "Give him the seat in the room"
    effects: { public: 5, intel: -4, military: -2, commitment: 2 }
    tags: [domestic, transparency]
  right:
    text: "Take the podium, nothing more"
    effects: { public: -4, intel: 1 }
    capital: -1
    tags: [domestic, secrecy]

- id: press_04_three_twenty
  advisor: family
  acts: [1, 2]
  once: false
  weight: 0.8
  tags: [personal, filler]
  text: >-
    It's twenty past three and you've read the same page three times while I
    stood here. There is soup, and a bed, which I mention because you seem to
    have forgotten where it is.
  left:
    text: "Two hours. Wake me if it moves"
    effects: { intel: -4, escalation: -2, public: 2 }
    tags: [personal, stall]
  right:
    text: "Stay up. Sleep when it's over"
    effects: { intel: 3, escalation: 2, public: -2 }
    tags: [personal]

- id: press_05_the_council_mood
  advisor: aide
  acts: [1, 2]
  once: false
  tags: [domestic, military]
  text: >-
    The council sits at nine, the General and the Foreign Minister are not
    speaking, and I am the corridor between them. His paper on readiness runs
    eleven pages; hers runs two.
  left:
    text: "Raise the readiness level"
    effects: { military: 5, escalation: 4, trust_primary: -4 }
    tags: [military, mobilise, domestic]
  right:
    text: "Hold the level. Tell them why"
    effects: { military: -4, escalation: -1, trust_primary: 2, allies: 1 }
    tags: [reassurance, domestic]

- id: press_06_what_you_may_do
  advisor: legal
  acts: [1, 2]
  tags: [domestic, intel]
  text: >-
    The {rival_adj} trade delegation flies at eleven and I have a form to hold
    them for three days. What you may do has a time limit; what you'll be seen
    to have done does not.
  left:
    text: "Hold them"
    effects: { intel: 4, trust_primary: -6, public: 3, escalation: 3 }
    tags: [intel, escalatory, domestic]
  right:
    text: "Let them fly"
    effects: { intel: -2, trust_primary: 3, public: -2, military: -2 }
    tags: [reassurance, domestic]

- id: press_07_the_generals_patience
  advisor: hawk_general
  acts: [1, 2]
  timer: 10
  timeout: left
  tags: [military, domestic]
  text: >-
    Three orders sit unsigned on your desk, Exercise Ironwood first among
    them. My staff have started saying you are afraid of the paper; I do not
    say it, I am saying they say it.
  left:
    text: "Sign Ironwood. The rest waits"
    effects: { military: 6, escalation: 4, trust_primary: -4, economy: -1 }
    tags: [military, mobilise]
  right:
    text: "Sign nothing tonight"
    effects: { military: -6, escalation: -1, allies: 2, trust_primary: 2 }
    tags: [stall, reassurance, domestic]

- id: press_08_the_call_from_varga
  advisor: ally_leader
  acts: [1, 2]
  tags: [alliance, alliance_demand]
  text: >-
    My cabinet read the {rival_adj} statement on their phones before your
    embassy finished translating it. I don't need to be your first call; I
    need to not be your ninth.
  left:
    text: "Promise she hears it first"
    effects: { allies: 5, commitment: 4, intel: -3 }
    tags: [alliance, public_commitment]
  right:
    text: "Tell her she waits with everyone"
    effects: { allies: -6, commitment: -1, intel: 2 }
    tags: [alliance, secrecy]

- id: press_09_amberline_asks
  advisor: envoy
  acts: [1, 2]
  tags: [diplomacy, alliance, commitment_trap]
  text: >-
    Amberline wants your written guarantee of its neutrality, and it has asked
    {rival} for the same letter. Whoever signs first is a guarantor; whoever
    signs second is a signatory.
  left:
    text: "Sign it"
    effects: { commitment: 6, allies: 3, trust_primary: -3, escalation: 2 }
    tags: [public_commitment, diplomacy, alliance]
  right:
    text: "Offer words, not a letter"
    effects: { allies: -3, trust_primary: 2, public: -2 }
    tags: [diplomacy, stall]

- id: press_10_the_square
  advisor: peace_leader
  acts: [1, 2]
  tags: [domestic]
  text: >-
    Forty thousand people are standing in Founders' Square in the rain, and
    most will go home if I ask them to. I would rather you came out and told
    them something true.
  left:
    text: "Go out and speak to them"
    effects: { public: 4, military: -4, trust_primary: 2 }
    tags: [domestic, reassurance, deescalate]
  right:
    text: "Have her send them home"
    effects: { public: -3, military: 2, trust_primary: -1 }
    tags: [domestic, stall]

# ---- week two / three ---------------------------------------------------------

- id: press_11_the_currency
  advisor: treasury
  acts: [2, 3]
  once: false
  tags: [economy]
  text: >-
    The currency is down nine per cent in six days and {other_adj} funds are
    buying it up. The reserve can hold the rate for eleven days; floating is
    honest, and honest is expensive.
  left:
    text: "Defend the rate"
    effects: { economy: -5, public: 3 }
    tags: [economy, public_commitment, domestic]
  right:
    text: "Let it float"
    effects: { economy: -2, public: -5, trust_secondary: 3 }
    tags: [economy, domestic]

- id: press_12_the_leak
  advisor: press
  acts: [2, 3]
  timer: 10
  timeout: right
  tags: [domestic, intel]
  text: >-
    I have the minutes, not a summary, with the Foreign Minister's handwriting
    in the margin. They run at six unless someone gives me a reason by five,
    and a threat is not a reason.
  left:
    text: "Brief her at five. All of it"
    effects: { public: -3, commitment: 3, trust_primary: -2, intel: -2 }
    tags: [transparency, domestic]
  right:
    text: "Kill the story"
    effects: { military: 1 }
    tags: [secrecy, domestic]
    odds:
      label: It holds
      base: 0.45
      tags: [intel]
      success:
        text: "Her editor pulls it. Nobody says why, and she knows."
        effects: { public: 2, intel: 2 }
      failure:
        text: "It runs at six, with a second story about the attempt to stop it."
        effects: { public: -8, allies: -3, commitment: -2 }

- id: press_13_the_confidence_motion
  advisor: opposition
  acts: [2, 3]
  tags: [domestic]
  text: >-
    I've tabled a confidence vote for tomorrow, and I'll withdraw it if my
    party gets Defence in a war cabinet. Otherwise we vote, and I have counted,
    and I think you should too.
  left:
    text: "Hand him Defence"
    effects: { public: 3, military: -3, intel: -4, commitment: 2 }
    capital: 1
    tags: [domestic]
  right:
    text: "Let it come to a vote"
    effects: { commitment: 3 }
    tags: [domestic, public_commitment]
    odds:
      label: The house holds
      base: 0.6
      tags: [diplomacy]
      success:
        effects: { public: 5, military: 2 }
        capital: 2
      failure:
        text: "You survive by four votes and lose the evening news."
        effects: { public: -8, allies: -2 }
        capital: -2

- id: press_14_the_hospital
  advisor: family
  acts: [2, 3]
  weight: 0.8
  tags: [personal, filler]
  text: >-
    My mother is in the Mercy and she asked for you twice, by your first name,
    which she never uses. I'm going now; I'm not asking you to fix anything,
    I'm telling you where I'll be.
  left:
    text: "Go for an hour"
    effects: { intel: -4, military: -2, public: 4 }
    tags: [personal]
  right:
    text: "Stay in the building"
    effects: { intel: 3, escalation: 1, public: -3 }
    tags: [personal]

- id: press_15_the_colonels_column
  advisor: aide
  acts: [2, 3]
  tags: [domestic, military]
  text: >-
    The morning column quotes 'a serving officer' calling you a sleepwalker,
    and the army knows which colonel. They want him gone by morning; everyone
    has already read the column.
  left:
    text: "Retire him quietly"
    effects: { military: -4, intel: 2, public: 2 }
    tags: [domestic, secrecy]
  right:
    text: "Leave him where he is"
    effects: { military: 3, public: -4, commitment: -2 }
    tags: [domestic, stall]

- id: press_16_the_lawyer_at_midnight
  advisor: legal
  acts: [2, 3]
  tags: [intel, domestic]
  text: >-
    This order lets our spies read {rival_adj} diplomatic cables, and one
    reading of the law allows it. In a courtroom, the reading will be mine and
    the signature yours.
  left:
    text: "Sign it"
    effects: { intel: 4, trust_primary: -3 }
    tags: [intel, secrecy]
    odds:
      label: It stays secret
      base: 0.6
      tags: [intel]
      success:
        effects: { intel: 4, military: 2 }
      failure:
        text: "Eleven days later a junior clerk takes a copy to a newspaper."
        effects: { public: -6, trust_primary: -6, allies: -3 }
  right:
    text: "Narrow it. Bring it back"
    effects: { military: -2, allies: 2, trust_primary: 1 }
    tags: [stall, intel]

- id: press_17_the_joint_statement
  advisor: ally_leader
  acts: [2, 3]
  tags: [alliance, alliance_demand, commitment_trap]
  text: >-
    Five capitals have signed a statement naming {rival} in line one and 'all
    necessary measures' in line three. I hold it for you until nine, then it
    goes out with or without you.
  left:
    text: "Sign it"
    effects: { allies: 6, commitment: 5, trust_primary: -5, escalation: 3 }
    tags: [alliance, public_commitment]
  right:
    text: "Hold out for our own words"
    effects: { allies: -5, trust_primary: 2, commitment: -1, public: -1 }
    tags: [alliance, stall]

- id: press_18_the_rumour
  advisor: intel_director
  acts: [2, 3]
  once: false
  weight: 0.8
  tags: [intel, misperception]
  text: >-
    One source says {rival_leader} was driven to a military hospital at three
    and has not been seen since. One source, and he is frightened; it is
    either true or meant to reach us.
  left:
    text: "Put every spy on it"
    effects: { intel: 2, economy: -1 }
    tags: [intel, investigate]
    odds:
      label: One source
      base: 0.5
      tags: [intel]
      success:
        effects: { intel: 6, trust_primary: -2, military: 2 }
      failure:
        text: "It was a dental appointment. They noticed us noticing."
        effects: { intel: -3, trust_primary: -6, escalation: 3 }
  right:
    text: "Don't chase the rumour"
    effects: { intel: -4, trust_primary: 2, public: -2 }
    tags: [stall, intel]

- id: press_19_caldor_asks
  advisor: ambassador
  acts: [2, 3]
  tags: [alliance, naval, diplomacy]
  text: >-
    Caldor's governor rang me at home, which he never does, to ask for a
    frigate in his harbour by dawn. The last reassuring frigate I saw was
    reassuring until a second one arrived.
  left:
    text: "Send the frigate"
    effects: { military: 3, allies: 4, escalation: 3, economy: -1 }
    tags: [naval, military, alliance]
    odds:
      label: They stand off
      base: 0.55
      tags: [adversary, naval]
      success:
        effects: { allies: 3, trust_primary: -3 }
      failure:
        text: "Two of their warships anchor outside the harbour by morning."
        effects: { escalation: 6, trust_primary: -5, military: 2 }
  right:
    text: "Send the Ambassador instead"
    effects: { allies: -3, public: -2, trust_primary: 2 }
    tags: [diplomacy, reassurance, alliance]

- id: press_20_the_hunger_strike
  advisor: peace_leader
  acts: [2, 3]
  tags: [domestic]
  text: >-
    Twelve students outside the Ministry haven't eaten in nine days, and one
    stopped standing up. They want fifteen minutes on camera; doctors say two
    days, the police say tonight.
  left:
    text: "Give them fifteen minutes, filmed"
    effects: { public: 4, military: -3, trust_primary: 2, commitment: 2 }
    tags: [domestic, reassurance, transparency]
  right:
    text: "Send ambulances tonight"
    effects: { public: -5, military: 2, commitment: 1 }
    tags: [domestic, secrecy]

# ---- week three / four --------------------------------------------------------

- id: press_21_the_bond_auction
  advisor: treasury
  acts: [3, 4]
  once: false
  tags: [economy]
  text: >-
    The bond auction sold sixty-one per cent, a polite way of saying it
    failed. The central bank can quietly buy the rest, or the number prints
    and {other_adj} funds set our price.
  left:
    text: "Buy it quietly"
    effects: { economy: -4, public: 2, commitment: 2, intel: -1 }
    tags: [economy, secrecy]
  right:
    text: "Let the number print"
    effects: { economy: -6, public: -3, trust_secondary: 3 }
    tags: [economy, transparency]

- id: press_22_the_interview
  advisor: press
  acts: [3, 4]
  timer: 10
  timeout: right
  tags: [domestic, nuclear]
  text: >-
    We're live at eight and my first question is whether you would ever fire a
    nuclear weapon first. Say never and live with it, or refuse to answer and I
    will ask it again, slower.
  left:
    text: "Promise never to fire first"
    effects: { public: 5, commitment: 6, military: -4, trust_primary: 4 }
    tags: [public_commitment, nuclear, reassurance]
  right:
    text: "Refuse to answer"
    effects: { public: -4, military: 2, trust_primary: -2, escalation: 1 }
    tags: [nuclear, secrecy, misperception]

- id: press_23_the_floor
  advisor: opposition
  acts: [3, 4]
  tags: [domestic]
  text: >-
    Two of your own members will defect at three unless you rule out troops
    for Vestria today. They came to me, not you; I'd rather win the argument
    than the seats, only slightly.
  left:
    text: "Rule out troops for Vestria"
    effects: { public: 3, military: -5, commitment: 5, trust_primary: 3 }
    tags: [public_commitment, domestic, reassurance]
  right:
    text: "Let them defect"
    effects: { public: -5, military: 3 }
    capital: -1
    tags: [domestic]

- id: press_24_the_birthday
  advisor: family
  acts: [3, 4]
  weight: 0.8
  tags: [personal, filler]
  text: >-
    She's fourteen at six and told her friends you'd come, which she never
    does because she knows better. Cake, eleven teenagers, no plan; twenty
    minutes, and you don't have to eat.
  left:
    text: "Go up for twenty minutes"
    effects: { intel: -3, escalation: -2, public: 3 }
    tags: [personal, stall]
  right:
    text: "Put her on the phone"
    effects: { intel: 2, escalation: 2, public: -3 }
    tags: [personal]

- id: press_25_the_minute
  advisor: aide
  acts: [3, 4]
  tags: [domestic, military]
  text: >-
    The council split six to five on readiness and the six want the vote in
    the minutes. The General's five want it left out, and there is no rule,
    only a precedent nobody wrote down.
  left:
    text: "Write the vote down"
    effects: { military: -3, allies: 3, commitment: 3, intel: 2 }
    tags: [transparency, domestic]
  right:
    text: "Strike the vote. Decide alone"
    effects: { military: 4, escalation: 3, public: -2, commitment: 1 }
    tags: [domestic, secrecy, military]

- id: press_26_the_detainees
  advisor: legal
  acts: [3, 4]
  tags: [domestic]
  text: >-
    Forty-one {rival_adj} nationals are in our cells without charge, and the
    court sits Monday. I can charge nine and free the rest; either way,
    {rival_capital} holds forty of ours.
  left:
    text: "Charge nine. Release the rest"
    effects: { trust_primary: 4, public: -3, intel: -3, military: -1 }
    tags: [reassurance, domestic]
  right:
    text: "Hold them all"
    effects: { public: 2, trust_primary: -6, allies: -3, intel: 1 }
    tags: [escalatory, domestic]

- id: press_27_the_resignation
  advisor: hawk_general
  acts: [3, 4]
  timer: 12
  timeout: left
  tags: [military, domestic]
  text: >-
    My resignation is on your desk, dated noon. Call up the northern brigades
    before then and the letter never existed; four leaders, never once, and
    the window closes at dawn.
  left:
    text: "Call up the brigades"
    effects: { military: 8, escalation: 7, economy: -3, trust_primary: -6 }
    tags: [mobilise, military]
  right:
    text: "Accept his resignation"
    effects: { military: -8, escalation: -2, public: -3, allies: 2, trust_primary: 2 }
    tags: [domestic, deescalate]

- id: press_28_the_compact_vote
  advisor: ally_leader
  acts: [3, 4]
  tags: [alliance, alliance_demand, nuclear]
  text: >-
    My parliament votes at five on whether your aircraft stay, and I win if I
    can say they carry no nuclear weapons. I'm not asking whether it's true,
    I'm asking whether I may say it.
  left:
    text: "Tell her to say it"
    effects: { allies: 6, commitment: 5, military: -4, trust_primary: 3 }
    tags: [alliance, public_commitment, nuclear, reassurance]
  right:
    text: "Neither confirm nor deny"
    effects: { military: 2, commitment: 1 }
    tags: [alliance, secrecy, misperception, nuclear]
    odds:
      label: Her vote holds
      base: 0.45
      tags: [alliance]
      success:
        effects: { allies: 2, trust_primary: -2 }
      failure:
        text: "Her parliament votes 88 to 71 to give your aircraft thirty days to leave."
        effects: { allies: -10, escalation: 2, military: -2 }

- id: press_29_vestria_asks
  advisor: envoy
  acts: [3, 4]
  tags: [diplomacy]
  text: >-
    Vestria wants a hundred and twenty unarmed observers; {rival} vetoes them
    unless {us} abstains on the Caldor vote. I won't say which matters more,
    since I get blamed either way.
  left:
    text: "Abstain. Get them in"
    effects: { allies: -4, public: -2 }
    tags: [diplomacy, concede, deescalate]
    odds:
      label: Veto lifts
      base: 0.5
      tags: [diplomacy, adversary]
      success:
        effects: { escalation: -4, trust_primary: 4 }
      failure:
        text: "They veto anyway. You abstained for nothing, on television."
        effects: { public: -4, trust_primary: -3, commitment: -2 }
  right:
    text: "Vote our line on Caldor"
    effects: { allies: 3, trust_primary: -3, escalation: 2, commitment: 2 }
    tags: [public_commitment, diplomacy]

- id: press_30_the_march
  advisor: peace_leader
  acts: [3, 4]
  tags: [domestic]
  text: >-
    Two hundred thousand march past the Ministry at two and the General wants
    the route moved away from his windows. The marchers want you to speak at
    the end; you can't do both.
  left:
    text: "Speak at the end of the march"
    effects: { public: 5, military: -6, trust_primary: 3, commitment: 3 }
    tags: [domestic, reassurance, public_commitment, deescalate]
  right:
    text: "Move the route"
    effects: { public: -5, military: 3, escalation: 1 }
    tags: [domestic, military]

# ---- week four / endgame ------------------------------------------------------

- id: press_31_the_run
  advisor: treasury
  acts: [4, 5]
  once: false
  timer: 10
  timeout: right
  tags: [economy, domestic]
  text: >-
    There are queues outside four banks in the dark and eleven per cent of
    deposits are gone. A guarantee on every deposit costs more than we have
    and works because nobody checks.
  left:
    text: "Guarantee every deposit"
    effects: { economy: -6, public: 6, commitment: 4 }
    tags: [economy, public_commitment, domestic]
  right:
    text: "Close the banks till Monday"
    effects: { economy: -4, public: -8, military: 2 }
    tags: [economy, stall, domestic]

- id: press_32_the_final_edition
  advisor: press
  acts: [4, 5]
  timer: 10
  timeout: right
  tags: [domestic, misperception]
  text: >-
    Are we at war? I print one of two front pages in an hour; 'Yes' and 'No'
    are both headlines, and '{Leader} declined to say' is the one they'll read
    in {rival_capital}.
  left:
    text: "Say no. Print no"
    effects: { public: 3, commitment: 5, trust_primary: 3, military: -4 }
    tags: [public_commitment, reassurance, domestic]
  right:
    text: "Say nothing. Let her print"
    effects: { public: -6, trust_primary: -4, escalation: 3, military: 2 }
    tags: [secrecy, misperception, domestic]

- id: press_33_the_unity_government
  advisor: opposition
  acts: [4, 5]
  tags: [domestic]
  text: >-
    A unity government tonight, my party taking Defence and the Treasury, you
    keeping the chair and the war. Mine think I'm mad to offer it; yours think
    you're mad if you refuse.
  left:
    text: "Announce the unity government"
    effects: { public: 6, military: -4, intel: -3, commitment: 3, economy: 2 }
    capital: 1
    tags: [domestic, transparency]
  right:
    text: "Refuse him outright"
    effects: { military: 3 }
    capital: -1
    tags: [domestic, public_commitment]
    odds:
      label: The house holds
      base: 0.5
      tags: [diplomacy]
      success:
        effects: { public: 3, commitment: 2 }
      failure:
        text: "Eleven of your own abstain on the budget vote. The papers count them by name."
        effects: { public: -9, economy: -2 }
        capital: -2

- id: press_34_the_suitcase
  advisor: family
  acts: [4, 5]
  tags: [personal]
  text: >-
    I packed a bag for the children, it's by the door, and I haven't told them
    why. Your office has a place for us in the bunker; tell me to unpack and I
    will, but tell me tonight.
  left:
    text: "Send them to the bunker"
    effects: { public: -5, escalation: 2, intel: 1 }
    tags: [personal, secrecy]
  right:
    text: "Unpack it. Nobody goes"
    effects: { public: 2, escalation: -1, intel: -2 }
    tags: [personal, reassurance]

- id: press_35_the_list
  advisor: aide
  acts: [4, 5]
  tags: [domestic, military, personal]
