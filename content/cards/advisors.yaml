  left:
    text: "Keep the standing orders"
    effects: { military: 4, escalation: 4, public: -3, commitment: 3 }
    tags: [personal, military, deterrence]
  right:
    text: "Pull the authority back tonight"
    effects: { military: -7, escalation: -3, public: 2, trust_primary: 3 }
    tags: [personal, deescalate, transparency]

# ---------------------------------------------------------------- more pairings

- id: adv_26_the_square_does_not_keep_a_diary
  advisor: dove_fm
  acts: [2, 5]
  conditions: { pieces_all: [dove_fm, peace_leader] }
  tags: [personal, diplomacy, domestic]
