    line. There are now forty {rival_adj} engineers on our side of the river at
    Kestrel Bridge, repairing a span the flood took, at the request of the
    Vestrian council, under an agreement that predates your sentence. Their
    general staff have asked, through me, whether engineers count. I have not
    answered, because whatever I say is your line now.
  left:
