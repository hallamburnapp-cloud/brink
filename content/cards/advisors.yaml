# advisors — personal lines, no arc: loyalty, rivalry, resignation threats,
# leaks. Every card is gated on the advisor pieces involved, so the build talks
# back. Each advisor's agenda shows in what they ask for at 3am: the General
# wants readiness and to plan as if you had not said it; the Foreign Minister
# wants a number nobody else has; the unsleeping Director wants to read the
# cabinet's mail; the measured one wants three more days; Karrick wants the
# front page; the Ambassador wants a lunch; Vance wants her paragraph back;
# Roke wants the word 'ceiling'; Nkemelu wants you not to ask; the Admiral wants
# to know who gives the next order; Delacroix-Amin wants a sentence; Ashby-Tal
# wants a signature, at eleven percent off. Four cards put a doctrine on trial.
# One rare card (adv_21) offers the letter; signing forces ending
# special_resigned (authored by the endings job).
# Flags set: advisors:general_rebuked, advisors:general_backed,
# advisors:contract_signed, advisors:contract_refused, advisors:admiral_overruled,
# advisors:fm_freelancing, advisors:cabinet_watched, advisors:chancellor_letter,
# advisors:standing_orders, advisors:promised_no, advisors:square_leaves,
# advisors:leak_hunt, advisors:letter_refused, advisors:nfu_hollow.

# ---------------------------------------------------------------- pairings

- id: adv_01_a_senior_defence_source
  advisor: aide
  acts: [1, 5]
  conditions: { pieces_any: [hawk_general, dove_fm] }
  tags: [personal, domestic]
  note: Hawk and Dove. He briefed against her; she has read it twice. Which of them you keep is decided by breakfast.
  text: >-
    Tomorrow's front page quotes 'a senior defence source': the Foreign
    Minister is 'negotiating with herself'. The General has not denied it, and
    she wants five minutes before eight.
  left:
    text: "Make the General apologise"
    effects: { military: -5, allies: 3, trust_primary: 3, public: -2 }
    tags: [personal, transparency, diplomacy]
    set: [advisors:general_rebuked]
  right:
    text: "Ignore it. Sources are weather"
    effects: { military: 3, allies: -3, trust_primary: -3, commitment: 3 }
    tags: [personal, secrecy, deterrence]
    set: [advisors:general_backed]

- id: adv_02_what_a_person_is_worth
  advisor: spin_doctor
  acts: [1, 5]
  timer: 10
  timeout: left
  conditions: { pieces_all: [paranoid_intel, spin_doctor] }
  tags: [personal, intel, domestic]
  note: Paranoid Director and Spin Doctor. A week on the front page against a source who is a person.
  text: >-
    Our spies have one frightened source saying they moved warheads to the
    Sallow crossing. Front page by six and we own the week, but it burns the
    source, and the source is a person.
  left:
    text: "Give it to the press"
    effects: { public: 6, intel: -9, trust_primary: -5, commitment: 4 }
    tags: [personal, domestic, public_commitment]
  right:
    text: "Sit on it. Protect the source"
    effects: { public: -3, intel: 4, military: 2 }
    tags: [personal, intel, secrecy]

- id: adv_03_the_invoice
  advisor: treasury
  acts: [1, 4]
  conditions: { pieces_all: [treasury_hawk, contractor] }
  tags: [personal, economy, military]
  note: Treasury Hawk and Contractor. The capability is the reserve, twice, and forty seats.
  text: >-
    The arms dealer's coastal deal is on your desk: 1.4 billion over three
    years, our emergency reserve twice over. Someone also sent me a list:
    forty lawmakers whose towns build it.
  left:
    text: "Sign it"
    effects: { economy: -6, military: 6, public: 2, trust_primary: -3 }
    tags: [personal, military, economy]
    set: [advisors:contract_signed]
  right:
    text: "Send it back unsigned"
    effects: { military: -5, public: -3, economy: 3 }
    tags: [personal, economy, stall]
    set: [advisors:contract_refused]
    follow: [{ card: adv_27_no_hard_feelings, in: 3, chance: 0.8 }]

- id: adv_04_over_her_head
  advisor: admiral
  acts: [1, 5]
  timer: 10
  timeout: right
  conditions: { pieces_all: [admiral, hawk_general] }
  tags: [personal, naval, military]
  note: Admiral and General. His staff moved her frigates while she slept. Who gives the next order.
  text: >-
    At 02:00 the General's staff sent my two frigates toward the {rival_adj}
    picket line, and my captains obeyed because the order carried your name.
    Tell me who gives the next one.
  left:
    text: "Tell him the sea is hers"
    effects: { military: -3, escalation: -2, intel: 2, allies: 2 }
    tags: [personal, naval, deescalate]
  right:
    text: "Back the General"
    effects: { military: 4, escalation: 3, allies: -2, intel: -2 }
    tags: [personal, military, escalatory]
    set: [advisors:admiral_overruled]

- id: adv_05_one_sentence
  advisor: peace_leader
  acts: [1, 4]
  conditions: { pieces_all: [peace_leader, spin_doctor] }
  tags: [personal, domestic, reassurance]
  note: Peace Leader and Spin Doctor. Karrick wants her on the steps. She wants a sentence he says you cannot say.
  text: >-
    Your spin doctor wants me beside you on the steps Saturday, because the
    crowd is mine and the steps are yours. I will stand there if you say one
    thing: {us} will not fire first.
  left:
    text: "Say the sentence"
    effects: { public: 6, military: -6, trust_primary: 5, commitment: 5 }
    tags: [personal, public_commitment, reassurance]
  right:
    text: "Stand on the steps alone"
    effects: { public: -5, military: 3, trust_primary: -2, escalation: 1 }
    tags: [personal, deterrence, domestic]

- id: adv_06_you_may_prefer_not_to_know
  advisor: legal
  acts: [2, 5]
  conditions: { pieces_any: [fixer] }
  tags: [personal, domestic]
  note: Fixer and the Attorney General. A subpoena went away with a committee chair's health. She can find out how.
  text: >-
    A committee wanted your Chief of Staff's phone records; then its chairman
    fell ill and the request died. He says he sent flowers, and once I know
    what else he sent, I must act.
  left:
    text: "Find out"
    effects: { public: -4, intel: 3, economy: -1 }
    tags: [personal, investigate, transparency]
  right:
    text: "Tell her not to look"
    effects: { public: 2, commitment: 3, intel: -2 }
    tags: [personal, secrecy]
    follow: [{ card: adv_28_the_florist, in: 4, chance: 0.5 }]

# ---------------------------------------------------------------- one voice each

- id: adv_07_the_army_will_hear_it
  advisor: hawk_general
  acts: [2, 5]
  timer: 10
  timeout: left
  conditions: { pieces_any: [hawk_general] }
  tags: [personal, military]
  note: The General's letter is with a journalist, timed for six. The timeout keeps the readiness level.
  text: >-
    Lower the army's alert tonight and I will not be the officer who explains
    it to them. My resignation is written and a copy is with a journalist,
    timed for six.
  left:
    text: "Keep the army on alert"
    effects: { military: 5, escalation: 4, trust_primary: -4, public: 1 }
    tags: [personal, military, deterrence, mobilise]
  right:
    text: "Lower it. Call his bluff"
    effects: { military: -6, escalation: -4, trust_primary: 4, public: -2 }
    tags: [personal, deescalate, domestic]
    odds:
      label: He stays
      base: 0.6
      tags: [military]
      success:
        text: "He stays. The letter goes back in the drawer, and the journalist gets a different story at six."
        effects: { military: 2 }
      failure:
        text: "The letter runs at six. He withdraws it at nine, after the Admiral has a word, and by then everyone has read it."
        effects: { public: -4, military: -3 }

- id: adv_08_a_number_not_on_any_list
  advisor: dove_fm
  acts: [2, 5]
  conditions: { pieces_any: [dove_fm] }
  tags: [personal, diplomacy, back_channel]
  note: The Dove has been calling their Foreign Minister on her own. The only line without a translator.
  text: >-
    Three times this week I called the {rival_adj} foreign minister on a
    number on no list, and nobody knew. We have agreed nothing yet, and it is
    our only line with no translator.
  left:
    text: "Keep talking. Tell no one"
    effects: { trust_primary: 6, military: -3, allies: -3, commitment: -2 }
    tags: [personal, back_channel, secrecy, diplomacy]
    set: [advisors:fm_freelancing]
  right:
    text: "Route every call through me"
    effects: { trust_primary: -4, military: 2, intel: 2, public: 1 }
    tags: [personal, diplomacy, stall]

- id: adv_09_the_other_seven
  advisor: intel_director
  acts: [1, 5]
  conditions: { pieces_any: [paranoid_intel] }
  tags: [personal, intel]
  note: The unsleeping Director wants the cabinet's mail for fourteen days. The roll is whether he finds anyone.
  text: >-
    Monday's cabinet meeting was in {rival_capital} by Tuesday, if one good
    source is right. Nine people were in the room; I want the other seven's
    mail for two weeks, quietly.
  left:
    text: "Fourteen days. Nobody is told"
    effects: { intel: 6, military: -4, allies: -3 }
    tags: [personal, intel, secrecy, investigate]
    set: [advisors:cabinet_watched]
    odds:
      label: Leak found
      base: 0.5
      tags: [intel]
      success:
        text: "A deputy at the Treasury with a friend in their trade mission. Handled quietly by Thursday."
        effects: { intel: 4, public: 2 }
      failure:
        text: "Fourteen days, seven ministers, nothing. On day fifteen the General finds the tap."
        effects: { military: -5, public: -3, allies: -2 }
  right:
    text: "Refuse. Not my cabinet"
    effects: { intel: -5, military: 2, public: 2 }
    tags: [personal, transparency, stall]

- id: adv_10_three_days
  advisor: intel_director
  acts: [1, 4]
  conditions: { pieces_any: [cautious_intel] }
  tags: [personal, intel]
  note: The measured Director held a report for three days. He was right. The General has said otherwise to the gallery.
  text: >-
    The rocket report reached you this morning and me on Friday. I held it
    three days to check a source who was wrong twice before, and the General
    has told the press what he thinks.
  left:
    text: "Back the three days"
    effects: { intel: 5, military: -5, public: -2 }
    tags: [personal, intel, investigate]
  right:
    text: "Tell him: next time, Friday"
    effects: { intel: -4, military: 3, escalation: 2 }
    tags: [personal, intel, military]

- id: adv_11_over_dinner
  advisor: ambassador
  acts: [2, 5]
  conditions: { pieces_all: [cautious_intel, ambassador] }
  tags: [personal, back_channel, intel]
  note: Ambassador and measured Director. A report given away as a courtesy tells them what we can see.
  text: >-
    Our spies say their build-up at the Sallow crossing is defensive, and for
    once they are sure. Let me tell their ambassador at dinner, though it also
    shows them what we can see.
  left:
    text: "Let him have the dinner"
    effects: { trust_primary: 6, intel: -5, military: -2 }
    tags: [personal, back_channel, transparency, diplomacy]
    odds:
      label: Believed
      base: 0.6
      tags: [back_channel, diplomacy]
      success:
        text: "Their ambassador reads it twice and orders a second bottle. Their sentries at the crossing stand down by morning."
        effects: { escalation: -4, trust_primary: 3 }
      failure:
        text: "Their ambassador thanks him warmly. Two days later our report is quoted, wrongly, on their state news."
        effects: { intel: -4, public: -3 }
  right:
    text: "Keep the paper in the building"
    effects: { trust_primary: -3, intel: 3, escalation: 1 }
    tags: [personal, intel, secrecy]

- id: adv_12_a_tourist_visa
  advisor: ambassador
  acts: [2, 5]
  conditions: { pieces_any: [ambassador] }
  tags: [personal, back_channel, diplomacy]
  note: The Ambassador has a visa, a hotel near the opera and a lunch. Nobody has sent him. That is the point.
  text: >-
    I have a tourist visa for {rival_capital} and lunch there with an old
    friend two doors from {rival_leader}. Nobody sent me, and at seventy-one
    'on holiday' will be believed.
  left:
    text: "Go. You are on holiday"
    effects: { trust_primary: 4, intel: 3, public: -2, military: -2 }
    tags: [personal, back_channel, secrecy]
    odds:
      label: The lunch happens
      base: 0.6
      tags: [back_channel]
      success:
        text: "Two hours, no notes. What they want is smaller than the General thinks and larger than the Foreign Minister hopes."
        effects: { trust_primary: 4, intel: 4 }
      failure:
        text: "He is photographed at the airport by their press. The holiday story lasts a day."
        effects: { public: -5, trust_primary: -3, allies: -2 }
  right:
    text: "Cancel the holiday"
    effects: { trust_primary: -2, intel: -2, military: 1 }
    tags: [personal, stall, diplomacy]

- id: adv_13_ninety_percent
  advisor: cyber_director
  acts: [1, 5]
  timer: 12
  timeout: right
  conditions: { pieces_any: [cyber_director] }
  tags: [personal, attribution, cyber]
  note: Vance's 'consistent with' has been briefed as 'ninety percent'. She wants her sentence back before it becomes a war.
  text: >-
    Someone here told reporters I am 'ninety percent sure' {rival_capital} cut
    the power. I wrote 'looks like their tools', and I want that back before
    it starts a war in my name.
  left:
    text: "Correct the record"
    effects: { public: -4, intel: 4, trust_primary: 4, military: -2 }
    tags: [personal, transparency, attribution]
  right:
    text: "Let ninety stand"
    effects: { public: 3, intel: -5, trust_primary: -4, commitment: 4 }
    tags: [personal, attribution, public_commitment, secrecy]

- id: adv_14_is_and_consistent_with
  advisor: cyber_director
  acts: [2, 5]
  conditions: { pieces_all: [cyber_director, paranoid_intel] }
  tags: [personal, attribution, intel]
  note: Cyber Director and unsleeping Director. He rewrote her paragraph. He is right about the cost of nothing, wrong about the words.
  text: >-
    The Spy Chief rewrote me: 'looks like their tools' is now 'was them', and
    'probably' is gone. He says nobody acts on 'probably' at 3am, which is
    true, and beside the point.
  left:
    text: "Send her version to cabinet"
    effects: { intel: 4, military: -3, escalation: -2, public: -1 }
    tags: [personal, attribution, intel, stall]
  right:
    text: "Send his version"
    effects: { intel: -4, military: 3, escalation: 3, commitment: 3 }
    tags: [personal, attribution, escalatory]

- id: adv_15_the_word_ceiling
  advisor: treasury
  acts: [2, 5]
  conditions: { pieces_any: [treasury_hawk] }
  tags: [personal, economy, domestic]
  note: The Chancellor has a number and a letter. One word in public keeps the letter in the drawer.
  text: >-
    We borrow at 1.9 percent today, 3.1 after the General's press conference,
    and at four I am no longer a chancellor. Say 'ceiling' about defence
    today, or accept my resignation.
  left:
    text: "Say 'ceiling'"
    effects: { economy: 5, military: -6, public: -2, commitment: 3 }
    tags: [personal, economy, public_commitment, domestic]
  right:
    text: "Refuse. No ceilings this month"
    effects: { economy: -4, military: 4, public: 2 }
    tags: [personal, military, economy]
    set: [advisors:chancellor_letter]

- id: adv_16_a_fellowship_abroad
  advisor: fixer
  acts: [2, 5]
  conditions: { pieces_any: [fixer] }
  tags: [personal, domestic, secrecy]
  note: The Fixer made a story go away. The foundation that paid for it would like a word about tariffs.
  text: >-
    The story about your brother's import licences has stopped; the reporter
    took a sudden fellowship abroad. The foundation that paid for it wants a
    word about the Amberline tariffs.
  left:
    text: "Listen to the foundation"
    effects: { public: 3, economy: -3, allies: -2, trust_secondary: -2 }
    tags: [personal, economy, secrecy]
  right:
    text: "Bring the journalist home"
    effects: { public: -6, economy: 2, trust_secondary: 2 }
    tags: [personal, transparency, domestic]

- id: adv_17_forty_minutes
  advisor: admiral
  acts: [1, 4]
  conditions: { pieces_any: [admiral] }
  tags: [personal, naval]
  note: The Admiral's captain could not reach you for forty minutes with a submarine at four thousand yards.
  text: >-
    Last night the Tern's captain had a {rival_adj} submarine four thousand
    yards off and could not reach you for forty minutes. Next time he may not
    have forty minutes.
  left:
    text: "Give him standing orders"
    effects: { military: 4, escalation: 3, commitment: 3, intel: -2 }
    tags: [personal, naval, military]
    set: [advisors:standing_orders]
  right:
    text: "Promise he can always reach you"
    effects: { military: -3, intel: 3, escalation: -2, public: -1 }
    tags: [personal, naval, stall]

- id: adv_18_as_a_person
  advisor: peace_leader
  acts: [2, 5]
  conditions: { pieces_any: [peace_leader] }
  tags: [personal, nuclear, domestic]
  note: 3am. Not the movement, a person. Whether you would give the order. Either answer costs the square or the army.
  text: >-
    It is three in the morning and I am not here for the movement. A month in
    your cabinet and I still do not know if you would give the order, so tell
    me as a person: would you?
  left:
    text: "Tell her no"
    effects: { public: 4, military: -6, trust_primary: 3, commitment: 5 }
    tags: [personal, nuclear, reassurance]
    set: [advisors:promised_no]
  right:
    text: "Refuse to answer"
    effects: { public: -6, military: 3, trust_primary: -2 }
    tags: [personal, deterrence, domestic]
    set: [advisors:square_leaves]

- id: adv_19_both_sides_of_the_border
  advisor: contractor
  acts: [2, 5]
  conditions: { pieces_any: [contractor] }
  tags: [personal, economy, military]
  note: The Contractor has a radar contract with Amberline. It can see into us as easily as out. Tuesdays.
  text: >-
    Tomorrow you will hear my firm sold Amberline a radar that sees into {us}
    as well as out. I can cancel and pay the penalty, or leave it and tell you
    each Tuesday what it sees.
  left:
    text: "Let it stand. Tuesdays"
    effects: { intel: 6, allies: -4, public: -3, trust_primary: -2 }
    tags: [personal, intel, secrecy, economy]
  right:
    text: "Cancel it"
    effects: { economy: -3, public: 3, allies: 2, intel: -2 }
    tags: [personal, economy, transparency]

- id: adv_20_the_minutes
  advisor: aide
  acts: [2, 5]
  conditions: { pieces_any: [hawk_general, spin_doctor, treasury_hawk] }
  tags: [personal, domestic, intel]
  note: Ferrante has the minutes, not a summary. Five copies. You still sit with all five on Monday.
  text: >-
    A reporter has Tuesday's cabinet minutes: three lines you would not want
    read aloud, one of them yours. Five people had copies, and you sit with
    all five on Monday.
  left:
    text: "Find the leak"
    effects: { intel: 4, military: -3, public: -3 }
    tags: [personal, investigate, intel]
    set: [advisors:leak_hunt]
    odds:
      label: Leak found
      base: 0.5
      tags: [intel]
      success:
        text: "A junior in the Cabinet Office, in love with a reporter. Gone by Friday, and the other four never know they were counted."
        effects: { public: 2, intel: 2 }
      failure:
        text: "Five people, five alibis. On Monday they all know they were suspected, and the meeting is very short."
        effects: { military: -3, allies: -2, economy: -1 }
  right:
    text: "Let it go. Leaks are weather"
    effects: { public: -5, commitment: 3, trust_primary: -2 }
    tags: [personal, stall, domestic]

# ---------------------------------------------------------------- the letter (rare)

- id: adv_21_a_line_at_the_bottom
  advisor: aide
  acts: [3, 5]
  weight: 0.5
  conditions: { values: { public: { max: 30 } } }
  tags: [personal, domestic]
  note: Rare. Public below 30. The cabinet has left a letter. Signing forces ending special_resigned (endings job).
  text: >-
    At 02:40 the Chancellor, the Attorney General and two others left the
    anteroom, and a letter. The country needs a leader it can hear, it says,
    and there is a line for your name.
  left:
    text: "Sign it"
    tags: [personal, concede, domestic]
    ending: special_resigned
  right:
    text: "Tear it up"
    effects: { public: -4, military: -3, allies: -3, commitment: 6 }
    tags: [personal, deterrence, domestic]
    set: [advisors:letter_refused]

# ---------------------------------------------------------------- doctrines on trial

- id: adv_22_seven_times_in_ten
  advisor: intel_director
  acts: [1, 5]
  conditions: { pieces_any: [launch_on_warning] }
  tags: [personal, nuclear, intel]
  note: Launch on Warning, questioned by the man who reads the board. He wants a second radar and a second voice.
  text: >-
    Your rule says if the radar lights up, we fire before we know. It is right
    seven times in ten, the rest is software and weather; I want a second
    radar and a second voice first.
  left:
    text: "Two voices before anyone fires"
    effects: { military: -6, intel: 5, escalation: -3, trust_primary: 3 }
    tags: [personal, nuclear, intel, investigate]
  right:
    text: "Keep the rule"
    effects: { military: 4, commitment: 4, intel: -3, escalation: 2 }
    tags: [personal, nuclear, deterrence, escalatory]

- id: adv_23_as_if_you_had_not_said_it
  advisor: hawk_general
  acts: [2, 5]
  conditions: { pieces_any: [no_first_use] }
  tags: [personal, nuclear, military]
  note: No First Use, questioned by the General. Every plan on his desk begins on the second day of a war.
  text: >-
    You said out loud we would never fire first, and their planners took you
    at your word. So did mine, so every plan on my desk starts on day two of a
    war; let me plan day one.
  left:
    text: "Plan as if I had not said it"
    effects: { military: 5, trust_primary: -5, commitment: -3, intel: 2 }
    tags: [personal, nuclear, military, secrecy]
    set: [advisors:nfu_hollow]
    odds:
      label: Stays secret
      base: 0.6
      tags: [intel]
      success:
        text: "The plans stay in the safe. The General sleeps better and the Foreign Minister does not know why."
        effects: { military: 2 }
      failure:
        text: "The cover sheet is in {rival_capital} within a week. Your word is now their word for 'plan'."
        effects: { trust_primary: -8, public: -3 }
  right:
    text: "I meant it. Plan from there"
    effects: { military: -5, trust_primary: 4, commitment: 4, public: 1 }
    tags: [personal, nuclear, reassurance]

- id: adv_24_engineers
  advisor: dove_fm
  acts: [2, 5]
  conditions: { pieces_any: [red_lines] }
  tags: [personal, commitment_trap, diplomacy]
  note: Red Lines, questioned by the Foreign Minister. Forty engineers are on our side of the river you named.
  text: >-
    You said on camera that {rival_adj} troops crossing the Aum would be a red
    line. Forty of their engineers are on our bank mending a bridge, and their
    generals ask if that counts.
  left:
    text: "Hold the line where you drew it"
    effects: { commitment: 8, escalation: 5, public: 3, trust_primary: -6, military: 3 }
    tags: [personal, public_commitment, deterrence, commitment_trap]
    odds:
      label: They pull back
      base: 0.5
      tags: [adversary]
      success:
        text: "The engineers leave at dusk with the span half-built. The town council in Vestria is furious with everyone."
        effects: { escalation: -3, public: 3 }
      failure:
        text: "They stay. Forty engineers, one red line, and a camera crew on the bridge by morning."
        effects: { escalation: 7, public: -4, commitment: 4 }
  right:
    text: "Say engineers do not count"
    effects: { public: -6, commitment: -7, trust_primary: 5, allies: -3, escalation: -3 }
    tags: [personal, walk_back, diplomacy, deescalate]

- id: adv_25_one_of_them_did
  advisor: legal
  acts: [2, 5]
  timer: 9
  timeout: left
  conditions: { pieces_any: [predelegation] }
  tags: [personal, military, domestic]
