# FLASHPOINT — The Intercept (fp_intercept). Acts 1–5.
# Normal path (entry fp_intercept_01_one_bird): a real launch, an intercept roll,
# then the response. Terminals set exactly one of fp:intercept_restrained,
# fp:intercept_retaliated, fp:intercept_exchange. The catastrophic branch (08)
# forces nuclear_intercept_exchange on an odds failure.
# False-alarm path (entry fp_intercept_fa_01_eleven_tracks): the board shows
# launches that are not there. Launch on Warning turns it into a launch decision
# (fa_02); otherwise waiting costs (fa_03 / fa_05). Terminals set
# fp:intercept_false_alarm_caught and clear false_alarm_live.
# Piece hooks: missile_defence + deterrence_by_denial (04a), no_first_use (09,
# first_use odds), launch_on_warning (fa_02), hardened_nc3 (fa_05), civil_defence (fa_06).

# ================================================================ normal path
- id: fp_intercept_01_one_bird
  flashpoint: fp_intercept
  advisor: watch_officer
  acts: [1, 5]
  timer: 10
  timeout: right
  tags: [nuclear, warning, missile_defence]
  note: "Entry. Real launch. Timeout lets it fly, the worse side with an unknown warhead over Caldor."
  text: >-
    04:51, one vehicle out of the {rival_adj} northern range, ballistic, both radars
    and the constellation agree. Predicted impact is the sea off Caldor, and the
    ellipse has the island in it. Warhead unknown, flight time eleven minutes. The
    battery commander at Caldor is asking for a release, and I have told him to wait
    for you.
  left:
    text: "Release the interceptors"
    effects: { military: 12, escalation: 10, economy: -8, trust_primary: -8 }
    tags: [missile_defence, military, nuclear]
    odds:
      label: Intercept
      base: 0.55
      tags: [intercept]
      success:
        text: >-
          Two interceptors, one hit, at 04:58 and a hundred and ten miles up. The
          debris comes down in the sea. Caldor hears the boom and nothing else.
        effects: { public: 12, allies: 8 }
        follow: [{ card: fp_intercept_02_splash, in: 0 }]
      failure:
        text: >-
          Two interceptors, two misses. The vehicle comes down thirty miles off
          Caldor's harbour, and the harbour cameras get all of it.
        effects: { public: -14, military: -10 }
        follow: [{ card: fp_intercept_03_two_misses, in: 0 }]
  right:
    text: "Let it fly. Track everything."
    effects: { military: -12, public: -12, intel: 10 }
    tags: [stall, intel, nuclear]
    follow:
      - { card: fp_intercept_04a_the_layer_you_did_not_use, in: 0 }
      - { card: fp_intercept_04b_splash_zone, in: 0 }

- id: fp_intercept_02_splash
  flashpoint: fp_intercept
  advisor: hawk_general
  acts: [1, 5]
  tags: [nuclear, military, missile_defence]
  note: "Intercept succeeded. The hawk has a package."
  text: >-
    Intercept confirmed, warhead inert, nothing on the island but a broken window
    in the harbourmaster's office. They will call it a test that strayed. It was
    aimed to within four miles of a town of nine thousand people. A package that
    answers a test with a test can be in the air in six minutes, into the sea off
    their coast, and it would be understood.
  left:
    text: "Send the package"
    effects: { military: 14, escalation: 16, trust_primary: -14, public: 6 }
    tags: [strike, military, escalatory, nuclear]
    follow: [{ card: fp_intercept_06_the_package, in: 0 }]
  right:
    text: "Call it a test. Get me the line."
    effects: { military: -14, public: -8, trust_primary: 8, escalation: -6 }
    tags: [deescalate, reassurance, diplomacy]
    follow: [{ card: fp_intercept_05_the_line, in: 0 }]

- id: fp_intercept_03_two_misses
  flashpoint: fp_intercept
  advisor: watch_officer
  acts: [1, 5]
  tags: [nuclear, military, missile_defence]
  note: "Intercept failed. Inert impact, public failure."
  text: >-
    Impact 05:02, thirty-one miles east of Caldor harbour, inert. No casualties, a
    fishing boat with a cracked wheelhouse and a very good camera. Both interceptors
    are in the sea a long way from where they were meant to be. The battery
    commander would like it on record that he asked for the release at 04:53.
  left:
    text: "Answer it now. Same range, same sea."
    effects: { military: 12, escalation: 18, trust_primary: -14, public: 10 }
    tags: [strike, military, escalatory, nuclear]
    follow: [{ card: fp_intercept_06_the_package, in: 0 }]
  right:
    text: "Hotline first. Then the cameras."
    effects: { military: -12, public: -14, escalation: -4, intel: 8 }
    tags: [diplomacy, stall, nuclear]
    follow: [{ card: fp_intercept_05_the_line, in: 0 }]

- id: fp_intercept_04a_the_layer_you_did_not_use
  flashpoint: fp_intercept
  advisor: hawk_general
  acts: [1, 5]
  conditions: { pieces_any: [missile_defence, deterrence_by_denial] }
  tags: [nuclear, military, missile_defence, domestic]
  note: "Complicates Missile Defence and Deterrence by Denial. You had the shield and watched."
  text: >-
    Impact at 05:02, inert, thirty-one miles off Caldor. We have spent four years
    and a great deal of money telling them nothing reaches us. Something reached us,
    on purpose, and the battery that exists to stop it was told to watch. The crews
    know. By tonight the country will know. I need something to give them.
  left:
    text: "Give them the package"
    effects: { military: 16, escalation: 18, trust_primary: -14, public: 12 }
    tags: [strike, military, escalatory, nuclear]
    follow: [{ card: fp_intercept_06_the_package, in: 0 }]
  right:
    text: "Give them the truth. Then the line."
    effects: { military: -16, public: -16, trust_primary: 10, commitment: -8 }
    tags: [transparency, diplomacy, nuclear]
    follow: [{ card: fp_intercept_05_the_line, in: 0 }]

- id: fp_intercept_04b_splash_zone
  flashpoint: fp_intercept
  advisor: intel_director
  acts: [1, 5]
  conditions: { pieces_none: [missile_defence, deterrence_by_denial] }
  tags: [nuclear, intel, misperception]
  note: "Let it fly, no shield held. The intel director reads the impact."
  text: >-
    Impact 05:02, inert, thirty-one miles east of Caldor. We assess with moderate
    confidence that the aim point was the water, not the island. We assess with high
    confidence that we were meant to see how long we took to decide. Eleven minutes,
    and the answer was that we watched. They have that number now.
  left:
    text: "Give them a number of our own"
    effects: { military: 14, escalation: 18, trust_primary: -12, public: 8 }
    tags: [strike, military, escalatory, nuclear]
    follow: [{ card: fp_intercept_06_the_package, in: 0 }]
  right:
    text: "Take it to the line"
    effects: { military: -12, public: -10, intel: 8, escalation: -4 }
    tags: [diplomacy, deescalate, nuclear]
    follow: [{ card: fp_intercept_05_the_line, in: 0 }]

- id: fp_intercept_05_the_line
  flashpoint: fp_intercept
  advisor: hotline
  acts: [1, 5]
  tags: [nuclear, diplomacy, misperception]
  note: "Their account. Accepting it costs at home; rejecting it goes to the package."
  text: >-
    "{Rival} conducted a scheduled test of a re-entry vehicle into international
    waters. Notification was filed with the Assembly Secretariat at 04:30
    {rival_capital} time." A pause. "The Premier regrets any alarm in Caldor." The
    Secretariat's night desk confirms a fax arrived at 04:31. It was a test, and it
    was aimed.
  left:
    text: "Accept it. Demand the calendar."
    effects: { escalation: -12, trust_primary: 8, public: -12, military: -10, commitment: -6 }
    tags: [deescalate, diplomacy, nuclear]
    spend_charge: deescalation
    follow: [{ card: fp_intercept_07_the_morning_after, in: 0 }]
  right:
    text: "A fax is not a notice. Bombers up."
    effects: { escalation: 14, military: 12, trust_primary: -12, public: 8, commitment: 8 }
    tags: [mobilise, military, escalatory, public_commitment]
    follow: [{ card: fp_intercept_06_the_package, in: 0 }]

- id: fp_intercept_06_the_package
  flashpoint: fp_intercept
  advisor: hawk_general
  acts: [1, 5]
  timer: 8
  timeout: left
  tags: [nuclear, military, strike]
  note: "The retaliation. Timeout sends it, the worse side. Success is a terminal (retaliated); failure goes to the second track."
  text: >-
    The package is one vehicle, inert, into the sea forty miles off their northern
    port, notified to nobody. It lands eleven minutes after launch, which is a number
    they will recognise. Their coastal radar sees it at the same moment their
    harbourmaster does. What they do in those eleven minutes is not up to me.
  left:
    text: "Send it"
    effects: { military: 12, escalation: 20, trust_primary: -16, public: 8 }
    tags: [strike, military, escalatory, nuclear]
    odds:
      label: They swallow it
      base: 0.5
      tags: [adversary]
      success:
        text: >-
          It lands. Their statement, forty minutes later, calls it a regrettable test
          that should have been notified. "Regrettable" is a door left open.
        effects: { escalation: -6, public: 6, commitment: 6 }
        set: [fp:intercept_retaliated]
      failure:
        text: >-
          Their coastal battery fires at it and misses. Then two tracks rise out of
          the northern range, and this time the ellipses are on land.
        effects: { escalation: 14, military: -6, intel: -6 }
        follow: [{ card: fp_intercept_08_second_track, in: 0 }]
  right:
    text: "Hold it. Bring the bombers home."
    effects: { military: -16, public: -12, escalation: -8, trust_primary: 6, commitment: -10 }
    tags: [deescalate, walk_back, reassurance, nuclear]
    follow: [{ card: fp_intercept_07_the_morning_after, in: 0 }]

- id: fp_intercept_07_the_morning_after
  flashpoint: fp_intercept
  advisor: aide
  acts: [1, 5]
  tags: [nuclear, domestic, transparency]
  note: "Terminal, restrained. Publishing burns the radar picture; secrecy costs the allies."
  text: >-
    06:40. The Caldor ferry sailed on time, which the harbourmaster wanted you to
    know. The Assembly wants a statement by nine, the General wants the battery kept
    hot and the Chancellor wants to know who pays for two interceptors. Everyone
    wants to know how close it came. The trajectory file is on my desk and nobody has
    asked me for it yet.
  left:
    text: "Publish the trajectory. All of it."
    effects: { escalation: -16, public: -10, allies: 10, trust_primary: 10, intel: -8 }
    tags: [transparency, deescalate, nuclear]
    set: [fp:intercept_restrained]
  right:
    text: "Four miles stays in this building"
    effects: { escalation: -12, public: 8, trust_primary: -6, allies: -8, commitment: 6 }
    tags: [secrecy, deescalate, nuclear]
    set: [fp:intercept_restrained]

- id: fp_intercept_08_second_track
  flashpoint: fp_intercept
  advisor: watch_officer
  acts: [1, 5]
  timer: 8
  timeout: left
  tags: [nuclear, warning, missile_defence]
  note: "Catastrophic branch. Left launches; right rolls the intercept and fails into the same ending."
  text: >-
    Two tracks, northern range, 05:31, both radars. Ellipses on the Caldor battery
    and the bomber field at Harrow Vale. Warheads unknown, nine minutes. The release
    authority is in the room, and the room is you.
  left:
    text: "Launch the response"
    effects: { escalation: 30, military: 10 }
    tags: [nuclear, strike, escalatory]
    set: [fp:intercept_exchange]
    ending: nuclear_intercept_exchange
  right:
    text: "Intercept. Only intercept."
    effects: { military: 8, escalation: 12, economy: -10 }
    tags: [missile_defence, military, nuclear]
    odds:
      label: Intercept
      base: 0.5
      tags: [intercept]
      success:
        text: >-
          Two hits, 05:37 and 05:38. The pieces come down on farmland and on the sea.
          Both warheads were inert, which the General says we will never be able to
          prove we knew.
        effects: { public: 10, military: 6, allies: 6 }
        follow: [{ card: fp_intercept_09_the_question, in: 0 }]
      failure:
        text: >-
          One hit. The second comes down on the bomber field at Harrow Vale, and it
          is not inert.
        effects: { escalation: 30 }
        set: [fp:intercept_exchange]
        ending: nuclear_intercept_exchange

- id: fp_intercept_09_the_question
  flashpoint: fp_intercept
  advisor: hotline
  acts: [1, 5]
  tags: [nuclear, diplomacy, commitment_trap]
  note: "Terminal. No First Use moves the first_use roll. Left can end retaliated or exchange; right is exchange."
  text: >-
    "The Premier asks {leader} directly whether {us} intends to use nuclear weapons
    in the next hour." The translator's voice is not steady. "He says that he does
    not, and asks that you say the same, so that both of you can be heard to have
    said it." Twenty seconds of nothing on the line. "He is waiting."
  left:
    text: "Tell him no. Then make it true."
    effects: { escalation: -10, military: -14, public: -8, trust_primary: 12 }
    tags: [deescalate, reassurance, nuclear, public_commitment]
    odds:
      label: He believes you
      base: 0.5
      tags: [first_use, adversary]
      success:
        text: >-
          "The Premier hears you." A stand-down order to their northern range is read
          over the line in the original and then in translation, slowly, so that our
          people can check the words.
        effects: { escalation: -12, allies: 8, commitment: 6 }
        set: [fp:intercept_retaliated]
      failure:
        text: >-
          "The Premier has heard such words before." The line stays open. Behind it
          two more of their launchers move to firing positions and ours do the same.
          Nobody fires. Nobody comes down from it either.
        effects: { escalation: 20, military: 8, trust_primary: -10 }
        set: [fp:intercept_exchange]
  right:
    text: "Say nothing he can quote"
    effects: { escalation: 22, military: 10, commitment: 10, trust_primary: -14, public: -6 }
    tags: [secrecy, deterrence, nuclear, escalatory]
    set: [fp:intercept_exchange]

# ================================================================ false-alarm path
- id: fp_intercept_fa_01_eleven_tracks
  flashpoint: fp_intercept
  advisor: watch_officer
  acts: [1, 5]
  tags: [nuclear, warning, intel, misperception]
  note: "False-alarm entry. The tracks are not there. Branches by piece: fa_02 (Launch on Warning), fa_05 (Hardened NC3), fa_03 (neither)."
  text: >-
    04:12. Eleven tracks, polar sector, both radars, ballistic, and the constellation
    has plumes under nine of them. Predicted impacts are {capital}, the bomber fields
    and the Caldor battery, first impact in nineteen minutes. Every rule we wrote
    after the last alert has been met, sir or ma'am. I am telling you because the
    rules say I tell you, and they say what comes next.
  left:
    text: "Bring the release authority in"
    effects: { escalation: 14, military: 10, public: -8, commitment: 8 }
    tags: [nuclear, military, mobilise, warning]
    follow:
      - { card: fp_intercept_fa_02_the_doctrine, in: 0 }
      - { card: fp_intercept_fa_05_three_keys, in: 0 }
      - { card: fp_intercept_fa_03_the_honest_number, in: 0 }
  right:
    text: "Wake nobody yet. Get me the tapes."
    effects: { military: -14, intel: 10, escalation: 4 }
    tags: [stall, intel, warning, nuclear]
    follow:
      - { card: fp_intercept_fa_02_the_doctrine, in: 0 }
      - { card: fp_intercept_fa_05_three_keys, in: 0 }
      - { card: fp_intercept_fa_03_the_honest_number, in: 0 }

- id: fp_intercept_fa_02_the_doctrine
  flashpoint: fp_intercept
  advisor: hawk_general
  acts: [1, 5]
  timer: 8
  timeout: left
  conditions: { pieces_any: [launch_on_warning] }
  tags: [nuclear, warning, military, misperception]
  note: "Launch on Warning makes the false alarm a launch decision. Timeout executes, the worse side. Second radar roll is intel-tagged."
  text: >-
    The doctrine is the doctrine. Eleven inbound, nineteen minutes, confirmed on two
    sensors, and the codes are open in front of you because you decided a year ago
    that they would be. The second radar chain rotates onto the polar sector in
    ninety seconds. If we wait for it and the tracks are real, the bomber fields are
    gone before the order reaches them.
  left:
    text: "Execute"
    effects: { escalation: 30, military: 12 }
    tags: [nuclear, strike, escalatory]
    ending: nuclear_launch_on_warning
  right:
    text: "Ninety seconds. Second radar."
    effects: { military: -14, commitment: -10, escalation: 8 }
    tags: [stall, intel, nuclear]
    odds:
      label: Second radar
      base: 0.5
      tags: [intel]
      success:
        text: >-
          The second chain sees an empty sky. The eleven tracks drop off the board one
          at a time, like lights going out along a street.
        effects: { intel: 8, public: -8 }
        clear: [false_alarm_live]
        set: [fp:intercept_false_alarm_caught]
        follow:
          - { card: fp_intercept_fa_06_the_sirens, in: 0 }
          - { card: fp_intercept_fa_04_the_tape, in: 0 }
      failure:
        text: >-
          The second chain reports the same eleven tracks, because it reads the same
          correlator. Six minutes to impact. The General does not say anything. He
          does not have to.
        effects: { escalation: 30 }
        ending: nuclear_launch_on_warning

- id: fp_intercept_fa_03_the_honest_number
  flashpoint: fp_intercept
  advisor: intel_director
  acts: [1, 5]
  timer: 10
  timeout: right
  conditions: { pieces_none: [launch_on_warning, hardened_nc3] }
  tags: [nuclear, warning, intel, misperception]
  note: "No doctrine, no hardened system. Waiting costs military and public. Timeout puts the bombers up, the worse side."
  text: >-
    I cannot tell you they are real and I cannot tell you they are not. The second
    radar chain reaches the polar sector in four minutes, which the General's staff
    are calling four minutes we do not have. We assess, low confidence, that eleven
    vehicles is more than their northern range has ever put up in one salvo. Low
    confidence is the honest number.
  left:
    text: "Wait for the second chain"
    effects: { military: -16, public: -12, intel: 10, escalation: 6 }
    tags: [stall, intel, investigate, nuclear]
    set: [fp:intercept_false_alarm_caught]
    clear: [false_alarm_live]
    follow:
      - { card: fp_intercept_fa_06_the_sirens, in: 0 }
      - { card: fp_intercept_fa_04_the_tape, in: 0 }
  right:
    text: "Top state. Bombers up. Then wait."
    effects: { escalation: 22, military: 12, trust_primary: -16, public: -6 }
    tags: [mobilise, military, escalatory, nuclear]
    set: [fp:intercept_false_alarm_caught]
    clear: [false_alarm_live]
    follow:
      - { card: fp_intercept_fa_06_the_sirens, in: 0 }
      - { card: fp_intercept_fa_04_the_tape, in: 0 }

- id: fp_intercept_fa_04_the_tape
  flashpoint: fp_intercept
  advisor: scientist
  acts: [1, 5]
  conditions: { pieces_none: [civil_defence] }
  tags: [nuclear, intel, misperception, warning]
  note: "Terminal, false alarm caught. What the board saw."
  text: >-
    There were no vehicles. At 04:11 a maintenance load put last month's exercise
    tape onto the live correlator, and the constellation's processor, which trusts
    the correlator, found plumes to match nine of them. Eleven tracks, nine plumes,
    nineteen minutes, all of it arithmetic. It will do it again unless the correlator
    comes off the network, and that is a week with one eye.
  left:
    text: "Take it off. One eye for a week."
    effects: { military: -14, intel: 12, escalation: -14 }
    tags: [investigate, intel, deescalate, warning]
    set: [fp:intercept_false_alarm_caught]
    clear: [false_alarm_live]
  right:
    text: "Keep it up. Nobody loads anything."
    effects: { intel: -10, escalation: -8, military: 6, public: -8 }
    tags: [stall, military, warning]
    set: [fp:intercept_false_alarm_caught]
    clear: [false_alarm_live]

- id: fp_intercept_fa_05_three_keys
  flashpoint: fp_intercept
  advisor: watch_officer
  acts: [1, 5]
  conditions: { pieces_any: [hardened_nc3], pieces_none: [launch_on_warning] }
  tags: [nuclear, warning, intel, misperception]
  note: "Complicates Hardened NC3. Three concurrences before the board is believed, and the third key is in a lift."
  text: >-
    Three concurrences before the board is believed; that is what the hardened system
    buys you. The northern bunker concurs. The constellation controller does not,
    because she has nine plumes and the radars have eleven. The third key is the
    deputy chief, and he is in a lift between the fourth floor and the bunker, out of
    contact for the next two minutes.
  left:
    text: "Wait for the lift"
    effects: { military: -14, public: -10, intel: 8 }
    tags: [stall, intel, nuclear]
    set: [fp:intercept_false_alarm_caught]
    clear: [false_alarm_live]
    follow:
      - { card: fp_intercept_fa_06_the_sirens, in: 0 }
      - { card: fp_intercept_fa_04_the_tape, in: 0 }
  right:
    text: "Override the third key"
    effects: { escalation: 18, military: 8, commitment: 10, trust_primary: -10 }
    tags: [military, nuclear, escalatory, secrecy]
    set: [fp:intercept_false_alarm_caught]
    clear: [false_alarm_live]
    follow:
      - { card: fp_intercept_fa_06_the_sirens, in: 0 }
      - { card: fp_intercept_fa_04_the_tape, in: 0 }

- id: fp_intercept_fa_06_the_sirens
  flashpoint: fp_intercept
  advisor: aide
  acts: [1, 5]
  conditions: { pieces_any: [civil_defence] }
  tags: [nuclear, domestic, misperception, warning]
  note: "Terminal, false alarm caught. Complicates Civil Defence, which worked, loudly."
  text: >-
    The sirens went at 04:14 in {capital} and six cities, because the programme says
    they go at that alert state and the alert state was reached. Two hundred thousand
    people are under schools and car parks. The board is clear and the scientist says
    it was a tape. I have a statement that says the system worked. It is true, and
    nobody in a shelter will hear it that way.
  left:
    text: "Tell them it was a drill"
    effects: { public: 10, allies: -8, trust_primary: -8, escalation: -6, commitment: 6 }
    tags: [secrecy, domestic, nuclear]
    set: [fp:intercept_false_alarm_caught]
    clear: [false_alarm_live]
  right:
    text: "Tell them the truth. A tape."
    effects: { public: -16, escalation: -12, trust_primary: 8, allies: 6 }
    tags: [transparency, domestic, nuclear, deescalate]
    set: [fp:intercept_false_alarm_caught]
    clear: [false_alarm_live]
