# ---------------------------------------------------------------- resolutions
- id: falarm_24_the_pattern
  arc: false_alarm
  advisor: intel_director
  acts: [3, 5]
  weight: 1.5
  tags: [intel, nuclear, misperception]
  conditions: { flags_all: [false_alarm:reported] }
  note: Branch card. Leads to the two resolutions.
  text: >-
    The number of ghosts this month is outside anything in our records. We assess
    two hypotheses with roughly equal weight: a system that is failing, or a system
    that is being taught to be ignored. The first is embarrassing and the second is
    a preparation. I cannot tell you which, and I would rather say that than pick.
  left:
    text: "It is failing. Audit everything."
    effects: { military: -6, intel: 6, escalation: -3, economy: -3 }
    tags: [investigate, intel, deescalate]
    set: [false_alarm:investigated]
    clear: [false_alarm_live]
    follow: [{ card: falarm_25_post_mortem, in: 2 }]
  right:
    text: "It is a preparation. Harden the posture."
    effects: { military: 6, escalation: 7, trust_primary: -8, public: 2 }
    tags: [military, deterrence, nuclear, escalatory]
    set: [false_alarm:acted]
    follow: [{ card: falarm_26_the_call, in: 2 }]

- id: falarm_25_post_mortem
  arc: false_alarm
  advisor: scientist
  acts: [1, 5]
  tags: [intel, nuclear, transparency]
  note: Resolution, stood down. The fault was ours.
  text: >-
    The audit is done and the fault was ours: three fixes, each applied to cure
    the last ghost, each the cause of the next. Nobody sabotaged anything; we did
    this to ourselves with good intentions and a maintenance schedule. I have
    written it up in eleven pages that anyone could follow. Whether anyone outside
    this building gets to follow them is your decision, not mine.
  left:
    text: "Publish the eleven pages"
    effects: { public: -8, allies: 6, trust_primary: 10, intel: 6, military: -4 }
    tags: [transparency, reassurance, nuclear]
    set: [false_alarm:stood_down]
  right:
    text: "Classify them"
    effects: { public: 4, military: 5, trust_primary: -6, intel: -4, commitment: 3 }
    tags: [secrecy, nuclear]

- id: falarm_26_the_call
  arc: false_alarm
  advisor: hotline
  acts: [1, 5]
  tags: [nuclear, diplomacy, misperception]
  note: Resolution, acted. The rival has noticed the bombers.
  text: >-
    "{Rival_leader} wishes to understand why {us} has twice this month moved
    bombers to the runway without notice, and whether {leader} is aware of it."
    The pause after aware is long enough to count in. "He asks this as a courtesy,
    before other people ask it in other ways." The translator's voice does not
    change; his breathing does.
  left:
    text: "Tell him about the ghosts"
    effects: { trust_primary: 12, escalation: -8, public: -5, military: -6, intel: -3 }
    tags: [transparency, deescalate, diplomacy, nuclear]
    spend_charge: deescalation
    set: [false_alarm:stood_down]
  right:
    text: "Readiness is not his business"
    effects: { trust_primary: -10, escalation: 8, commitment: 6, military: 4 }
    tags: [secrecy, deterrence, nuclear]
    set: [false_alarm:acted]
    odds:
      label: He lets it go
      base: 0.4
      tags: [adversary, diplomacy]
      success:
        text: "A long pause, and then the formal closing. The line goes quiet in a way that is not the same as calm."
        effects: { escalation: -3 }
      failure:
        text: "\"Then {rival} will draw its own conclusions.\" Their bombers are on the runway by dawn."
        effects: { escalation: 8, military: 3, trust_primary: -5, allies: -4 }
