- id: ultimatum_25_the_formula
  arc: ultimatum
  advisor: dove_fm
  acts: [2, 5]
  weight: 1.3
  chained: false
  tags: [diplomacy, commitment_trap]
  conditions:
    flags_any: [ultimatum:called_bluff, ultimatum:met]
    flags_none: [ultimatum:backed_down]
  note: Resolution after they blink. Two announcements six hours apart, and a door.
  text: >-
    They have lost and they know it, and the only question left is whether
    they are allowed to leave the room by a door. The formula on the table is
    two unrelated announcements six hours apart: their column home for
    'seasonal maintenance', our battalion off the ridge for 'rotation'. Nobody
    will believe either. Everybody will accept both, which is the most a
    formula can do.
  left:
    text: "Two announcements. Six hours"
    effects: { escalation: -14, trust_primary: 10, public: -7, military: -6, commitment: -6, allies: -2 }
    tags: [deescalate, diplomacy, reassurance, walk_back]
  right:
    text: "No door. They lost. Say so"
    effects: { public: 8, commitment: 6, trust_primary: -12, escalation: 6, allies: -3 }
    tags: [public_commitment, deterrence, domestic]

- id: ultimatum_26_the_ledger
  arc: ultimatum
  advisor: opposition
  acts: [2, 5]
  weight: 1.3
  chained: false
  tags: [domestic, commitment_trap]
  conditions:
    flags_all: [ultimatum:backed_down]
  note: Resolution after we back down. He has both statements and a price for mislaying one.
  text: >-
    I have the statement from the fourth and the statement from this morning,
    and I have read them side by side, which is what I am for. I can read them
    together on the floor at three, and I will win the afternoon and you will
    lose it, and by Friday {rival_capital} will have learned that your word
    lasts nine days. Or you can give me a seat in the room where the next one
    is written, and I can find that I have mislaid one of the statements.
  left:
    text: "Read them. Do your worst"
    effects: { public: -10, commitment: 2, allies: -2, trust_primary: -2 }
    tags: [domestic, transparency]
  right:
    text: "A seat in the room"
    effects: { public: 4, military: -4, intel: -3, commitment: -3 }
    tags: [domestic, concede]
