- id: ultimatum_20_the_half_life
  arc: ultimatum
  advisor: spin_doctor
  acts: [2, 5]
  tags: [commitment_trap, domestic]
  conditions:
    flags_any: [ultimatum:received, ultimatum:issued]
    flags_none: [ultimatum:backed_down, ultimatum:deadline_passed]
    pieces_any: [spin_doctor]
  note: Spin Doctor, the bill. He sold the word too well and now it polls at seventy-one.
  text: >-
    I sold 'never' to every front page in the country and I did it well, which
    is the problem, because it polled at seventy-one this morning and you
    cannot quietly buy a word back from seventy-one. If you want out of it,
    you need me to start breaking it now, in pieces, in briefings nobody
    reads. If you want to keep it, you need to mean it by Friday.
  left:
    text: "Start breaking it"
    effects: { commitment: -6, public: -5, military: -3, trust_primary: 3 }
    tags: [walk_back, secrecy, domestic]
  right:
    text: "Keep it. Mean it"
    effects: { commitment: 8, public: 3, escalation: 4, trust_primary: -3 }
    tags: [public_commitment, deterrence, domestic]

- id: ultimatum_21_the_open_line
  arc: ultimatum
  advisor: hotline
  acts: [2, 5]
  weight: 1.2
  tags: [diplomacy, commitment_trap, deescalate]
  conditions:
    flags_any: [ultimatum:received, ultimatum:issued]
    flags_none: [ultimatum:deadline_passed, ultimatum:backed_down]
    pieces_any: [hotline_protocol]
  note: Hotline Protocol, the gift. The call costs nothing at home; the freeze still costs.
  text: >-
    '{Rival_leader} will take a call at 22:00 tonight, with no agenda and no
    readout.' Fourteen seconds. 'He asks that the call be private on both
    sides.' The line stays open after the message ends, which it has never
    done before, and you can hear a clock in the room in {rival_capital}.
  left:
    text: "Take the call. Offer a freeze"
    effects: { escalation: -9, trust_primary: 8, military: -5, public: -4, commitment: -5 }
    tags: [deescalate, diplomacy, back_channel]
    spend_charge: deescalation
  right:
    text: "Not while the deadline stands"
    effects: { commitment: 5, escalation: 4, trust_primary: -6, military: 2 }
    tags: [deterrence, stall]

- id: ultimatum_22_three_calls
  arc: ultimatum
  advisor: hotline
  acts: [2, 5]
  timer: 9
  timeout: right
  tags: [diplomacy, misperception, commitment_trap]
  conditions:
    flags_any: [ultimatum:received, ultimatum:issued]
    flags_none: [ultimatum:deadline_passed]
    pieces_any: [hotline_protocol]
  note: Hotline Protocol, the bill. The line is free at home and is being counted abroad. Timeout closes it, the worse side.
  text: >-
    '{Rival} notes that {us} has used the direct line three times this week
    and asks whether {leader} has something to say that has not yet been
    said.' The translator's voice does not change. Somewhere behind it a
    second voice says something short, and it is not translated. The line is
    still open.
  left:
    text: "Say it. Propose a mutual pause"
    effects: { escalation: -6, trust_primary: 4, public: -5, military: -4, commitment: -6 }
    tags: [deescalate, diplomacy, walk_back]
    odds:
      label: They take it
      base: 0.55
      tags: [adversary, diplomacy]
      success:
        text: "'Noted.' Then, four minutes later: 'Agreed in principle.' Nobody in either room said what the principle was."
        effects: { escalation: -6, trust_primary: 5 }
      failure:
        text: "'Noted.' The line closed. On the ridge their guns registered twice more before dark."
        effects: { escalation: 5, trust_primary: -4, public: -3 }
  right:
    text: "Nothing to add. Close the line"
    effects: { trust_primary: -6, escalation: 4, commitment: 3, public: 2 }
    tags: [deterrence, secrecy]

# ---------------------------------------------------------------- developments (open)

- id: ultimatum_23_what_they_see
  arc: ultimatum
  advisor: dove_fm
  acts: [2, 5]
  tags: [misperception, diplomacy, commitment_trap]
  conditions:
    flags_all: [ultimatum:issued]
    flags_any: [blockade:declared, proxy:escalated]
    flags_none: [ultimatum:deadline_passed, ultimatum:backed_down]
  note: Cross-hook. Our deadline about a column is being read as a deadline about them.
  text: >-
    Put the deadline beside everything else this month and read it from
    {rival_capital}. There it is not a deadline about one column, it is the
    last step before the thing they have been told for a year we are planning,
    and men who believe that do not withdraw a column, they reinforce it. I am
    not saying they are right. I am saying the deadline we wrote about a
    crossing is being read as a deadline about them.
  left:
    text: "Widen it. Offer a package"
    effects: { escalation: -6, trust_primary: 6, commitment: -5, public: -4, military: -4 }
    tags: [deescalate, diplomacy, walk_back]
  right:
    text: "One column, one deadline. Hold"
    effects: { commitment: 5, escalation: 5, trust_primary: -5, military: 2, public: 2 }
    tags: [deterrence, public_commitment, stall]

- id: ultimatum_24_the_operations_room
  arc: ultimatum
  advisor: aide
  acts: [2, 5]
  tags: [domestic, misperception, personal]
  conditions:
    flags_any: [ultimatum:received, ultimatum:issued]
    flags_none: [ultimatum:deadline_passed, ultimatum:backed_down]
  note: Where you are at midnight is a signal, and two people have read it differently.
  text: >-
    The deadline is at 03:00 our time. The General has asked that you be in the
    operations room from midnight, and the Foreign Minister has asked that you
    not be, because the cameras outside know what the lights mean and so does
