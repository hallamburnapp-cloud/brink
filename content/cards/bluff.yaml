# BLUFF CALLED — played first in a flashpoint when the act's leverage target was missed.
# Generic across flashpoints (bluff: true); each has two punishing choices.

- id: bluff_01_the_shrug
  advisor: hotline
  bluff: true
  weight: 1
  tags: [commitment_trap, diplomacy]
  timer: 10
  timeout: right
  text: >-
    "{Rival_leader} has read your statements of the past week and finds nothing that
    requires a response." Then hold music, because they have seen your hand and
    think it is empty.
  left:
    text: "Back down in public"
    effects: { public: -8, allies: -6, commitment: -15, trust_primary: 4 }
    tags: [concede, walk_back]
    base: 6
  right:
    text: "Make it true. Mobilise."
    effects: { escalation: 11, military: 4, economy: -4 }
    tags: [mobilise, military, escalatory]
    base: 22
    odds:
      label: They believe it
      base: 0.45
      tags: [adversary, military]
      success: { effects: { public: 4, trust_primary: -8 }, capital: 1 }
      failure: { effects: { escalation: 6, allies: -4, public: -4 } }

- id: bluff_02_the_editorial
  advisor: press
  bluff: true
  weight: 1
  tags: [domestic, commitment_trap]
  text: >-
    Tomorrow's front page is a photo of you from the week you sounded strong, under
    a headline asking where that person went. {Rival} has already quoted it, so
    you will be answering?
  left:
    text: "Let it run. Take the hit."
    effects: { public: -10, military: -4, commitment: -10 }
    tags: [concede, domestic]
    base: 6
  right:
    text: "Give them a bigger story tonight"
    effects: { escalation: 10, public: 3, trust_primary: -8, economy: -3 }
    tags: [public_commitment, escalatory, domestic]
    base: 20
    odds:
      label: It lands
      base: 0.5
      tags: [adversary]
      success: { effects: { public: 6, commitment: 10 } }
      failure: { effects: { escalation: 4, public: -6, allies: -4 } }

- id: bluff_03_the_ally
  advisor: ally_leader
  bluff: true
  weight: 1
  tags: [alliance, commitment_trap]
  text: >-
    "Last week I defended you in my parliament on what you said you would do, and
    tonight I tell them what you did." She does not raise her voice, and she wants
    one line to read out.
  left:
    text: "Tell her the truth. A bluff."
    effects: { allies: -10, public: -4, trust_primary: 3, commitment: -12 }
    tags: [concede, alliance, transparency]
    base: 6
  right:
    text: "Give her something real. Deploy."
    effects: { escalation: 11, allies: 4, military: 3, economy: -5 }
    tags: [mobilise, alliance, escalatory]
    base: 22
    odds:
      label: The alliance holds
      base: 0.55
      tags: [alliance]
      success: { effects: { allies: 6, trust_secondary: -5 }, capital: 1 }
      failure: { effects: { allies: -7, escalation: 4 } }

- id: bluff_04_the_markets
  advisor: treasury
  bluff: true
  weight: 1
  tags: [economy, commitment_trap]
  text: >-
    The currency is down four percent because the markets, like {rival}, have
    decided you will not do what you said. I can burn the reserve holding it up,
    or you can surprise everyone.
  left:
    text: "Burn the reserve. Hold it up."
    effects: { economy: -11, public: -4, commitment: -8 }
    tags: [economy, concede]
    base: 7
  right:
    text: "Do something they did not price in"
    effects: { escalation: 10, economy: 3, trust_primary: -9, allies: -3 }
    tags: [escalatory, sanction, economy]
    base: 20
    odds:
      label: Markets turn
      base: 0.5
      tags: [adversary]
      success: { effects: { economy: 7, public: 4 } }
      failure: { effects: { economy: -6, escalation: 4 } }

- id: bluff_05_the_staff
  advisor: hawk_general
  bluff: true
  weight: 1
  tags: [military, commitment_trap]
  timer: 9
  timeout: right
  text: >-
    Their generals have stood down from the alert I was told we would answer, and
    my staff read the same cables. I need to tell my commanders tonight whether we
    were ever serious.
  left:
    text: "We were not. Stand them down."
    effects: { military: -10, public: -4, escalation: -3, commitment: -10 }
    tags: [deescalate, concede]
    base: 6
  right:
    text: "We were. Prove it."
    effects: { escalation: 13, military: 6, trust_primary: -10, economy: -4 }
    tags: [strike, military, escalatory]
    base: 24
    odds:
      label: They flinch
      base: 0.4
      tags: [adversary, military]
      success: { effects: { public: 6, allies: 3 }, capital: 2 }
      failure: { effects: { escalation: 7, allies: -6 } }

- id: bluff_06_the_envoy
  advisor: envoy
  bluff: true
  weight: 1
  tags: [diplomacy, commitment_trap]
  text: >-
    "Everyone in the chamber has noticed that your words and your actions live in
    different buildings." She offers a climbdown dressed as a summit, or a summit
    dressed as a climbdown.
  left:
    text: "Climb down. Call it a summit."
    effects: { public: -6, allies: -4, escalation: -4, trust_primary: 5, commitment: -12 }
    tags: [deescalate, concede, diplomacy]
    base: 8
  right:
    text: "Take the summit. Hold the line."
    effects: { escalation: 7, public: 3, trust_primary: -6, allies: 2 }
    tags: [public_commitment, diplomacy]
    base: 18
    odds:
      label: They show up
      base: 0.5
      tags: [adversary, diplomacy]
      success: { effects: { escalation: -6, trust_primary: 6 }, capital: 1 }
      failure: { effects: { escalation: 6, public: -6 } }
