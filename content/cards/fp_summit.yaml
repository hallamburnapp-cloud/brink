# fp_summit — THE SUMMIT. The meeting itself, at the Assembly's house on the
# lake at Vellmar: arrival optics, the private session, the communiqué.
# Acts 3–5; the game's most common Endgame flashpoint.
#
# Shape: one unconditioned entry (the two doors) → an optional arrival layer
# (hawk_general / contractor / peace_leader, or a cross-arc "folder of the
# month" hook for players holding none of them; mutually exclusive by
# pieces_none, no follows of their own: the queue carries the next spine card)
# → the private session (rival_leader, timer) → an optional drafting layer
# (no_first_use / dove_fm / ambassador / back_channel) → the last sentence or
# the third chair → terminals. The engine forces `in: 0` inside a flashpoint.
#
# Forces: reassurance against looking weak at home (public vs trust), the
# back channel and the Ambassador (rolls tagged back_channel / diplomacy), No
# First Use and the Dove making the other side believe you, the General and the
# contractor undermining, the Peace Movement across the lake, the Secretary
# hosting and taking the blame.
#
# Escalation on the good path falls about 20 without pieces and about 28 with
# a drafting-layer piece, so a stand-down (≤ 35 at run end) is reachable but not
# automatic. No forced endings.
#
# Outcomes (terminals set exactly one): fp:summit_communique,
# fp:summit_collapsed, fp:summit_walkout.
#
# Cross-arc hooks (flags_any on the folder card): ultimatum:deadline_passed,
# fp:midnight_passed, fp:midnight_called_bluff, blockade:shots_fired,
# proxy:escalated, cables:retaliated, blackout:retaliated.

# ---------------------------------------------------------------- entry

- id: fp_summit_01_the_lake_door
  flashpoint: fp_summit
  advisor: envoy
  acts: [3, 5]
  tags: [diplomacy, alliance, domestic]
  note: Entry, no conditions. Whoever is seen waiting wanted it more. Both follow lists run the arrival layer, then the private session.
  text: >-
    His plane lands in twenty minutes and yours already has, so you wanted this
    more, and a hundred and forty cameras out front know it. He asked about the
    lake door, which has none.
  left:
    text: "Wait for him out front, both flags"
    effects: { public: -4, trust_primary: 8, escalation: -1, military: -3 }
    tags: [reassurance, diplomacy]
    follow:
      - { card: fp_summit_02_the_photographs, in: 0 }
      - { card: fp_summit_03_flatbeds, in: 0 }
      - { card: fp_summit_04_candles, in: 0 }
      - { card: fp_summit_05_the_folder, in: 0 }
      - { card: fp_summit_06_not_a_knife, in: 0 }
  right:
    text: "Take the lake door. Let him wait"
    effects: { public: 3, trust_primary: -8, escalation: 1, commitment: 6 }
    tags: [deterrence, secrecy, domestic]
    follow:
      - { card: fp_summit_02_the_photographs, in: 0 }
      - { card: fp_summit_03_flatbeds, in: 0 }
      - { card: fp_summit_04_candles, in: 0 }
      - { card: fp_summit_05_the_folder, in: 0 }
      - { card: fp_summit_06_not_a_knife, in: 0 }

# ---------------------------------------------------------------- arrival layer (one of four, no follows: the queue carries on)

- id: fp_summit_02_the_photographs
  flashpoint: fp_summit
  advisor: hawk_general
  acts: [3, 5]
  conditions: { pieces_any: [hawk_general] }
  tags: [military, deterrence, misperception]
  note: The General undermines. The folder says what a month of statements has not, and burns the source that took it.
  text: >-
    Forty photographs of their column at the Sallow crossing, taken at five
    today from a height they think we lack. Face down by your hand, they say
    what a month of talk has not.
  left:
    text: "Put the folder on the table"
    effects: { military: 4, trust_primary: -12, escalation: 3, public: 2, intel: -6 }
    tags: [deterrence, military, misperception]
  right:
    text: "Leave it in the car"
    effects: { military: -4, trust_primary: 6, escalation: -2, commitment: -4 }
    tags: [reassurance, stall, diplomacy]

- id: fp_summit_03_flatbeds
  flashpoint: fp_summit
  advisor: press
  acts: [3, 5]
  conditions: { pieces_any: [contractor], pieces_none: [hawk_general] }
  tags: [misperception, military, domestic]
  note: The contractor undermines, helpfully. His delivery schedule is their headline on the morning of the handshake.
  text: >-
    Their press office has your new missile batteries on trucks at the airbase
    this morning, and your arms dealer confirmed the dates to me an hour ago.
    Live at one: what are they for?
  left:
    text: "Say 'defensive' once, then nothing"
    effects: { public: 2, military: 3, trust_primary: -12, escalation: 3, intel: -2 }
    tags: [secrecy, misperception, deterrence]
  right:
    text: "Halt the deliveries for the week"
    effects: { military: -5, economy: -4, trust_primary: 10, escalation: -2, allies: -2 }
    tags: [reassurance, deescalate, economy]

- id: fp_summit_04_candles
  flashpoint: fp_summit
  advisor: family
  acts: [3, 5]
  conditions: { pieces_any: [peace_leader], pieces_none: [hawk_general, contractor] }
  tags: [domestic, personal, deescalate]
  note: The Peace Movement across the lake. Going down to the shore reads as sincerity to him and as a leader who answers to a crowd to Varga.
  text: >-
    Candles all round the lake, sixty thousand by the police count, and a woman
    with a loudhailer calling your first name. I am going down to the shore
    whether you come or not.
  left:
    text: "Come down with me. Ten minutes"
    effects: { public: 5, military: -4, trust_primary: 6, allies: -3, commitment: 4 }
    tags: [domestic, reassurance, deescalate, personal]
  right:
    text: "Close the curtains. Not tonight"
    effects: { public: -5, military: 2, trust_primary: -4, escalation: 1 }
    tags: [domestic, deterrence, personal, secrecy]

- id: fp_summit_05_the_folder
  flashpoint: fp_summit
  advisor: ambassador
  acts: [3, 5]
  conditions:
    pieces_none: [hawk_general, contractor, peace_leader]
    flags_any: [ultimatum:deadline_passed, fp:midnight_passed, fp:midnight_called_bluff, blockade:shots_fired, proxy:escalated, cables:retaliated, blackout:retaliated]
  tags: [diplomacy, misperception, back_channel]
  note: Cross-arc hook for players holding none of the arrival pieces. The month has been bound and brought to the table.
  text: >-
    Their folder is on the table: every shot this month, every deadline, with
    dates. I know their deputy and can ask him to keep it shut, and he will ask
    what we keep shut in return.
  left:
    text: "Ask him. Offer the same"
    effects: { trust_primary: 10, public: -3, commitment: -6, intel: -2 }
    tags: [back_channel, diplomacy, reassurance]
    odds:
      label: It stays shut
      base: 0.55
      tags: [back_channel, diplomacy]
      success:
        text: "The folder stays on the table, shut, for six hours, and both delegations look at it more than at each other."
        effects: { escalation: -4, trust_primary: 4 }
      failure:
        text: "He opens it anyway, at the second item, and reads for fifty minutes. Your side has brought its own, and out it comes."
        effects: { escalation: 4, trust_primary: -6, public: 2 }
  right:
    text: "Let him read. We have a folder too"
    effects: { public: 3, military: 2, trust_primary: -8, escalation: 3, allies: -1 }
    tags: [deterrence, domestic, misperception]

# ---------------------------------------------------------------- the private session (timer)

- id: fp_summit_06_not_a_knife
  flashpoint: fp_summit
  advisor: rival_leader
  acts: [3, 5]
  timer: 10
  timeout: right
  tags: [diplomacy, personal, misperception]
  note: The room. Left reassures and leads to the last sentence; right holds and leads to the third chair. Both run the drafting layer first. Timeout refuses him, the worse side.
  text: >-
    'My people have been told for a year that your battalion on the ridge is a
    knife at their door, so give me something to take home that is not a knife.'
    He has forty minutes.
  left:
    text: "Our men leave when his column does"
    effects: { trust_primary: 14, commitment: 8, military: -5, public: -3, escalation: -2 }
    tags: [reassurance, transparency, diplomacy]
    follow:
      - { card: fp_summit_07_in_writing, in: 0 }
      - { card: fp_summit_08_her_paragraph, in: 0 }
      - { card: fp_summit_09_the_lake_steps, in: 0 }
      - { card: fp_summit_10_four_lines, in: 0 }
      - { card: fp_summit_11_both_sides, in: 0 }
  right:
    text: "Refuse. The ridge is not on offer"
    effects: { trust_primary: -10, military: 4, public: 3, escalation: 3, commitment: 6 }
    tags: [deterrence, stall, commitment_trap]
    follow:
      - { card: fp_summit_07_in_writing, in: 0 }
      - { card: fp_summit_08_her_paragraph, in: 0 }
      - { card: fp_summit_09_the_lake_steps, in: 0 }
      - { card: fp_summit_10_four_lines, in: 0 }
      - { card: fp_summit_12_the_third_chair, in: 0 }

# ---------------------------------------------------------------- drafting layer (one of four, no follows: the queue carries on)

- id: fp_summit_07_in_writing
  flashpoint: fp_summit
  advisor: hawk_general
  acts: [3, 5]
  conditions: { pieces_any: [no_first_use] }
  tags: [nuclear, military, misperception]
  note: No First Use, gift and bill. They believe it, so they want it in writing, and writing costs the alliance and the officers.
  text: >-
    Their drafters want your promise never to fire first written into the
    paper and signed by both sides. In writing, it is a target list they no
    longer have to guess at.
  left:
    text: "Write it in. Both signatures"
    effects: { trust_primary: 12, military: -5, allies: -4, escalation: -4, commitment: 6 }
    tags: [reassurance, nuclear, public_commitment, deescalate]
  right:
    text: "Keep our promise ours alone"
    effects: { trust_primary: -6, military: 2, allies: 2, escalation: 1, commitment: -2 }
    tags: [deterrence, nuclear, stall]

- id: fp_summit_08_her_paragraph
  flashpoint: fp_summit
  advisor: dove_fm
  acts: [3, 5]
  conditions: { pieces_any: [dove_fm], pieces_none: [no_first_use] }
  tags: [diplomacy, reassurance, domestic]
  note: The Dove, gift and bill. They will believe her paragraph because it is hers, and tomorrow someone will ask whose signature that was.
  text: >-
    I have sat in their drafting room since two, and I have a paragraph they
    will sign because I wrote it. Tomorrow {rival_capital} will ask whether
    {leader} signed it or I did.
  left:
    text: "Sign her paragraph as it is"
    effects: { trust_primary: 12, military: -5, escalation: -4, allies: -2, public: -2 }
    tags: [reassurance, diplomacy, deescalate]
  right:
    text: "Rewrite it in my words, tonight"
    effects: { trust_primary: -4, military: 2, public: 2, escalation: 1, commitment: 4, intel: -2 }
    tags: [stall, deterrence, domestic]

- id: fp_summit_09_the_lake_steps
  flashpoint: fp_summit
  advisor: ambassador
  acts: [3, 5]
  conditions: { pieces_any: [ambassador], pieces_none: [no_first_use, dove_fm] }
  tags: [back_channel, diplomacy, misperception]
  note: The Ambassador, gift and bill. The anecdote is either the key to the room or the deputy's own shopping list.
  text: >-
    Over a cigarette, their deputy says his man needs a sentence: ships in the
    Straits to be 'notified'. Last crisis a deputy told me this and it was true;
    the one before, it was not.
  left:
    text: "Give him the sentence"
    effects: { trust_primary: 8, commitment: 4, allies: -2, military: -2 }
    tags: [back_channel, diplomacy, reassurance]
    odds:
      label: He was right
      base: 0.6
      tags: [back_channel, diplomacy]
      success:
        text: "It is what his man needed. The Straits sentence goes in at four, and the ridge is not mentioned again until the cars."
        effects: { trust_primary: 8, escalation: -4, public: -2 }
      failure:
        text: "It is what the deputy needed. His man reads the sentence and asks what else there is, and now there is a list."
        effects: { trust_primary: -6, allies: -3, escalation: 2, intel: -4 }
  right:
    text: "Refuse. A cigarette is not a deal"
    effects: { trust_primary: -6, intel: -4, public: 2, military: 2 }
    tags: [deterrence, stall, secrecy]

- id: fp_summit_10_four_lines
  flashpoint: fp_summit
  advisor: aide
  acts: [3, 5]
  conditions: { pieces_any: [back_channel], pieces_none: [no_first_use, dove_fm, ambassador] }
  tags: [back_channel, secrecy, diplomacy]
  note: The Back-Channel, gift and bill. A handwritten price for a signature, and two journalists who already know the restaurant.
  text: >-
    Four handwritten lines: they sign tonight if 'withdrawal' is nowhere in the
    paper and 'lunch' nowhere afterwards, ever. Two journalists out front
    already know the restaurant.
  left:
    text: "Honour it. Strike 'withdrawal'"
    effects: { trust_primary: 8, allies: -3, public: -3, commitment: -6 }
    tags: [back_channel, secrecy, concede]
    odds:
      label: Lunch stays secret
      base: 0.55
      tags: [back_channel]
      success:
        text: "The word does not appear, and neither does the restaurant. The paper is initialled at five."
        effects: { trust_primary: 6, escalation: -4 }
      failure:
        text: "The word does not appear. The restaurant does, on the front page in {rival_capital}, and their delegation spends the evening explaining why it ate with ours."
        effects: { trust_primary: -8, escalation: 2, public: -2 }
  right:
    text: "Burn the note. Write what is true"
    effects: { trust_primary: -8, public: 2, intel: -4, allies: 2, commitment: 4 }
    tags: [transparency, deterrence]

# ---------------------------------------------------------------- the paper

- id: fp_summit_11_both_sides
  flashpoint: fp_summit
  advisor: dove_fm
  acts: [3, 5]
  tags: [diplomacy, reassurance, domestic]
  note: After reassurance in the room. One word in the last sentence. Signing costs the floor at home; striking it rolls on whether he signs anyway.
  text: >-
    Four in the morning, and the paper is agreed but for one word: 'regrettable
    on both sides'. Strike 'both' and he cannot sign; keep it and the Opposition
    calls it a confession.
  left:
    text: "Sign it. Both sides"
    effects: { escalation: -6, trust_primary: 12, public: -5, allies: -2, commitment: -6 }
    tags: [diplomacy, concede, deescalate]
    follow: [{ card: fp_summit_13_witness, in: 0 }]
  right:
    text: "Strike 'both'. Let him decide"
    effects: { public: 3, commitment: 6, trust_primary: -6, military: 1 }
    tags: [deterrence, public_commitment, stall]
    odds:
      label: He signs anyway
      base: 0.5
      tags: [adversary, diplomacy]
      success:
        text: "He signs at 05:10, without the word, and tells his press it was his idea to leave it out."
        effects: { escalation: -4, trust_primary: -2, public: 2 }
        follow: [{ card: fp_summit_13_witness, in: 0 }]
      failure:
        text: "He does not sign. At 05:20 his delegation asks for their cars, then asks for them to wait, and they are still waiting."
        effects: { escalation: 3, trust_primary: -6, public: -2 }
        follow: [{ card: fp_summit_14_the_cars, in: 0 }]

- id: fp_summit_12_the_third_chair
  flashpoint: fp_summit
  advisor: other_leader
  acts: [3, 5]
  tags: [diplomacy, misperception, alliance]
  note: After the deadlock in the room. Help that helps the helper. His paper or none, and the roll is on the secondary power.
  text: >-
    'You spent four hours on what is not on the table; I spent them writing down
    what is. My paper thanks {other} first, skips the ridge, and is the only
    paper there will be tonight.'
  left:
    text: "Take his paper"
    effects: { trust_secondary: 10, allies: -4, public: -3, commitment: -4 }
    tags: [diplomacy, concede, alliance]
    odds:
      label: He delivers
      base: 0.55
      tags: [secondary, diplomacy]
      success:
        text: "He delivers. Three signatures at six, his in the middle, and a photograph in which he is the only one smiling."
        effects: { escalation: -5, trust_primary: 6, trust_secondary: 6 }
        follow: [{ card: fp_summit_13_witness, in: 0 }]
      failure:
        text: "{Rival_leader} reads the first paragraph and puts the pen down. 'I did not fly here to thank {other_capital}.'"
        effects: { trust_secondary: -8, escalation: 2, public: -2 }
        follow: [{ card: fp_summit_14_the_cars, in: 0 }]
  right:
    text: "Refuse his paper. Ours or none"
    effects: { trust_secondary: -12, allies: 2, public: 2, escalation: 2, commitment: 6 }
    tags: [deterrence, public_commitment, alliance]
    follow: [{ card: fp_summit_14_the_cars, in: 0 }]

# ---------------------------------------------------------------- terminals

- id: fp_summit_13_witness
  flashpoint: fp_summit
  advisor: envoy
  acts: [3, 5]
  tags: [diplomacy, alliance, domestic]
  note: Terminal, communiqué. Whose paper it was, on the steps.
  text: >-
    It is signed, my name at the bottom as witness, so by tomorrow whatever you
    regret will have been the Assembly's idea. Say so on the steps and go home
    lighter, or own every line.
  left:
    text: "Own every line. On the steps"
    effects: { public: -4, trust_primary: 10, commitment: 10, escalation: -4, military: -2 }
    tags: [public_commitment, reassurance, transparency]
    set: [fp:summit_communique]
  right:
    text: "Call it the Assembly's paper"
    effects: { public: 3, trust_primary: -4, trust_secondary: -6, allies: -3, escalation: -1 }
    tags: [domestic, stall, diplomacy]
    set: [fp:summit_communique]

- id: fp_summit_14_the_cars
  flashpoint: fp_summit
  advisor: aide
  acts: [3, 5]
  timer: 9
  timeout: right
  tags: [diplomacy, domestic, misperception]
  note: Terminal, no paper. Another night is a collapse; the front door with both flags is a walkout. Timeout is wheels up, the worse side.
  text: >-
    No paper: their cars are at the lake door, engines running, their delegation
    in coats beside them, not quite leaving. Stay the night, or fly at 06:40
    past the cameras.
  left:
    text: "Take the house another night"
    effects: { public: -5, trust_primary: 6, allies: -2, military: -3, escalation: 1 }
    tags: [stall, reassurance, diplomacy]
    set: [fp:summit_collapsed]
  right:
    text: "Fly home. Front door, both flags"
    effects: { public: 4, trust_primary: -14, escalation: 5, allies: -3, commitment: 8 }
    tags: [deterrence, public_commitment, domestic, escalatory]
    set: [fp:summit_walkout]
