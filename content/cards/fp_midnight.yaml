# fp_midnight — MIDNIGHT. The deadline hour of an ultimatum, yours or theirs,
# and the forty minutes on either side of it. Acts 2–5.
#
# Shape: one unconditioned entry (the chair) → three mutually exclusive branch
# cards on the ultimatum arc's flags (theirs / ours / neither) → an optional
# piece layer (red_lines, spin_doctor, strategic_ambiguity, hotline_protocol;
# mutually exclusive by pieces_none, no follows of their own: the queue carries
# the next spine card) → the midnight call (hotline, spend_charge) or the hour
# after (the General, timer) → terminals. The engine forces `in: 0` inside a
# flashpoint; follow lists are ordered, and a queued card whose conditions fail
# is dropped, which is how the branching and the piece layer work.
#
# Forces: the commitment trap (public_commitment / walk_back), the hotline
# (spend_charge: deescalation), "They blink" adversary rolls at 0.4–0.6,
# Strategic Ambiguity's two readings.
#
# Outcomes (terminals set exactly one): fp:midnight_backed_down,
# fp:midnight_called_bluff, fp:midnight_passed. The catastrophic branch forces
# the ending `nuclear_midnight`.
#
# The world: our battalion on Hollin Ridge in Vestria; their column at the
# Sallow crossing in Amberline; the empty depot at Tessel.

# ---------------------------------------------------------------- entry

- id: fp_midnight_01_one_chair
  flashpoint: fp_midnight
  advisor: aide
  acts: [2, 5]
  tags: [commitment_trap, domestic, personal]
  note: Entry, no conditions. Who sits beside you at midnight. Both follow lists branch on the ultimatum flags on the next card.
  text: >-
    Ten past eleven, the deadline is midnight, and there is one chair beside
    yours. The General wants it, so does the Foreign Minister, and whoever gets
    the corridor will remember it.
  left:
    text: "Give the General the chair"
    effects: { military: 6, commitment: 8, escalation: 3, trust_primary: -8 }
    tags: [military, deterrence, commitment_trap]
    follow:
      - { card: fp_midnight_02_their_hour, in: 0 }
      - { card: fp_midnight_03_our_hour, in: 0 }
      - { card: fp_midnight_04_full_readiness, in: 0 }
  right:
    text: "Give the Minister the chair"
    effects: { military: -5, trust_primary: 8, public: -3, allies: -2 }
    tags: [diplomacy, reassurance, personal]
    follow:
      - { card: fp_midnight_02_their_hour, in: 0 }
      - { card: fp_midnight_03_our_hour, in: 0 }
      - { card: fp_midnight_04_full_readiness, in: 0 }

# ---------------------------------------------------------------- branches (one of three)

- id: fp_midnight_02_their_hour
  flashpoint: fp_midnight
  advisor: hotline
  acts: [2, 5]
  conditions: { flags_all: [ultimatum:received], flags_none: [ultimatum:issued] }
  tags: [commitment_trap, diplomacy, misperception]
  note: Their deadline. Left goes to the call through the piece layer; right goes to the hour after through the piece layer.
  text: >-
    '{Rival} confirms its midnight deadline stands, and this line stays open
    until a quarter past.' A pause, then: 'Will {leader} be on it, or has {us}
    said all it means to say?'
  left:
    text: "Be on the line at midnight"
    effects: { public: -4, military: -3, trust_primary: 8, commitment: -6 }
    tags: [diplomacy, reassurance, stall]
    follow:
      - { card: fp_midnight_06_the_word_any, in: 0 }
      - { card: fp_midnight_07_two_statements, in: 0 }
      - { card: fp_midnight_08_two_readings, in: 0 }
      - { card: fp_midnight_09_the_protocol, in: 0 }
      - { card: fp_midnight_05_four_minutes, in: 0 }
  right:
    text: "Refuse. Everything has been said"
    effects: { commitment: 12, escalation: 4, trust_primary: -10, public: 3 }
    tags: [deterrence, public_commitment, commitment_trap]
    follow:
      - { card: fp_midnight_06_the_word_any, in: 0 }
      - { card: fp_midnight_07_two_statements, in: 0 }
      - { card: fp_midnight_08_two_readings, in: 0 }
      - { card: fp_midnight_09_the_protocol, in: 0 }
      - { card: fp_midnight_10_the_hour_after, in: 0 }

- id: fp_midnight_03_our_hour
  flashpoint: fp_midnight
  advisor: hawk_general
  acts: [2, 5]
  conditions: { flags_all: [ultimatum:issued] }
  tags: [commitment_trap, military, strike]
  note: Our deadline. Right rolls They blink; success skips straight to the bluff-called terminal, failure to the hour after.
  text: >-
    Their column at the Sallow crossing has forty-one minutes to leave and is
    not moving. Our jets are holding at the edge of their radar, and midnight
    was your word.
  left:
    text: "Offer them another hour"
    effects: { commitment: -10, public: -4, military: -4, trust_primary: 6 }
    tags: [diplomacy, stall, walk_back]
    follow:
      - { card: fp_midnight_06_the_word_any, in: 0 }
      - { card: fp_midnight_07_two_statements, in: 0 }
      - { card: fp_midnight_08_two_readings, in: 0 }
      - { card: fp_midnight_09_the_protocol, in: 0 }
      - { card: fp_midnight_05_four_minutes, in: 0 }
  right:
    text: "Midnight is midnight. Hold"
    effects: { commitment: 10, escalation: 3, military: 3 }
    tags: [deterrence, military, public_commitment]
    odds:
      label: They blink
      base: 0.5
      tags: [adversary, military]
      success:
        text: "At 23:58 the column starts to move, the right way, filmed from both banks. At 00:03 the jets turn for home."
        effects: { public: 6, trust_primary: -8, escalation: -5 }
        follow: [{ card: fp_midnight_14_they_blinked, in: 0 }]
      failure:
        text: "Midnight. One fuel truck moves and nothing else does, and the jets are still holding at the edge of their radar, burning fuel they cannot get back."
        effects: { escalation: 4, military: -2, public: -2 }
        follow: [{ card: fp_midnight_10_the_hour_after, in: 0 }]

- id: fp_midnight_04_full_readiness
  flashpoint: fp_midnight
  advisor: rival_leader
  acts: [2, 5]
  conditions: { flags_none: [ultimatum:issued, ultimatum:received] }
  tags: [commitment_trap, domestic, diplomacy]
  note: Neutral path, no ultimatum arc. A two-hour deadline delivered to his own people first. Right rolls They blink at 0.4.
  text: >-
    'At midnight {rival} goes to full alert and stays there until the {us_adj}
    battalion leaves Hollin Ridge.' He said it to his own people at ten, and the
    embassy has the tape.
  left:
    text: "Call him. Keep it off the air"
    effects: { public: -4, military: -3, trust_primary: 8, commitment: -4 }
    tags: [diplomacy, reassurance, stall]
    follow:
      - { card: fp_midnight_06_the_word_any, in: 0 }
      - { card: fp_midnight_07_two_statements, in: 0 }
      - { card: fp_midnight_08_two_readings, in: 0 }
      - { card: fp_midnight_09_the_protocol, in: 0 }
      - { card: fp_midnight_05_four_minutes, in: 0 }
  right:
    text: "Match it. Full alert at 23:59"
    effects: { military: 6, escalation: 5, commitment: 8, trust_primary: -10 }
    tags: [mobilise, military, deterrence, escalatory]
    odds:
      label: They blink
      base: 0.4
      tags: [adversary, military]
      success:
        text: "At 00:06 their alert is called off 'in light of clarifications received'. Nobody in this building has clarified anything."
        effects: { public: 5, escalation: -4, trust_primary: -6 }
        follow: [{ card: fp_midnight_14_they_blinked, in: 0 }]
      failure:
        text: "Midnight. Both sides at full alert, forty metres of river between two regiments, and their first shell lands on the ridge at 00:09."
        effects: { escalation: 5, allies: -3 }
        follow: [{ card: fp_midnight_10_the_hour_after, in: 0 }]

# ---------------------------------------------------------------- the call (hotline, spend_charge)

- id: fp_midnight_05_four_minutes
  flashpoint: fp_midnight
  advisor: hotline
  acts: [2, 5]
  tags: [diplomacy, commitment_trap, deescalate]
  note: The midnight call. Left is the Hotline Protocol's free de-escalation and a walk-back; without the doctrine the commitment trap bites the public cost. Right rolls They blink.
  text: >-
    '{Rival_leader} proposes a pause at 00:30, {us} announcing first and {rival}
    four minutes later, so his people hear it from him second.' Nobody asks a
    pause of what.
  left:
    text: "Announce the pause. Us first"
    effects: { escalation: -10, trust_primary: 12, commitment: -12, public: -6, military: -5, allies: -2 }
    tags: [deescalate, walk_back, diplomacy]
    spend_charge: deescalation
    follow: [{ card: fp_midnight_12_have_you_eaten, in: 0 }]
  right:
    text: "Make them announce it first"
    effects: { commitment: 10, escalation: 3, trust_primary: -6 }
    tags: [deterrence, public_commitment, stall]
    odds:
      label: They blink
      base: 0.45
      tags: [adversary]
      success:
        text: "At 00:31 {rival_capital} announces a pause 'pending clarification'. At 00:35 nobody in your building has said the word, and nobody has to."
        effects: { escalation: -6, public: 6, trust_primary: -6 }
        follow: [{ card: fp_midnight_14_they_blinked, in: 0 }]
      failure:
        text: "Half past midnight passes. At 00:41 their guns start on the ridge, one shell every six minutes, walking towards the battalion."
        effects: { escalation: 6, allies: -3, military: 2 }
        follow: [{ card: fp_midnight_10_the_hour_after, in: 0 }]

# ---------------------------------------------------------------- piece layer (one of four, no follows: the queue carries on)

- id: fp_midnight_06_the_word_any
  flashpoint: fp_midnight
  advisor: legal
  acts: [2, 5]
  conditions: { pieces_any: [red_lines] }
  tags: [commitment_trap, domestic]
  note: Red Lines, gift and bill. The doctrine lifts the roll; redrawing the line pays the trap.
  text: >-
    You said 'midnight' on camera and you said 'any', and both are on the record
    with your name on them. The law asks nothing of you tonight; the record asks
    everything by 00:05.
  left:
    text: "Say it again on camera, now"
    effects: { commitment: 12, public: 3, escalation: 3, trust_primary: -8 }
    tags: [public_commitment, commitment_trap, deterrence]
    odds:
      label: They blink
      base: 0.55
      tags: [adversary]
      success:
        text: "Their embassy rings at 23:52 to ask what, precisely, 'any' will mean after midnight. Asking is not nothing."
        effects: { escalation: -4, intel: 4, trust_primary: -2 }
      failure:
        text: "Their embassy does not ring. At 23:55 their guns fire one shell at the ridge, so that 'any' has something to be."
        effects: { escalation: 5, trust_primary: -8, military: 2 }
  right:
    text: "Redraw the line quietly, now"
    effects: { commitment: -14, public: -5, trust_primary: 6, military: -3, intel: -4 }
    tags: [walk_back, secrecy, domestic]

- id: fp_midnight_07_two_statements
  flashpoint: fp_midnight
  advisor: spin_doctor
  acts: [2, 5]
  conditions: { pieces_any: [spin_doctor], pieces_none: [red_lines] }
  tags: [commitment_trap, domestic]
  note: The Spin Doctor. He can make either statement true for a while; the one you pick is the one you own.
  text: >-
    Two statements for 00:05, and they cannot both be true. 'Deadline met' I can
    keep alive for nine days whatever happens; 'never the point' is true, and
    lasts nine hours.
  left:
    text: "Say 'met', whatever happens"
    effects: { commitment: 10, public: 5, trust_primary: -10, escalation: 2, intel: -4 }
    tags: [public_commitment, domestic, secrecy]
  right:
    text: "Say 'never the point', now"
    effects: { commitment: -12, public: -5, trust_primary: 6, military: -3, allies: 2 }
    tags: [walk_back, domestic, transparency]

- id: fp_midnight_08_two_readings
  flashpoint: fp_midnight
  advisor: dove_fm
  acts: [2, 5]
  conditions: { pieces_any: [strategic_ambiguity], pieces_none: [red_lines, spin_doctor] }
  tags: [misperception, diplomacy, commitment_trap]
  note: Strategic Ambiguity at the hour it stops being a policy. Right rolls on whether they read the silence right.
  text: >-
    {Rival_capital} reads your silence two ways: missile crews stood to at
    eleven, their ambassador on his second glass. At 00:01 silence becomes an
    answer, and they pick which.
  left:
    text: "Tell them which. Now, privately"
    effects: { trust_primary: 12, commitment: 6, intel: 4, military: -4, public: -2 }
    tags: [diplomacy, back_channel, transparency]
  right:
    text: "Let them keep both"
    effects: { military: 3, commitment: 4, intel: -4 }
    tags: [secrecy, misperception, deterrence]
    odds:
      label: They guess right
      base: 0.45
      tags: [adversary, intel]
      success:
        text: "At 23:58 the ambassador orders dessert. The crews stand down at 00:20, and their notice calls it the end of a drill."
        effects: { escalation: -4, trust_primary: 4 }
      failure:
        text: "At 23:58 the ambassador leaves without his coat. The crews stay stood to, and at 00:10 two of their regiments leave barracks."
        effects: { escalation: 5, trust_primary: -10, intel: -6 }

- id: fp_midnight_09_the_protocol
  flashpoint: fp_midnight
  advisor: hotline
  acts: [2, 5]
  conditions: { pieces_any: [hotline_protocol], pieces_none: [red_lines, spin_doctor, strategic_ambiguity] }
  tags: [diplomacy, commitment_trap, misperception]
  note: Hotline Protocol, the bill. Your own rule obliges you at the worst possible minute, and says nothing about what refusing means.
  text: >-
    'Under the rules for this line, {rival} requests a call at 23:50 and notes
    an answer is due in ten minutes.' The rules were yours, and they do not say
    what not answering means.
  left:
    text: "Take the call. Now"
    effects: { trust_primary: 10, military: -4, public: -3, commitment: -6, escalation: -4 }
    tags: [deescalate, diplomacy, reassurance]
  right:
    text: "Let the ten minutes pass"
    effects: { trust_primary: -12, commitment: 6, escalation: 4, public: 2, intel: 2 }
    tags: [stall, deterrence, secrecy]

# ---------------------------------------------------------------- the hour after (timer)

- id: fp_midnight_10_the_hour_after
  flashpoint: fp_midnight
  advisor: hawk_general
  acts: [2, 5]
  timer: 9
  timeout: left
  tags: [commitment_trap, military, strike, escalatory]
  note: The deadline has passed and the package has twenty minutes of fuel. Timeout delivers it, the worse side. Roll failure opens the catastrophic branch.
  text: >-
    Midnight has passed, their shells are walking up the ridge towards our men,
    and their column has not moved. Our jets have twenty minutes of fuel left
    over a depot empty since ten.
  left:
    text: "Strike the depot"
    effects: { military: 5, escalation: 6, public: 3, trust_primary: -14, allies: -3 }
    tags: [limited_strike, strike, military, escalatory, commitment_trap]
    odds:
      label: They hold
      base: 0.5
      tags: [adversary, strike]
      success:
        text: "The depot at Tessel burns for an hour. Their guns stop at 01:10, and their embassy uses the word 'exercise' twice, once for each side."
        effects: { escalation: 3, public: 3, trust_primary: -6 }
        follow: [{ card: fp_midnight_13_the_record, in: 0 }]
      failure:
        text: "'{Rival} will respond at a time and place of its choosing.' At 01:14 the radar sees their missiles being readied, and the General has a second wave up unasked."
        effects: { escalation: 8, allies: -3, intel: -6 }
        follow: [{ card: fp_midnight_11_nine_minutes, in: 0 }]
  right:
    text: "Bring the jets home"
    effects: { public: -7, commitment: -12, military: -5, allies: -3, trust_primary: 8, escalation: -4 }
    tags: [walk_back, concede, deescalate]
    follow: [{ card: fp_midnight_13_the_record, in: 0 }]

# ---------------------------------------------------------------- catastrophe (terminal; failures force nuclear_midnight)

- id: fp_midnight_11_nine_minutes
  flashpoint: fp_midnight
  advisor: rival_leader
  acts: [2, 5]
  timer: 8
  timeout: left
  tags: [nuclear, misperception, commitment_trap]
  note: Terminal. Both rolls can end the run; holding is the better gamble, striking pays more. Timeout says nothing, the worse side.
  text: >-
    'My generals say your second wave is in the air and that I have nine
    minutes to decide what it is for, so tell me what is up there.' Behind him,
    somebody is counting.
  left:
    text: "Say nothing. Let the jets fly"
    effects: { military: 7, escalation: 30, public: 4, trust_primary: -30 }
    tags: [strike, military, nuclear, escalatory]
    odds:
      label: First blow
      base: 0.4
      tags: [strike, military]
      success:
        text: "Their missiles stand down at 01:31 and their column moves at dawn, the wrong way for them. Tessel is not there any more, and neither is the town's water."
        effects: { public: 3, allies: -6, trust_secondary: -12 }
        set: [fp:midnight_passed]
      failure:
        text: "Our jets reach their target. Their missiles reach ours."
        ending: nuclear_midnight
  right:
    text: "Tell him. Everything in the air"
    effects: { military: -7, public: -4, commitment: -10, escalation: 5 }
    tags: [transparency, deescalate, nuclear, reassurance]
    odds:
      label: He believes you
      base: 0.6
      tags: [adversary, first_use, diplomacy]
      success:
        text: "'Then we will both recall what we can.' The jets turn at 01:29 and their missiles stand down at 01:33, and neither side says which happened first."
        effects: { escalation: -7, trust_primary: 14, allies: -2 }
        set: [fp:midnight_passed]
      failure:
        text: "He believes you. The men counting behind him do not."
        ending: nuclear_midnight

# ---------------------------------------------------------------- terminals

- id: fp_midnight_12_have_you_eaten
  flashpoint: fp_midnight
  advisor: family
  acts: [2, 5]
  tags: [personal, domestic, commitment_trap]
  note: Terminal, backed down. You paused. Whether you dress it tonight is the last choice of the night.
  text: >-
    You are home at ten to one, which I did not expect, and I turned the
    television off when it said 'pause' twice. There is soup, and one question:
    sleep, or sit up rewriting it?
  left:
    text: "Sleep. Let it be what it was"
    effects: { public: -5, trust_primary: 10, commitment: -10, military: -3 }
    tags: [personal, reassurance, concede]
    set: [fp:midnight_backed_down]
  right:
    text: "Write it. Pass the soup"
    effects: { public: 4, trust_primary: -8, commitment: 10, escalation: 2 }
    tags: [personal, public_commitment, domestic]
    set: [fp:midnight_backed_down]

- id: fp_midnight_13_the_record
  flashpoint: fp_midnight
  advisor: legal
  acts: [2, 5]
  tags: [commitment_trap, domestic, transparency]
  note: Terminal, deadline passed. Reached after the strike or after bringing the package home under fire. Two logs, eleven minutes apart.
  text: >-
    Two logs of tonight, the machines' and the room's, and they disagree by
    eleven minutes. Publish the machines' log at six, gaps and all, or lock both
    away for forty years.
  left:
    text: "Publish the machines' log at six"
    effects: { public: -5, trust_primary: 10, military: -4, escalation: -5, intel: 4 }
    tags: [transparency, deescalate, domestic]
    set: [fp:midnight_passed]
  right:
    text: "Lock both away for forty years"
    effects: { public: 3, trust_primary: -10, allies: -3, commitment: 6, intel: -4 }
    tags: [secrecy, domestic, commitment_trap]
    set: [fp:midnight_passed]

- id: fp_midnight_14_they_blinked
  flashpoint: fp_midnight
  advisor: spin_doctor
  acts: [2, 5]
  tags: [commitment_trap, domestic, diplomacy]
  note: Terminal, bluff called. The headline decides whether he can ever blink again.
  text: >-
    They blinked at 00:04, and I have three sources and a clock. 'Blinked' on
    every front page buys a month and costs every midnight after this; 'both
    stepped back' leaves him a door.
  left:
    text: "Run 'blinked' on every front page"
    effects: { public: 7, trust_primary: -14, escalation: 2, commitment: 10 }
    tags: [public_commitment, domestic, deterrence]
    set: [fp:midnight_called_bluff]
  right:
    text: "Run 'both sides stepped back'"
    effects: { public: -3, trust_primary: 10, escalation: -7, allies: 2, commitment: -6 }
    tags: [reassurance, deescalate, diplomacy]
    set: [fp:midnight_called_bluff]
