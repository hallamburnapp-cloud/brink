# blockade — a quarantine of the Sorrel Straits: theirs, against the Isle of
# Caldor and a Compact ferry, or ours, against freighters bound for Vestria.
# Forces: deterrence against reassurance (a ship shadowed or a ship boarded),
# time pressure (hulls arrive on their own schedule; timers), and commitment
# (once the line is announced you own it: public_commitment / walk_back). The
# Fortress and the Strategic Reserve let you outlast a closed strait; the
# Admiral and the Blue-Water Fleet unlock boarding and the carrier.
# Flags: blockade:declared, blockade:ours, blockade:run, blockade:lifted,
#        blockade:shots_fired.
# Cross-hooks (flags_any): cables:cut, ultimatum:received, proxy:clash.
# Piece hooks: admiral, blue_water_fleet, fortress, strategic_reserve.

# ---- entries (non-chained; each starts the arc once) --------------------------

- id: blockade_01_the_quarantine
  arc: blockade
  advisor: hotline
  acts: [1, 2]
  weight: 1.5
  tags: [blockade, naval, commitment_trap]
  conditions: { flags_none: [blockade:declared] }
  text: >-
    '{Rival} informs {us} that from six its warships will stop and search every
    ship bound for Caldor.' Eleven seconds of silence, then, read twice: 'This
    is not a blockade.'
  left:
    text: "Our ships sail on schedule. Say so"
    effects: { commitment: 8, escalation: 5, military: 3, public: 3, trust_primary: -4 }
    tags: [public_commitment, deterrence, naval]
    set: [blockade:declared]
    follow: [{ card: blockade_04_the_schedule, in: 1 }]
  right:
    text: "Ask what they are searching for"
    effects: { commitment: -2, public: -3, intel: 4, trust_primary: 2, allies: -2 }
    tags: [diplomacy, stall, intel]
    set: [blockade:declared]
    follow: [{ card: blockade_05_the_manifest, in: 1 }]

- id: blockade_02_the_generals_line
  arc: blockade
  advisor: hawk_general
  acts: [2, 3]
  weight: 1.2
  tags: [blockade, naval, military]
  conditions: { flags_none: [blockade:declared] }
  text: >-
    Three freighters left {rival_capital} at dawn with missile parts for
    Vestria, thirty hours out. A line of our ships across the narrows at Caldor
    stops them; nothing else will.
  left:
    text: "Draw the line. Stop everything"
    effects: { military: 6, escalation: 8, commitment: 8, economy: -3, allies: -2 }
    tags: [blockade, naval, military, public_commitment]
    set: [blockade:declared, blockade:ours]
    follow: [{ card: blockade_06_the_word, in: 1 }]
  right:
    text: "Search them, then let them go"
    effects: { military: 3, escalation: 4, commitment: 4, economy: -1, intel: 2 }
    tags: [blockade, naval, deterrence]
    set: [blockade:declared, blockade:ours]
    follow: [{ card: blockade_14_the_first_hull, in: 2 }]

- id: blockade_03_the_ferry
  arc: blockade
  advisor: ally_leader
  acts: [3, 5]
  weight: 1.2
  timer: 12
  timeout: right
  tags: [blockade, alliance, alliance_demand]
  conditions: { flags_none: [blockade:declared] }
  text: >-
    They stopped my ferry at a line drawn across the Straits overnight, four
    hundred passengers aboard. At nine I tell my parliament what I will do, and
    I want it to match yours.
  left:
    text: "We will bring her through"
    effects: { allies: 7, commitment: 8, escalation: 6, military: 3 }
    tags: [public_commitment, alliance, naval, deterrence]
    set: [blockade:declared]
    follow: [{ card: blockade_08_the_ferry_line, in: 1 }]
  right:
    text: "Give me until nine"
    effects: { allies: -7, public: -3, commitment: -1, intel: 2 }
    tags: [stall, alliance]
    set: [blockade:declared]
    follow: [{ card: blockade_10_the_release, in: 2 }]

# ---- their line (chained) ----------------------------------------------------

- id: blockade_04_the_schedule
  arc: blockade
  advisor: admiral
  acts: [1, 5]
  timer: 10
  timeout: right
  tags: [naval, blockade, commitment_trap]
  text: >-
    A freighter with Caldor's winter fuel reaches their line in six hours;
    ships do not wait for cabinets. Our frigate can get there first, then it is
    their captain's call.
  left:
    text: "Escort her through"
    effects: { military: 5, escalation: 6, commitment: 5, economy: -1 }
    tags: [naval, military, deterrence]
    odds:
      label: They blink
      base: 0.5
      tags: [adversary, naval]
      success:
        text: "Their frigate turned away at two miles. The freighter is in Caldor harbour, and on every front page."
        set: [blockade:run]
        effects: { public: 7, allies: 5, trust_primary: -5, escalation: -3 }
      failure:
        text: "They put a boat in the water and boarded her, politely, with cameras, while our frigate watched."
        effects: { public: -6, allies: -4, escalation: 5, military: -3 }
        follow: [{ card: blockade_09_boarded, in: 1 }]
  right:
    text: "Hold her back at Caldor"
    effects: { military: -4, public: -5, economy: -2, commitment: -4, allies: -3 }
    tags: [walk_back, stall, naval]
    follow: [{ card: blockade_12_the_call, in: 2 }]

- id: blockade_05_the_manifest
  arc: blockade
  advisor: legal
  acts: [1, 5]
  tags: [blockade, diplomacy, commitment_trap]
  text: >-
    Their 'military cargo' so far means fertiliser, fuel and a container of
    forklifts. Stopping neutral ships at sea is an act of war, but only once
    you call it one.
  left:
    text: "Call it a blockade"
    effects: { commitment: 8, escalation: 5, public: 3, allies: 3, trust_primary: -4 }
    tags: [public_commitment, deterrence, blockade]
    follow: [{ card: blockade_04_the_schedule, in: 1 }]
  right:
    text: "Call it a dispute over searches"
    effects: { commitment: -3, public: -4, allies: -3, trust_primary: 4, escalation: -2 }
    tags: [diplomacy, stall, reassurance]
    follow: [{ card: blockade_12_the_call, in: 3 }]

- id: blockade_08_the_ferry_line
  arc: blockade
  advisor: admiral
  acts: [1, 5]
  timer: 9
  timeout: left
  tags: [naval, blockade, alliance]
  text: >-
    Two frigates can reach our ally's ferry at nine, four hundred passengers
    between us and their warship. If they shoot, my captains shoot back; that
    is training, not a decision.
  left:
    text: "Take her through"
    effects: { military: 5, escalation: 5, commitment: 5, allies: 2 }
    tags: [naval, military, deterrence, alliance]
    odds:
      label: They give way
      base: 0.55
      tags: [naval, adversary]
      success:
        text: "Their frigate gave way at a mile and a half, and the passengers cheered from the rail."
        set: [blockade:run]
        effects: { allies: 8, public: 6, trust_primary: -6, escalation: -2 }
        follow: [{ card: blockade_12_the_call, in: 2 }]
      failure:
        text: "Two shots across her bow. Our frigate fired back."
        set: [blockade:shots_fired]
        effects: { escalation: 12, allies: 3, public: -3, military: 3, trust_primary: -8 }
        follow: [{ card: blockade_16_eight_minutes, in: 0 }]
  right:
    text: "Hold at twelve miles. Talk"
    effects: { allies: -6, commitment: -6, escalation: -2, military: -3, public: -3 }
    tags: [walk_back, stall, naval, diplomacy]
    follow: [{ card: blockade_10_the_release, in: 1 }]

- id: blockade_09_boarded
  arc: blockade
  advisor: dove_fm
  acts: [1, 5]
  tags: [blockade, diplomacy, misperception]
  text: >-
    They boarded the freighter and took Caldor's winter fuel: restraint in
    {rival_capital}, humiliation here. Draw our own line and there are two,
    everyone on the wrong side of one.
  left:
    text: "Draw our own line"
    effects: { military: 6, escalation: 8, commitment: 6, economy: -3, public: 4 }
    tags: [blockade, naval, military, public_commitment, escalatory]
    set: [blockade:ours]
    follow: [{ card: blockade_06_the_word, in: 1 }]
  right:
    text: "Take it to the Assembly"
    effects: { public: -6, allies: 4, escalation: -3, commitment: -4, trust_primary: 2, military: -3 }
    tags: [diplomacy, deescalate, stall]
    follow: [{ card: blockade_12_the_call, in: 2 }]

- id: blockade_10_the_release
  arc: blockade
  advisor: hotline
  acts: [1, 5]
  tags: [diplomacy, blockade, commitment_trap]
  text: >-
    'The ferry and her passengers will be released at six if {us} confirms its
    warships stay outside the line.' Forty seconds later, as if someone had to
    be asked: 'They are well.'
  left:
    text: "Confirm it. Get them home"
    effects: { allies: 3, public: -5, commitment: -9, escalation: -6, trust_primary: 5, military: -4 }
    tags: [walk_back, concede, deescalate, diplomacy]
    follow: [{ card: blockade_21_the_formula, in: 3 }]
  right:
    text: "No conditions. Release her"
    effects: { commitment: 6, escalation: 4, military: 2 }
    tags: [deterrence, public_commitment, diplomacy]
    odds:
      label: They blink
      base: 0.4
      tags: [adversary, diplomacy]
      success:
        text: "She sailed at ten past six with no conditions mentioned by anyone. Their line was quietly redrawn around the ferry route."
        effects: { public: 7, allies: 7, trust_primary: -3, escalation: -3 }
      failure:
        text: "She is still at anchor. Four hundred people have been told the delay is {us_adj}."
        effects: { escalation: 8, allies: -6, public: -4 }
        follow: [{ card: blockade_12_the_call, in: 1 }]

# ---- our line (chained) ------------------------------------------------------

- id: blockade_06_the_word
  arc: blockade
  advisor: legal
  acts: [1, 5]
  tags: [blockade, commitment_trap, naval]
  text: >-
    'Blockade' has a legal meaning; 'quarantine' has none, which is why
    everyone says it. One word lets a captain fire a warning shot at a ship
    that runs; he needs it by four.
  left:
    text: "Blockade. Say the word"
    effects: { commitment: 8, escalation: 5, allies: -3, public: 2, trust_primary: -5, military: 2 }
    tags: [public_commitment, blockade, deterrence]
    follow: [{ card: blockade_14_the_first_hull, in: 1 }]
  right:
    text: "Quarantine. Keep it vague"
    effects: { commitment: 2, military: -3, intel: -3, public: -2, trust_primary: 1 }
    tags: [blockade, stall, secrecy]
    follow: [{ card: blockade_14_the_first_hull, in: 2 }]

- id: blockade_14_the_first_hull
  arc: blockade
  advisor: admiral
  acts: [1, 5]
  timer: 10
  timeout: left
  tags: [naval, blockade, military]
  text: >-
    A {rival_adj} freighter reaches our line at 4:20 and has not answered the
    radio for three hours. My captain fires across her bow at half a mile
    unless I stop him in ten minutes.
  left:
    text: "Stop her. Warning shot if she runs"
    effects: { military: 4, escalation: 5, commitment: 4 }
    tags: [naval, military, blockade, deterrence]
    odds:
      label: She stops
      base: 0.6
      tags: [naval, adversary]
      success:
        text: "She stopped at the second hail, eight hundred metres from the line, with her master swearing in three languages."
        effects: { military: 5, public: 5, trust_primary: -6, commitment: 3 }
        follow: [{ card: blockade_17_hold_and_search, in: 1 }]
      failure:
        text: "The first shot went across her bow. The second, from a nervous gun, went through her bridge windows. She stopped."
        set: [blockade:shots_fired]
        effects: { escalation: 12, public: -3, trust_primary: -10, military: 3 }
        follow: [{ card: blockade_16_eight_minutes, in: 0 }]
  right:
    text: "Let her through, this once"
    effects: { public: -7, commitment: -8, military: -5, escalation: -3, trust_primary: 3 }
    tags: [walk_back, stall, naval]
    set: [blockade:run]
    follow: [{ card: blockade_18_the_hole, in: 2 }]

- id: blockade_15_the_second_hull
  arc: blockade
  advisor: hawk_general
  acts: [1, 5]
  tags: [naval, blockade, military]
  text: >-
    The next freighter is six hours out with a {rival_adj} warship beside her:
    stop one, stop both. The line can hold, losses would be possible, and a
    line not held is not a line.
  left:
    text: "Stop them both"
    effects: { military: 6, escalation: 8, commitment: 6 }
    tags: [naval, military, blockade, escalatory]
    odds:
      label: They stop
      base: 0.4
      tags: [naval, adversary]
      success:
        text: "The frigate slowed at two miles and the freighter followed her. Their statement calls it a courtesy."
        effects: { military: 8, public: 6, trust_primary: -8, commitment: 4, escalation: -2 }
      failure:
        text: "The frigate did not slow. At 4:31 both ships fired, and neither missed."
        set: [blockade:shots_fired]
        effects: { escalation: 14, military: 4, public: -4, trust_primary: -10 }
        follow: [{ card: blockade_16_eight_minutes, in: 0 }]
  right:
    text: "Open the line. Call it complete"
    effects: { public: -6, military: -5, commitment: -9, escalation: -5, trust_primary: 4, allies: -2 }
    tags: [walk_back, deescalate, blockade]
    set: [blockade:lifted]

- id: blockade_17_hold_and_search
  arc: blockade
  advisor: legal
  acts: [1, 5]
  tags: [blockade, naval, intel]
  text: >-
    The stopped freighter holds missile parts invoiced as farm sensors, and a
    crew of nineteen. Release her but keep the cargo and it is a search; keep
    both and it is a seizure.
  left:
    text: "Seize ship and cargo"
    effects: { military: 5, escalation: 7, public: 5, trust_primary: -8, commitment: 5 }
    tags: [blockade, military, escalatory, naval]
    follow: [{ card: blockade_12_the_call, in: 1 }]
  right:
    text: "Cargo only. Release her by dawn"
    effects: { military: -2, escalation: 2, public: 2, trust_primary: -3, intel: 5 }
    tags: [blockade, investigate, reassurance]
    follow: [{ card: blockade_12_the_call, in: 2 }]

- id: blockade_18_the_hole
  arc: blockade
  advisor: hawk_general
  acts: [1, 5]
  tags: [blockade, military, commitment_trap]
  text: >-
    The freighter you let through is unloading at Vestria under lights, and two
    more have sailed since. A line with a hole in it is a suggestion, and it
    can still be closed tonight.
  left:
    text: "Close it. Stop the next one"
    effects: { military: 5, escalation: 6, commitment: 6, public: 2 }
    tags: [blockade, military, naval, public_commitment]
    follow: [{ card: blockade_15_the_second_hull, in: 2 }]
  right:
    text: "Take it down"
    effects: { public: -8, military: -7, commitment: -10, escalation: -6, trust_primary: 5 }
    tags: [walk_back, deescalate, blockade]
    set: [blockade:lifted]

# ---- both lines (chained) ----------------------------------------------------

- id: blockade_12_the_call
  arc: blockade
  advisor: hotline
  acts: [1, 5]
  tags: [diplomacy, naval, commitment_trap]
  text: >-
    {Rival_leader} says his navy has orders to proceed, and 'proceed' is read
    twice. The translator adds the line stays open all night, then, in his own
    voice, that he will not.
  left:
    text: "Both navies hold at twelve miles"
    effects: { escalation: -8, military: -4, commitment: -5, trust_primary: 5, public: -3 }
    tags: [deescalate, diplomacy, naval]
    spend_charge: deescalation
    follow: [{ card: blockade_21_the_formula, in: 2 }]
  right:
    text: "Ours proceed too"
    effects: { commitment: 7, escalation: 6, military: 3 }
    tags: [deterrence, public_commitment, naval]
    odds:
      label: They blink
      base: 0.45
      tags: [adversary]
      success:
        text: "Their lead frigate turned at eleven miles and called it a course correction."
        effects: { escalation: -4, public: 7, trust_primary: -6, military: 3 }
      failure:
        text: "Neither turned. At 3:12 somebody fired first, and both navies say it was the other."
        set: [blockade:shots_fired]
        effects: { escalation: 14, public: -4, military: 4, trust_primary: -8 }
        follow: [{ card: blockade_16_eight_minutes, in: 0 }]

- id: blockade_16_eight_minutes
  arc: blockade
  advisor: admiral
  acts: [1, 5]
  timer: 8
  timeout: right
  tags: [naval, military, escalatory]
  text: >-
    Shots fired, nobody dead yet, and their frigate and mine sit nine hundred
    metres apart, guns locked on each other. In eight minutes the captains
    settle this without us.
  left:
    text: "Hold fire. Both ships pull back"
    effects: { escalation: -10, military: -6, public: -5, trust_primary: 4, commitment: -6 }
    tags: [deescalate, walk_back, naval, reassurance]
    follow: [{ card: blockade_21_the_formula, in: 2 }]
  right:
    text: "Hold station. Fire if fired on"
    effects: { military: 6, escalation: 8, commitment: 6, public: 3, trust_primary: -6 }
    tags: [naval, military, deterrence, escalatory]

- id: blockade_21_the_formula
  arc: blockade
  advisor: dove_fm
  acts: [1, 5]
  tags: [diplomacy, blockade, commitment_trap]
  text: >-
    {Other} offers a deal: its coastguard searches ships for a month, both
    navies pull back, nobody says 'blockade'. Deals that hold are the ones
    everyone leaves a little ashamed.
  left:
    text: "Take the deal"
    effects: { escalation: -12, allies: -4, public: -5, commitment: -8, trust_primary: 8, trust_secondary: 5, military: -5 }
    tags: [deescalate, diplomacy, concede, walk_back]
    set: [blockade:lifted]
  right:
    text: "Not with {other} as referee"
    effects: { escalation: 4, trust_secondary: -7, commitment: 4, military: 2, public: 2 }
    tags: [deterrence, stall, public_commitment]

# ---- drawable developments and resolutions -----------------------------------

- id: blockade_11_the_queue
  arc: blockade
  advisor: treasury
  acts: [1, 5]
  tags: [economy, blockade, domestic]
  conditions:
    flags_all: [blockade:declared]
    flags_none: [blockade:lifted]
    unseen: [cables_11_war_risk]
  text: >-
    Ninety-one ships sit off Caldor at forty thousand a day each, waiting to
    learn what a quarantine is. A shipping line asks, in writing, if we insure
    ships that run the line.
  left:
    text: "Insure them"
    effects: { economy: -6, public: 3, allies: 3, commitment: 5 }
    tags: [economy, public_commitment, alliance]
  right:
    text: "No insurance. They wait"
    effects: { economy: -3, public: -5, allies: -4, commitment: -2 }
    tags: [economy, stall, domestic]

- id: blockade_13_what_they_see
  arc: blockade
  advisor: dove_fm
  acts: [1, 5]
  tags: [misperception, diplomacy, blockade]
  conditions:
    flags_all: [blockade:declared]
    flags_any: [cables:cut, ultimatum:received, proxy:clash]
    flags_none: [blockade:lifted]
  text: >-
    Seen from {rival_capital}, our warships in the Straits plus everything else
    this month is a campaign, not bad luck. People who feel surrounded do not
    blink; they brace.
  left:
    text: "Offer a pause on all of it"
    effects: { escalation: -8, commitment: -6, public: -5, military: -4, trust_primary: 6, allies: -2 }
    tags: [deescalate, diplomacy, reassurance, walk_back]
  right:
    text: "Hold the line. One thing at a time"
    effects: { commitment: 4, escalation: 4, trust_primary: -4, military: 2, public: 2 }
    tags: [deterrence, stall, public_commitment]

- id: blockade_22_two_days
  arc: blockade
  advisor: hawk_general
  acts: [2, 5]
  tags: [blockade, naval, military]
  conditions:
    flags_all: [blockade:declared, blockade:ours]
    flags_none: [blockade:lifted, blockade:shots_fired]
  text: >-
    No ship has come near our line in two days, which they call a pause and I
    call winning. Eleven ships hold a line with nothing to stop, in winter, and
    those asking why are ashore.
  left:
    text: "Stand the line down, quietly"
    effects: { military: -5, economy: 6, escalation: -6, commitment: -4, public: -2, trust_primary: 3 }
    tags: [deescalate, naval, walk_back]
    set: [blockade:lifted]
  right:
    text: "Hold it until they say so"
    effects: { military: 4, economy: -5, escalation: 3, commitment: 6, trust_primary: -4, allies: -2 }
    tags: [deterrence, naval, public_commitment, blockade]

- id: blockade_25_their_tankers
  arc: blockade
  advisor: treasury
  acts: [2, 5]
  tags: [economy, blockade, diplomacy]
  conditions:
    flags_all: [blockade:declared]
    flags_none: [blockade:ours, blockade:lifted]
  text: >-
    Their quarantine is three weeks old and their own tankers queue behind it;
    a strait does not check flags. They want to stop without looking like it,
    and I can afford to help.
  left:
    text: "Hand them the exit"
    effects: { escalation: -10, commitment: -5, public: -3, trust_primary: 7, military: -3, allies: 2 }
    tags: [deescalate, diplomacy, reassurance]
    set: [blockade:lifted]
  right:
    text: "Make them queue for it"
    effects: { economy: -4, allies: -3, escalation: 2, commitment: 4, public: 2, trust_primary: -3 }
    tags: [deterrence, stall, economy]

# ---- pieces: the Admiral, the Blue-Water Fleet -------------------------------

- id: blockade_07_her_ships
  arc: blockade
  advisor: admiral
  acts: [1, 5]
  weight: 1.2
  tags: [naval, blockade]
  conditions:
    pieces_any: [admiral]
    flags_all: [blockade:declared]
    flags_none: [blockade:lifted]
  text: >-
    Three of theirs, five of ours, forty miles of water and a tanker that has
    ignored us for six hours. My captains can board her by dawn, or shadow her
    and see who moves first.
  left:
    text: "Board her"
    effects: { military: 6, escalation: 7, commitment: 3 }
    tags: [naval, military, escalatory, blockade]
    odds:
      label: Boarding
      base: 0.6
      tags: [naval]
      success:
        text: "Her master stopped at the second hail. Forty containers of nothing, and a tracker that was simply broken."
        set: [blockade:run]
        effects: { public: 5, trust_primary: -6, intel: 3 }
      failure:
        text: "She did not stop. One shot across her bow, and one through her bridge windows from a gunner who will not forgive himself."
        set: [blockade:shots_fired]
        effects: { escalation: 10, public: -6, trust_primary: -6 }
        follow: [{ card: blockade_16_eight_minutes, in: 0 }]
  right:
    text: "Shadow her"
    effects: { military: -2, escalation: 1, allies: 3, intel: 2, commitment: -2 }
    tags: [naval, stall, reassurance]

- id: blockade_19_the_carrier
  arc: blockade
  advisor: admiral
  acts: [1, 5]
  weight: 1.2
  tags: [naval, blockade, deterrence]
  conditions:
    pieces_any: [blue_water_fleet]
    flags_all: [blockade:declared]
    flags_none: [blockade:lifted]
  text: >-
    The carrier can reach the Straits in sixty hours, eleven thousand people
    aboard. There she is a sentence nobody can unsay; over the horizon she is a
    rumour, cheaper, less use.
  left:
    text: "Send the group in"
    effects: { military: 8, escalation: 7, economy: -3, commitment: 7, trust_primary: -6, allies: 2 }
    tags: [naval, mobilise, deterrence, public_commitment, blockade]
  right:
    text: "Keep her over the horizon"
    effects: { military: -3, intel: 3, escalation: 1, allies: -2, economy: -1 }
    tags: [naval, stall, reassurance]

- id: blockade_20_thirty_one_days
  arc: blockade
  advisor: admiral
  acts: [2, 5]
  tags: [naval, economy, military]
  conditions:
    pieces_any: [blue_water_fleet]
    flags_all: [blockade:declared]
    flags_none: [blockade:lifted]
  text: >-
    The carrier needs a dockyard in nine days or she loses a shaft. Bring her
    home and the line thins by a third; keep her out and I strip the escorts to
    feed her.
  left:
    text: "Bring her home"
    effects: { military: -6, allies: -3, commitment: -4, trust_primary: 2, economy: 2 }
    tags: [naval, stall, deescalate]
  right:
