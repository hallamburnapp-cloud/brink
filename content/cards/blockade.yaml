# ---- pieces: the Fortress, the Strategic Reserve -----------------------------

- id: blockade_23_two_numbers
  arc: blockade
  advisor: treasury
  acts: [1, 5]
  weight: 1.2
  tags: [economy, deterrence, blockade]
  conditions:
    pieces_any: [strategic_reserve, fortress]
    flags_all: [blockade:declared]
    flags_none: [blockade:lifted]
  text: >-
    They believe a closed strait bleeds us, and for most countries they would
    be right. The reserve says ninety days; their fuel terminal, according to a
    satellite pass I am not supposed to have seen, says about twenty. I can
    put those two numbers in the same sentence in public, which ends the
    argument about who blinks first, or I can let them find out slowly, which
    is how I prefer to win.
  left:
    text: "Say both numbers in public"
    effects: { commitment: 7, public: 5, escalation: 4, trust_primary: -5, economy: -2 }
    tags: [public_commitment, deterrence, economy]
  right:
    text: "Let them count for themselves"
    effects: { economy: -4, intel: -2, commitment: 1, allies: -2 }
    tags: [economy, secrecy, stall]

