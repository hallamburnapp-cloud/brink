  note: Resolution after a counterhack. Timeout demonstrates, the worse side.
  text: >-
    Their radar is back. Their bombers are not; they are still dispersed, a week
    on, at fields we did not know they had finished. Whatever they thought was
    being prepared, they are now prepared for it, and preparedness has a way of
    finding its own reason. A demonstration would remind them what the ladder
    looks like.
