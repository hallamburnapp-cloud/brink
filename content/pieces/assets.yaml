  mechanics: Nuclear and warning choices +6 base. Public costs on nuclear cards ×0.5 and those cards earn +2 public. Accidents do 20% less damage.
  accent: "#c9b98a"
  art: asset_civil
  tags: [domestic, nuclear]
  grants: [asset_civil_defence]
  modifiers:
    - { kind: leverage, tags: [nuclear, warning], base_add: 6 }
    - { kind: effect, key: public, tags: [nuclear], sign: neg, mult: 0.5 }
    - { kind: effect, key: public, tags: [nuclear, warning], add: 2, always: true }
