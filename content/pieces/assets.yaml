# ASSETS — capabilities that unlock card lines, change odds and scale leverage.

- id: early_warning
  pool: asset
  rarity: common
  name: Early-Warning Constellation
  title: Early-Warning Constellation
  blurb: >-
    Eyes over the pole, watching for the plume. You will see it coming, and every ghost
    you correctly ignore teaches the operators something. Someone will eventually try
    to blind it.
  mechanics: Warning and intel choices +5 base; every accident that does not fire adds +1 base permanently (max +20). Warning cards 60% more common; intel reliability +8. Unlocks jamming lines.
  accent: "#7fd6e6"
  art: asset_ew
  tags: [space, warning, intel]
  grants: [asset_ew]
  modifiers:
    - { kind: leverage, tags: [warning, intel], base_add: 5 }
    - { kind: scale, on: accident_avoided, base_add: 1, max: 2 }
    - { kind: rule, rule: warning_frequency, value: 0.6 }
    - { kind: intel, add: 8 }

- id: back_channel
  pool: asset
  rarity: uncommon
  name: Back-Channel
  title: Back-Channel
  blurb: >-
    An academic in a neutral capital who happens to have lunch with the right people.
    Nothing said through him is official, which is why anything can be said, and why
    it weighs so much.
  mechanics: Back-channel choices +4 base and +0.6 mult; their rolls +10%; back-channel cards 50% more common.
  accent: "#8e6bb3"
  art: asset_back_channel
  tags: [diplomacy, back_channel]
  grants: [asset_back_channel]
  modifiers:
    - { kind: leverage, tags: [back_channel], base_add: 4, mult_add: 0.6 }
    - { kind: odds, tags: [back_channel], add: 0.10 }
    - { kind: weight, tags: [back_channel], mult: 1.5 }

- id: cyber_unit
  pool: asset
  rarity: uncommon
  name: Cyber Unit
  title: Cyber Unit
  blurb: >-
    Four hundred people in a building with no sign. They can find out who did it and
    they can do it back. The other side assumes you already have.
  mechanics: Cyber choices ×1.3 mult; cyber rolls +10%; cyber cards 40% more common. Cyber choices cost 2 trust with both rivals.
  accent: "#3fbf9f"
  art: asset_cyber
  tags: [cyber, attribution]
  grants: [asset_cyber_unit]
  modifiers:
    - { kind: leverage, tags: [cyber], mult_mult: 1.3 }
    - { kind: odds, tags: [cyber], add: 0.10 }
    - { kind: weight, tags: [cyber], mult: 1.4 }
    - { kind: effect, key: trust, tags: [cyber], add: -2, always: true }

- id: missile_defence
  pool: asset
  rarity: uncommon
  name: Missile Defence Layer
  title: Missile Defence Layer
  blurb: >-
    Interceptors on rails, radars on hills. It gives you a real chance to catch what
    comes and real weight behind every threat. It gives them a real reason to think you
    are planning to make it come.
  mechanics: Intercept, missile-defence and deterrence choices +0.5 mult. Intercept rolls +20%. Trust with the primary rival drifts down about one point every five cards.
  accent: "#7c8b9a"
  art: asset_md
  tags: [missile_defence, deterrence]
  grants: [asset_md]
  modifiers:
    - { kind: leverage, tags: [intercept, missile_defence, deterrence], mult_add: 0.5 }
    - { kind: odds, tags: [intercept], add: 0.20 }
    - { kind: drift, key: trust_primary, per_card: -0.2 }

- id: blue_water_fleet
  pool: asset
  rarity: uncommon
  name: Blue-Water Fleet
  title: Blue-Water Fleet
  blurb: >-
    Carriers that can be anywhere in a week and cannot be hidden anywhere at all.
    Blockades, transits, shows of force, and the bill for fuel.
  mechanics: Naval and blockade choices ×1.3 mult; those cards 60% more common; naval rolls +10%. Naval choices cost 1 economy.
  accent: "#2f6fb8"
  art: asset_fleet
  tags: [naval, military]
  grants: [asset_fleet]
  modifiers:
    - { kind: leverage, tags: [naval, blockade], mult_mult: 1.3 }
    - { kind: weight, tags: [naval, blockade], mult: 1.6 }
    - { kind: odds, tags: [naval], add: 0.10 }
    - { kind: effect, key: economy, tags: [naval], add: -1, always: true }

- id: hardened_nc3
  pool: asset
  rarity: rare
  name: Hardened NC3
  title: Hardened Command & Control
  blurb: >-
    Buried lines, redundant links, three people who must agree before the board is
    believed. The false alarms still come. They stop arriving as orders, and when they
    do arrive they do less.
  mechanics: Nuclear choices +0.5 mult. Warning cards are true at least 70% of the time; accidents do 40% less damage; nuclear-tagged escalation costs ×0.8.
  accent: "#c9b98a"
  art: asset_nc3
  tags: [nuclear, intel]
  grants: [asset_nc3]
  unlock: { id: low_survivor, label: Hardened NC3, hint: Survive to Week Three with Launch on Warning. }
  modifiers:
    - { kind: leverage, tags: [nuclear], mult_add: 0.5 }
    - { kind: rule, rule: warning_floor, value: 70 }
    - { kind: accident, severity_mult: 0.6 }
    - { kind: effect, key: escalation, tags: [nuclear], sign: pos, mult: 0.8 }

- id: commercial_sat
  pool: asset
  rarity: common
  name: Commercial Satellite Deal
  title: Commercial Satellite Deal
  blurb: >-
    A private constellation, leased by the hour, cheaper than anything you could build.
    Their imagery is on your desk before breakfast, their dividends in your account.
    Their satellites are now targets.
  mechanics: Space choices +6 base. +1 political capital each act; economy drifts up slowly; intel reliability +6. Space choices cost 2 more escalation.
  accent: "#9aa0a6"
  art: asset_comsat
  tags: [space, economy, entanglement]
  grants: [asset_comsat]
  unlock: { id: bankrupt, label: Commercial Satellite Deal, hint: Lose a run to economic collapse. }
  modifiers:
    - { kind: leverage, tags: [space, entanglement], base_add: 6 }
    - { kind: rule, rule: capital_per_act, value: 1 }
    - { kind: intel, add: 6 }
    - { kind: drift, key: economy, per_card: 0.15 }
    - { kind: effect, key: escalation, tags: [space], sign: pos, add: 2 }

