  mechanics: Alliance, basing and military choices +5 base and +0.2 mult. Allies gains ×1.3; allies drift up slowly; basing and proxy cards 30% more common.
  accent: "#5aa9d6"
  art: asset_basing
  tags: [alliance, military]
  grants: [asset_basing]
  modifiers:
    - { kind: leverage, tags: [alliance, basing, military], base_add: 5, mult_add: 0.2 }
