- id: deadman_switch
  pool: asset
  rarity: legendary
  name: Deadman Switch
  title: Deadman Switch
  blurb: >-
    A system that fires if you do not, so you never have to. Once, if the world is
    about to end, it does not: the launch order arrives at a bunker that has been
    told to wait, and the board resets to merely terrible.
  mechanics: Once per run, a nuclear ending instead sets escalation to 70. Nuclear choices +1 mult.
  accent: "#e03b3b"
  art: asset_nc3
  tags: [nuclear]
  grants: [asset_deadman]
  modifiers:
    - { kind: rule, rule: deadman_switch }
    - { kind: leverage, tags: [nuclear], mult_add: 1 }

