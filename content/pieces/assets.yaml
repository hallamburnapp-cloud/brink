  mechanics: Proxy choices +0.8 mult; proxy rolls +15%; proxy cards 30% more common. From Week Three, escalation gains are amplified by 15% per act.
  accent: "#b8352f"
  art: asset_rrb
  tags: [proxy, military]
  grants: [asset_rrb]
  modifiers:
