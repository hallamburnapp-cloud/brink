    - { kind: odds, tags: [proxy], add: 0.15 }
    - { kind: weight, tags: [proxy], mult: 1.3 }
    - { kind: rule, rule: escalation_twitch }

- id: signals_intercept
  pool: asset
  rarity: rare
  name: Signals Intercept
  title: Signals Intercept
  blurb: >-
    You are reading their internal traffic. Not all of it, not always in time, but
    enough to know what they actually think of you, and to move before the accident
    finds you.
  mechanics: All choices +0.3 mult. Adversary trust shown as numbers. Accidents 30% less likely; intel reliability +5; intel rolls +10%.
  accent: "#7fd6e6"
  art: asset_sigint
  tags: [intel]
  grants: [asset_sigint]
  unlock: { id: no_backchannel_standdown, label: Signals Intercept, hint: Reach Stand-Down without a Back-Channel. }
  modifiers:
    - { kind: leverage, mult_add: 0.3 }
    - { kind: rule, rule: reveal_trust }
    - { kind: accident, mult: 0.7 }
    - { kind: intel, add: 5 }
    - { kind: odds, tags: [intel], add: 0.10 }

- id: civil_defence
  pool: asset
  rarity: common
  name: Civil Defence Programme
