  mechanics: Economy choices +0.4 mult. Economy cannot fall below 15; economy costs ×0.7; sold pieces return 75% of their price.
  accent: "#c1a23a"
  art: asset_reserve
  tags: [economy]
  grants: [asset_reserve]
  modifiers:
    - { kind: leverage, tags: [economy, sanction], mult_add: 0.4 }
    - { kind: rule, rule: economy_floor, value: 15 }
    - { kind: rule, rule: sell_bonus, value: 0.75 }
    - { kind: effect, key: economy, sign: neg, mult: 0.7 }

