<!doctype html>
<html><head><meta charset="utf-8"><title>Neverspring</title>
<meta name="viewport" content="width=390, initial-scale=1">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="ui.css">
</head>
<body class="phone">
<canvas id="cv"></canvas>
<div id="ui">
  <div id="sb"></div>

  <!-- race strip -->
  <div class="panel strip">
    <div class="goal">Freeze the world before the Furnace is lit.</div>
    <div class="race">
      <div class="track"></div>
      <div class="fill-w" style="width:98px"><i class="sp" style="left:18px;top:6px"></i><i class="sp" style="left:44px;top:13px"></i><i class="sp" style="left:66px;top:5px"></i><i class="sp s2" style="left:30px;top:15px"></i><i class="sp s2" style="left:82px;top:12px"></i></div>
      <div class="fill-a" style="width:71px"><i class="gl" style="left:20px"></i></div>
      <div class="cap cap-w" id="capW"></div>
      <div class="cap cap-a" id="capA"></div>
      <div class="finish" id="finish"></div>
    </div>
    <div class="labels"><span class="lw">26 of 40 frozen</span><span class="la">Furnace</span></div>
  </div>

  <!-- info row -->
  <div class="pill season"><span id="dial"></span><span>Year 3 <b class="dot">·</b> Midwinter</span></div>
  <div class="speed"><span class="seg" id="pz"></span><span class="seg on">1×</span><span class="seg">2×</span><span class="seg">4×</span></div>

  <!-- radio line -->
  <div class="radio"><span class="rg" id="rg"></span><span class="rt">Ice closes the Narrows. Fuel ships turn back.</span><span class="rchev"></span></div>

  <!-- dock -->
  <div class="dock">
    <div class="btn focus" id="focus"></div><div class="lbl" style="left:14px;width:72px;top:762px">Focus</div>
    <div class="breath"></div>
    <div class="btn grow" id="grow"></div>
    <div class="frost" id="frost"><span id="fsf"></span><b>38</b></div>
    <div class="lbl" style="left:151px;width:88px;top:762px">Grow</div>
    <div class="btn storm"><svg class="arc" width="84" height="84" viewBox="-42 -42 84 84"><circle r="39" fill="none" stroke="#1C3047" stroke-width="2"/><circle r="39" fill="none" stroke="#9CC9E8" stroke-opacity=".6" stroke-width="2" stroke-linecap="round" stroke-dasharray="147 300" transform="rotate(-90)"/></svg><span id="cloud"></span><span class="pips"><i class="on"></i><i class="on"></i><i></i></span></div>
    <div class="lbl" style="left:290px;width:72px;top:762px">Storm</div>
  </div>
  <div class="home"></div>
</div>
<script src="world.js"></script><script src="overlays.js"></script><script src="icons.js"></script><script src="scene.js"></script>
<script>
const I = NSI;
document.getElementById('sb').outerHTML = I.statusBar();
document.getElementById('capW').innerHTML = I.snowflake(14, '#F2F7FB', 2.1);
document.getElementById('capA').innerHTML = I.flame(15);
document.getElementById('finish').innerHTML = I.split(20);
document.getElementById('dial').innerHTML = I.dial(20);
document.getElementById('pz').innerHTML = I.pause(12, '#C9D6E2');
document.getElementById('rg').innerHTML = I.radio(16, '#F2A23A');
document.getElementById('focus').innerHTML = I.disc(24, '#C9D6E2');
document.getElementById('grow').innerHTML = I.snowflake(38, '#0B1622', 1.9);
document.getElementById('fsf').innerHTML = I.snowflake(12, '#0B1622', 2.2);
document.getElementById('cloud').innerHTML = I.cloud(30, '#F2F7FB');

async function go() {
  await document.fonts.ready;
  const dpr = window.devicePixelRatio || 1, W = 390, H = 844;
  const cv = document.getElementById('cv'); cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px';
  const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
  const v = NSO.makeView(195, 384, 185);
  NSO.drawSky(ctx, W, H, v, { stars: 52 });
  const world = NSS.paintMid(Math.round(370 * dpr), dpr);
  window.__t = performance.now();
  NSS.drawMid(ctx, v, world, 1);
  window.__ready = true;
}
go();
</script>
</body></html>
