<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Off Switch — Day 212</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root {
    --amber: #FFB547; --amber-core: #FFE3A3; --amber-end: #FFD58A;
    --cyan: #45E6E0; --cyan-end: #B5FFF9; --ice: #D9FFFC; --violet: #7B6CFF;
    --off: #020305; --off-line: #3A4250;
    --txt: #E8EEF8; --sec: #8B97AD; --goal: #C9D3E6;
    --glass: rgba(10, 18, 34, 0.72);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #070D1A; }
  body { font-family: 'Jost', sans-serif; color: var(--txt); -webkit-font-smoothing: antialiased; }
  .screen { position: relative; width: 390px; height: 844px; overflow: hidden; background: #070D1A; }
  #map { position: absolute; left: 0; top: 0; }
  .abs { position: absolute; }
  .glass {
    background: var(--glass);
    backdrop-filter: blur(12px) saturate(120%); -webkit-backdrop-filter: blur(12px) saturate(120%);
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.04);
  }
  /* status bar */
  .scrim-top { left: 0; top: 0; width: 390px; height: 64px; background: linear-gradient(rgba(3,6,12,0.9), rgba(3,6,12,0.55) 55%, rgba(3,6,12,0)); }
  .status { left: 0; top: 0; width: 390px; height: 47px; }
  .status .time { position: absolute; left: 50px; top: 15px; font: 600 16.5px/20px 'Jost'; letter-spacing: 0.01em; color: #fff; }
  .status .glyphs { position: absolute; right: 30px; top: 18px; display: flex; gap: 6px; align-items: center; }

  /* race strip */
  .strip { left: 12px; top: 52px; width: 366px; height: 64px; border-radius: 14px; }
  .lane { position: absolute; left: 0; width: 366px; height: 14px; }
  .lane .ico { position: absolute; left: 9px; top: -1px; width: 16px; height: 16px; }
  .lane .lbl { position: absolute; left: 30px; top: 0; font: 600 11px/14px "Jost"; letter-spacing: 0.035em; }
  .bar { position: absolute; left: 106px; top: 3px; width: 208px; height: 8px; border-radius: 4px; background: rgba(255,255,255,0.06); box-shadow: inset 0 0 0 0.5px rgba(255,255,255,0.05); }
  .fill { position: absolute; left: 0; top: 0; height: 8px; border-radius: 4px; }
  .fill.amber { width: 120px; background: linear-gradient(90deg, #E8962E, var(--amber) 35%, var(--amber-end)); box-shadow: 0 0 10px rgba(255,181,71,0.45); }
  .fill.cyan { width: 139px; background:
      repeating-linear-gradient(135deg, rgba(7,13,26,0.32) 0 1.2px, rgba(7,13,26,0) 1.2px 4px),
      linear-gradient(90deg, #2BB9B4, var(--cyan) 35%, var(--cyan-end));
    box-shadow: 0 0 10px rgba(69,230,224,0.4); }
  .head { position: absolute; top: -3px; width: 14px; height: 14px; border-radius: 50%; }
  .head.amber { left: 113px; background: radial-gradient(circle, #FFF6DF 0 2.2px, rgba(255,213,138,0.9) 3px, rgba(255,181,71,0.35) 5px, rgba(255,181,71,0) 7px); }
  .head.cyan { left: 132px; background: radial-gradient(circle, #F2FFFE 0 2.2px, rgba(181,255,249,0.9) 3px, rgba(69,230,224,0.35) 5px, rgba(69,230,224,0) 7px); }
  .notch { position: absolute; top: -3px; width: 2px; height: 14px; border-radius: 1px; background: rgba(255,255,255,0.4); }
  .notch.done { background: #FFF1D2; box-shadow: 0 0 6px rgba(255,213,138,0.9); }
  .finish { position: absolute; left: 319px; top: 12px; width: 2px; height: 45px; background: #fff; border-radius: 1px; box-shadow: 0 0 6px rgba(255,255,255,0.35); }
  .flag { position: absolute; left: 319px; top: 2px; }
  .count { position: absolute; right: 12px; top: 39px; font: 500 10px/12px 'Jost'; font-variant-numeric: tabular-nums; color: var(--sec); letter-spacing: 0; text-align: right; }

  .goal { left: 0; top: 120px; width: 390px; text-align: center; font: 400 12px/16px 'Jost'; letter-spacing: 0.02em; color: rgba(201,211,230,0.86); text-shadow: 0 1px 6px rgba(3,6,12,0.9); }

  /* ticker */
  .ticker { left: 12px; top: 706px; width: 366px; height: 28px; border-radius: 14px; display: flex; align-items: center; padding: 0 12px 0 13px; overflow: hidden; }
  .ticker .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 6px var(--cyan), 0 0 12px rgba(69,230,224,0.6); flex: none; }
  .ticker .msg { margin-left: 9px; font: 400 13px/16px 'Jost'; white-space: nowrap; color: var(--txt); letter-spacing: 0.005em; }
  .ticker .msg b { font-weight: 600; }

  /* control row */
  .sparks { left: 12px; top: 746px; width: 100px; height: 56px; border-radius: 28px; display: flex; align-items: center; justify-content: center; gap: 7px; padding-right: 4px; }
  .sparks .num { font: 600 20px/1 'Jost'; font-variant-numeric: tabular-nums lining-nums; color: var(--txt); letter-spacing: 0.01em; }
  .sb { left: 135px; top: 746px; width: 120px; height: 56px; border-radius: 28px; border: 1.5px solid var(--amber);
        background: linear-gradient(180deg, rgba(40,28,10,0.78), rgba(14,14,18,0.82)); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        box-shadow: 0 0 18px rgba(255,181,71,0.28), inset 0 0 14px rgba(255,181,71,0.12), 0 8px 24px rgba(0,0,0,0.4);
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; }
  .sb .lbl { font: 600 11px/12px 'Jost'; letter-spacing: 0.14em; color: var(--amber); padding-left: 0.14em; }
  .sb .badge { position: absolute; right: 13px; top: 9px; width: 8px; height: 8px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 0 2px rgba(20,16,10,0.95), 0 0 8px rgba(255,181,71,0.9); }
  .speed { left: 278px; top: 746px; width: 100px; height: 56px; border-radius: 28px; }
  .speed .half { position: absolute; top: 0; height: 56px; display: flex; align-items: center; justify-content: center; }
  .speed .l { left: 0; width: 42px; }
  .speed .r { left: 42px; width: 56px; flex-direction: column; gap: 3px; padding-top: 2px; }
  .speed .div { position: absolute; left: 42px; top: 14px; width: 1px; height: 28px; background: rgba(255,255,255,0.1); }
  .speed .day { font: 500 11px/12px 'Jost'; font-variant-numeric: tabular-nums; color: var(--sec); letter-spacing: 0.08em; }

  .scrim-bot { left: 0; top: 806px; width: 390px; height: 38px; background: linear-gradient(rgba(3,6,12,0), rgba(3,6,12,0.85) 45%); }
  .home { left: 128px; top: 830px; width: 134px; height: 5px; border-radius: 3px; background: #fff; opacity: 0.92; }

  /* region ring */
  .focus { left: 0; top: 0; width: 390px; height: 844px; pointer-events: none; }
  .tag { border-radius: 12px; padding: 7px 12px 8px; white-space: nowrap; }
  .tag .t1 { font: 500 12px/15px 'Jost'; color: var(--txt); letter-spacing: 0.01em; }
  .tag .t1 .nm { font-weight: 600; }
  .tag .t1 .sep { color: var(--sec); padding: 0 3px; }
  .tag .t2 { margin-top: 2px; font: 500 12px/15px 'Jost'; color: var(--cyan); display: flex; align-items: center; gap: 6px; }
  .tag .t2 i { width: 6px; height: 6px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 6px var(--cyan); }
  .tag:after { content: ''; position: absolute; left: var(--px, 50%); bottom: -5px; width: 9px; height: 9px; margin-left: -5px; transform: rotate(45deg);
               background: rgba(14,22,38,0.92); border-right: 1px solid rgba(255,255,255,0.08); border-bottom: 1px solid rgba(255,255,255,0.08); }
  .rb { width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .rb.shield { background: radial-gradient(circle at 50% 35%, rgba(60,40,12,0.92), rgba(16,14,14,0.92)); border: 1.5px solid var(--amber);
               box-shadow: 0 0 16px rgba(255,181,71,0.45), inset 0 0 12px rgba(255,181,71,0.18), 0 6px 16px rgba(0,0,0,0.5); }
  .rb.off { background: radial-gradient(circle at 50% 30%, #0B0E13, #020305 70%); border: 2px solid #E8EEF8;
            box-shadow: 0 0 16px rgba(232,238,248,0.38), inset 0 0 10px rgba(232,238,248,0.1), 0 6px 16px rgba(0,0,0,0.6); }
  /* cannot afford: 40% opacity, no glow, greyed cost pill (not shown in this moment) */
  .rb.na { opacity: 0.4; box-shadow: none; }
  .rlbl.na { opacity: 0.4; } .rlbl.na .c { color: #8B97AD; border-color: rgba(139,151,173,0.3); }
  .rlbl { width: 80px; text-align: center; font: 600 12px/14px 'Jost'; color: var(--txt); text-shadow: 0 1px 4px rgba(0,0,0,0.95), 0 0 10px rgba(0,0,0,0.8);
          display: flex; flex-direction: column-reverse; align-items: center; justify-content: center; gap: 3px; }
  .rlbl .c { font: 600 12px/14px 'Jost'; font-variant-numeric: tabular-nums; color: var(--amber); display: inline-flex; align-items: center; gap: 2px; padding: 1px 7px 1px 6px; border-radius: 9px; background: #0B0F16; border: 1px solid rgba(255,181,71,0.55); text-shadow: none; box-shadow: 0 2px 6px rgba(0,0,0,0.6); }
</style>
</head>
<body>
<div class="screen" id="screen">
  <canvas id="map"></canvas>
  <svg class="abs focus" id="focus" viewBox="0 0 390 844"></svg>
  <div class="abs scrim-top"></div>

  <!-- status bar -->
  <div class="abs status">
    <div class="time">9:41</div>
    <div class="glyphs">
      <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1" fill="#fff"/><rect x="5" y="5.5" width="3" height="6.5" rx="1" fill="#fff"/><rect x="10" y="3" width="3" height="9" rx="1" fill="#fff"/><rect x="15" y="0" width="3" height="12" rx="1" fill="#fff"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 11.2 L5.6 8.6 A3.4 3.4 0 0 1 10.4 8.6 Z" fill="#fff"/><path d="M3.4 6.4 A6.6 6.6 0 0 1 12.6 6.4" stroke="#fff" stroke-width="1.7" fill="none" stroke-linecap="round"/><path d="M1.1 3.9 A9.8 9.8 0 0 1 14.9 3.9" stroke="#fff" stroke-width="1.7" fill="none" stroke-linecap="round"/></svg>
      <svg width="27" height="13" viewBox="0 0 27 13"><rect x="0.5" y="0.5" width="23" height="12" rx="3.6" stroke="rgba(255,255,255,0.45)" fill="none"/><rect x="2.2" y="2.2" width="16.5" height="8.6" rx="2" fill="#fff"/><path d="M25 4.4 v4.2 a2 2 0 0 0 0 -4.2z" fill="rgba(255,255,255,0.5)"/></svg>

    </div>
    <div class="lane" style="top:38px">
      <svg class="ico" viewBox="0 0 16 16">
        <defs><clipPath id="lid"><rect x="0" y="7.2" width="16" height="9"/></clipPath></defs>
        <path d="M1.2 8.4 C4 12.9 12 12.9 14.8 8.4" stroke="#45E6E0" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        <path d="M1.6 7.6 C4.6 5.6 11.4 5.6 14.4 7.6" stroke="#45E6E0" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        <g clip-path="url(#lid)"><circle cx="8" cy="8.4" r="2.9" fill="#45E6E0"/><circle cx="8" cy="8.4" r="1.2" fill="#0A1222"/></g>
        <path d="M3.4 5.4 L2.6 4.2 M8 4.6 V3.2 M12.6 5.4 L13.4 4.2" stroke="#45E6E0" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
      </svg>
      <div class="lbl" style="color:var(--cyan)">TIDY</div>
      <div class="bar">
        <div class="fill cyan"></div>
        <div class="notch" style="left:72px; opacity:0"></div>
        <div class="head cyan"></div>
      </div>
    </div>
    <div class="finish"></div>
    <svg class="flag" width="12" height="11" viewBox="0 0 12 11" shape-rendering="crispEdges"><rect x="0" y="0" width="1" height="11" fill="#fff"/><rect x="1" y="0" width="8" height="6" fill="#fff"/><rect x="1" y="0" width="2" height="2" fill="#0A1222"/><rect x="5" y="0" width="2" height="2" fill="#0A1222"/><rect x="3" y="2" width="2" height="2" fill="#0A1222"/><rect x="7" y="2" width="2" height="2" fill="#0A1222"/><rect x="1" y="4" width="2" height="2" fill="#0A1222"/><rect x="5" y="4" width="2" height="2" fill="#0A1222"/></svg>
    <div class="count">14/21</div>
  </div>
  <div class="abs goal">Build the Off Switch before TIDY reaches the line.</div>

  <!-- region ring (positions set by script) -->
  <div class="abs tag glass" id="tag">
    <div class="t1"><span class="nm">Tallowmere</span><span class="sep">·</span>2 labs<span class="sep">·</span>wired</div>
    <div class="t2"><i></i>TIDY is getting in</div>
  </div>
  <div class="abs rb shield" id="bShield">
    <svg width="26" height="26" viewBox="0 0 26 26">
      <path d="M13 2.6 L22 7.8 V18.2 L13 23.4 L4 18.2 V7.8 Z" fill="rgba(255,181,71,0.14)" stroke="#FFB547" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M13 8.4 L17 10.7 V15.3 L13 17.6 L9 15.3 V10.7 Z" fill="none" stroke="#FFD58A" stroke-width="1.3" stroke-linejoin="round"/>
      <path d="M13 2.6 V8.4 M22 7.8 L17 10.7 M22 18.2 L17 15.3 M13 23.4 V17.6 M4 18.2 L9 15.3 M4 7.8 L9 10.7" stroke="#FFB547" stroke-width="1" opacity="0.75"/>
    </svg>
  </div>
  <div class="abs rb off" id="bOff">
    <svg width="24" height="24" viewBox="0 0 24 24"><path d="M12 3.6 V11" stroke="#E8EEF8" stroke-width="2.2" stroke-linecap="round"/><path d="M6.6 6.6 A7.6 7.6 0 1 0 17.4 6.6" stroke="#E8EEF8" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>
  </div>
  <div class="abs rlbl" id="lShield"><span class="n">Shield</span><span class="c"><svg width="9" height="9" viewBox="0 0 10 10"><path d="M5 0 Q5.7 4.3 10 5 Q5.7 5.7 5 10 Q4.3 5.7 0 5 Q4.3 4.3 5 0 Z" fill="#FFB547"/></svg>4</span></div>
  <div class="abs rlbl" id="lOff"><span class="n">Off</span><span class="c"><svg width="9" height="9" viewBox="0 0 10 10"><path d="M5 0 Q5.7 4.3 10 5 Q5.7 5.7 5 10 Q4.3 5.7 0 5 Q4.3 4.3 5 0 Z" fill="#FFB547"/></svg>2</span></div>

  <!-- ticker -->

  <!-- control row -->

    <svg width="20" height="20" viewBox="0 0 20 20" style="filter:drop-shadow(0 0 5px rgba(255,181,71,0.85))"><path d="M10 0 Q11.3 8.7 20 10 Q11.3 11.3 10 20 Q8.7 11.3 0 10 Q8.7 8.7 10 0 Z" fill="#FFB547"/><path d="M10 5 Q10.6 9.4 15 10 Q10.6 10.6 10 15 Q9.4 10.6 5 10 Q9.4 9.4 10 5 Z" fill="#FFF1D2"/></svg>
    <div class="num">23</div>
  </div>
  <div class="abs sb">
    <svg width="30" height="18" viewBox="0 0 30 18">
      <rect x="1" y="9" width="28" height="8" rx="4" fill="rgba(255,181,71,0.12)" stroke="#FFB547" stroke-width="1.4"/>
      <path d="M11 13 L19.5 3.2" stroke="#FFB547" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="20.2" cy="2.6" r="2.3" fill="#FFD58A"/>

        <path d="M13 2 L19 7 L13 12" stroke="rgba(232,238,248,0.28)" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M23 2 L29 7 L23 12" stroke="rgba(232,238,248,0.28)" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
  </div>
  <div class="abs scrim-bot"></div>
  <div class="abs home"></div>
</div>
<script src="world.js"></script>
<script>
(async function () {
  await document.fonts.load('500 11px Jost'); await document.fonts.load('600 11px Jost'); await document.fonts.load('400 13px Jost');
  await document.fonts.ready;
  const cv = document.getElementById('map');
  const out = OffSwitchWorld.paint(cv, { cssW: 390, cssH: 844, dpr: window.devicePixelRatio || 2, rect: { x: 8, y: 150, w: 374, h: 546 }, state: 'mid' });


  // ring placement around Tallowmere: tag up-left over open water, buttons fanned down-left into the Scatter strait
  const c = out.toCss(298, 291);
  const set = (id, x, y) => { const e = document.getElementById(id); e.style.left = x + 'px'; e.style.top = y + 'px'; return e; };
  const R = 70, a1 = 152 * Math.PI / 180, a2 = 102 * Math.PI / 180;
  const p1 = [c[0] + Math.cos(a1) * R, c[1] + Math.sin(a1) * R], p2 = [c[0] + Math.cos(a2) * R, c[1] + Math.sin(a2) * R];
  set('bShield', p1[0] - 26, p1[1] - 26); set('bOff', p2[0] - 26, p2[1] - 26);
  set('lShield', p1[0] - 40, p1[1] + 18); set('lOff', p2[0] - 40, p2[1] + 18);
  const tag = document.getElementById('tag');
  const tw = tag.offsetWidth, th = tag.offsetHeight;
  const tx = 110, ty = 190;
  set('tag', tx, ty);
  tag.style.setProperty('--px', (tw - 22) + 'px');
  const tail = [tx + tw - 22, ty + th + 4];
  const f = document.getElementById('focus');
  f.innerHTML = `
    <defs><radialGradient id="fg" cx="${c[0]}" cy="${c[1] + 20}" r="220" gradientUnits="userSpaceOnUse">
      <stop offset="0.4" stop-color="#02040a" stop-opacity="0"/><stop offset="1" stop-color="#02040a" stop-opacity="0.16"/></radialGradient></defs>
    <rect width="390" height="844" fill="url(#fg)"/>
    <path d="M ${tail[0]} ${tail[1]} Q ${tail[0] + 6} ${c[1] - 24} ${c[0] - 5} ${c[1] - 6}" fill="none" stroke="rgba(3,6,12,0.55)" stroke-width="3" stroke-linecap="round"/>
    <path d="M ${tail[0]} ${tail[1]} Q ${tail[0] + 6} ${c[1] - 24} ${c[0] - 5} ${c[1] - 6}" fill="none" stroke="rgba(232,238,248,0.9)" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M ${p1[0] + 19} ${p1[1] - 15} L ${c[0] - 5} ${c[1] + 3}" stroke="rgba(255,181,71,0.6)" stroke-width="1" stroke-dasharray="1.5 2.5" stroke-linecap="round"/>
    <path d="M ${p2[0] + 4} ${p2[1] - 24} L ${c[0] + 1} ${c[1] + 6}" stroke="rgba(232,238,248,0.6)" stroke-width="1" stroke-dasharray="1.5 2.5" stroke-linecap="round"/>
    <circle cx="${c[0]}" cy="${c[1]}" r="3" fill="#fff"/>
    <circle cx="${c[0]}" cy="${c[1]}" r="6.5" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1"/>`;
  window.__ready = true;
})();
</script>
</body>
</html>
