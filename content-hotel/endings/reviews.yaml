- id: fallback_survival
  name: Six O'Clock
  kind: survival
  trigger: { type: run_end }
  priority: 0
  stars: 3
  quote: "It was a night. It is now a morning."
  text: >-
    At six the Day Manager walks in, looks at the lobby, looks at you, and says "right".
    The hotel is open, the guests are mostly asleep, and nobody has written anything down yet.


    Three stars, by default, which is the kindest thing a default has ever done.
  moment_label: "The moment the Day Manager said right"
  compendium: "Made it to six without a review worth the name."
  emoji: "☕"

- id: fallback_special
  name: The Night Ends
  kind: special
  trigger: { type: forced }
  priority: 0
  stars: 1
  quote: "Something happened. Nobody will say what."
  text: >-
    The night ended in a way nobody at the desk can quite describe, and the Day Manager has
    decided not to ask. The Porter has a theory, and is keeping it.


    No stars, no review, a hotel that is somehow still open.
  moment_label: "The moment nobody describes"
  compendium: "A night that ended without a review."
  emoji: "🕯️"
