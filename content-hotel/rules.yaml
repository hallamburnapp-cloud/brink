# THE BRINK HOTEL — the night desk. HOTEL.md is the design; this file is its numbers.
# `acts` is required by the schema and belongs to Expert, which this pack never plays;
# the night below is the game.
voice: hotel

acts:
  - { index: 1, name: Week One,   cards: 14, effect_scale: 1.00, intel_shift: 0,   timer_scale: 1.00, day_per_card: 0.5, target: 250, cooling: 0.5, recovery: 0.15 }
  - { index: 2, name: Week Two,   cards: 14, effect_scale: 1.08, intel_shift: -5,  timer_scale: 0.90, day_per_card: 0.5, target: 450, cooling: 0.5, recovery: 0.15 }
  - { index: 3, name: Week Three, cards: 16, effect_scale: 1.16, intel_shift: -10, timer_scale: 0.80, day_per_card: 0.5, target: 1200, cooling: 0.5, recovery: 0.15 }
  - { index: 4, name: Week Four,  cards: 16, effect_scale: 1.28, intel_shift: -15, timer_scale: 0.70, day_per_card: 0.5, target: 3200, cooling: 0.5, recovery: 0.15 }
  - { index: 5, name: Endgame,    cards: 10, effect_scale: 1.40, intel_shift: -20, timer_scale: 0.60, day_per_card: 0.5, target: 7000, cooling: 0.5, recovery: 0.15 }

# The night: 18 cards, ten minutes of the clock each, 3:00 to 6:00. Three stretches (the
# three o'clock, four o'clock and five o'clock hours) so cards can be timed to an hour with
# `acts`. No flashpoint, no cooling, no recovery: the bars move only when a card moves them.
night:
  cards: 18
  minutes: 10
  one_sided: true
  use_escalation: false
  first_night_scale: 0.85
  # The night wears on: every answered card costs each bar 1.5 (scaled like the cards). See BALANCE.md "The hotel".
  drift: 1.5
  full_cards: { public: full_guests_coach, military: full_staff_singing, economy: full_money_fountain, allies: full_building_trust }
  acts:
    - { index: 1, name: "3 o'clock", cards: 6, effect_scale: 1.40, intel_shift: 0, timer_scale: 1.00, day_per_card: 0.1, target: 50, cooling: 0, recovery: 0, flashpoint: false }
    - { index: 2, name: "4 o'clock", cards: 6, effect_scale: 1.40, intel_shift: 0, timer_scale: 1.00, day_per_card: 0.1, target: 50, cooling: 0, recovery: 0, flashpoint: false }
    - { index: 3, name: "5 o'clock", cards: 6, effect_scale: 1.40, intel_shift: 0, timer_scale: 1.00, day_per_card: 0.1, target: 50, cooling: 0, recovery: 0, flashpoint: false }

# Level 5 is every night; level 1 is a player's very first (practice) night.
difficulties:
  - { level: 5, name: The night, effect_scale: 1.00, intel_shift: 0, timer_scale: 1.00, start_escalation: 0, target_scale: 1.00 }
  - { level: 1, name: Your first night, effect_scale: 0.85, intel_shift: 0, timer_scale: 1.00, start_escalation: 0, target_scale: 1.00 }
