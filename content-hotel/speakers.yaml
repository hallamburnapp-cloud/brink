# The cast, by role. Names live in the Guest Book; cards say the role. `art` is a portrait id.
- id: porter
  name: Dennis Mallow
  role: "The Night Porter"
  accent: "#c9b98a"
  art: aide
  voice: Reads the board (room numbers, times, what he saw). Loyal, literal, quietly funny. Has a theory.
- id: chef
  name: Ange Moreau
  role: "Your Chef"
  accent: "#b8352f"
  art: hawk_general
  voice: Clipped, certain, hides blame in the passive voice. "I'm not saying the night manager forgot the eggs; I'm saying somebody did."
- id: housekeeper
  name: Mrs Okafor
  role: "The Housekeeper"
  accent: "#4f8fc9"
  art: dove_fm
  voice: Long view, dry, weary, kind. Has seen every kind of guest. Says "we" for the hotel.
- id: concierge
  name: Felix Varga
  role: "The Concierge"
  accent: "#7c8b9a"
  art: intel_director
  voice: Knows everything, hedges to the exact degree. "One source, and he is drunk." Never says "I think".
- id: events
  name: Priya Shah
  role: "The Events Manager"
  accent: "#c98a3a"
  art: spin_doctor
  voice: Thinks in headlines and seating plans. Everything is "a moment".
- id: doorman
  name: Bert Lyle
  role: "The Doorman"
  accent: "#8a7a5a"
  art: ambassador
  voice: Every anecdote is a warning. Remembers 1991.
- id: handyman
  name: Terry Quill
  role: "The Handyman"
  accent: "#6a9a7a"
  art: cyber_director
  voice: On the intercom from the boiler room. Explains the boiler as if it were weather.
- id: owner
  name: Mr Castellan
  role: "The Owner"
  accent: "#c9a24a"
  art: treasury
  voice: On the phone from abroad, in a dressing gown. Money, then a dry joke. His patience is a hidden value.
- id: barman
  name: Sol Petrakis
  role: "The Barman"
  accent: "#5a7a9a"
  art: admiral
  voice: Hours and distances. "Last orders was an hour ago and so, in a sense, was he."
- id: room12
  name: Mrs Ambrose
  role: "Room 12"
  accent: "#9a7aa8"
  art: peace_leader
  voice: Resident since 1987. Wrote the rules on the card by the lift. Reasonable, lethal.
- id: critic
  name: Hester Vale
  role: "The Critic in 212"
  accent: "#d8b45a"
  art: press
  voice: Files at nine. Would rather write about the pillows. Her opinion is a hidden value.
- id: room412
  name: Ms Thorne
  role: "Room 412"
  accent: "#7aa8a0"
  art: ally_leader
  voice: Calm about the swan. Less calm about everything else.
- id: lead
  name: Tonight's lead guest
  role: "Tonight's guest"
  accent: "#7aa8a0"
  art: ally_leader
  voice: The Bride's Mother, the Inspector, the Dog Show secretary. Whoever tonight is about.
- id: majestic
  name: The night manager of The Majestic
  role: "The Majestic"
  accent: "#a8a8a8"
  art: hotline
  voice: The rival hotel across the square, by phone, formal, a beat late. "As a courtesy. Courtesies are remembered."
- id: daymanager
  name: Gwen Tally
  role: "The Day Manager"
  accent: "#b89a4a"
  art: opposition
  voice: Texts through the night, arrives at six. Reasonable in tone, lethal in timing. "I've brought my own pen."
- id: partner
  name: Sam
  role: "Your Partner"
  accent: "#e0c9a0"
  art: family
  voice: Texting from home. Soup, a bed, the cat. Short and real. Never a mechanic.
# ---- Tonight's lead guests, one per Booking (added here so the Booking files never touch this file)
- id: bride_mother
  name: Mrs Okonkwo-Reyes
  role: "The Bride's Mother"
  accent: "#d08aa0"
  art: ally_leader
  voice: Has a list. Has had the list since the engagement. Everything is "the one thing I asked".
- id: room9
  name: The hen party in 9
  role: "Room 9"
  accent: "#e0a060"
  art: other_leader
  voice: Singing. Reasonable between songs. Eleven of them, and they count as one.
- id: room220
  name: Mr Haldane
  role: "Room 220"
  accent: "#8aa0c0"
  art: envoy
  voice: In the dark wing, calm, with a torch and a complaint he is saving.
- id: room310
  name: Mrs Pell
  role: "Room 310"
  accent: "#90b0a0"
  art: legal
  voice: Describes the water coming through the ceiling as if reading the weather. Wants it in writing.
- id: nephew
  name: Jasper Castellan
  role: "The Owner's Nephew"
  accent: "#c0a060"
  art: contractor
  voice: Stuck in the lift, on the phone to his uncle, certain this is somebody's fault.
- id: bandleader
  name: Ray Dunmore
  role: "The Bandleader"
  accent: "#a070c0"
  art: fixer
  voice: Nobody booked them and they are very good. Speaks in sets and encores.
- id: room7
  name: The guest in 7
  role: "Room 7"
  accent: "#707880"
  art: rival_leader
  voice: Pays cash. Would like the register to agree he never arrived. Polite about it.
- id: coachdriver
  name: Len Marsh
  role: "The Coach Driver"
  accent: "#80a0c0"
  art: watch_officer
  voice: Forty-one passengers and a timetable the snow has not read. Counts heads.
- id: dogshow_secretary
  name: Ms Fairweather
  role: "The Dog Show Secretary"
  accent: "#b0a070"
  art: scientist
  voice: Forty-one dogs, a rosette for everything, and a judge with allergies. Brisk, fond of rules about dogs.
- id: inspector
  name: Mr Prentice
  role: "The Inspector"
  accent: "#a0a0a0"
  art: legal
  voice: Early, which he finds people prefer. Would like to see the kitchen with the lights on.
