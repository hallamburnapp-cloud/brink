[package]
name = "brink"
version = "0.1.0"
description = "BRINK desktop shell (Tauri 2)"
authors = ["Hallam Burnapp"]
license = "SEE LICENSE IN ../LICENSE.md"
edition = "2021"
rust-version = "1.77.2"

# The library target is what Tauri's mobile entry points link against; the binary
# is a one-line wrapper so desktop and mobile share the same `run()`.
[lib]
name = "brink_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
