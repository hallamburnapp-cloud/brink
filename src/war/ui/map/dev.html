<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Map harness</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        background: #0b0f14;
        color: #e8e2d0;
        font: 500 13px/1.4 'Barlow Condensed', 'Arial Narrow', sans-serif;
      }
      #map {
        display: block;
        width: 390px;
        height: 520px;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }
      #panel {
        width: 390px;
        box-sizing: border-box;
        padding: 12px 16px 24px;
      }
      #panel h1 {
        margin: 0 0 4px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: rgba(232, 226, 208, 0.4);
      }
      #caption {
        margin: 0 0 10px;
        color: rgba(232, 226, 208, 0.64);
      }
      #states,
      #actions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 10px;
      }
      #states a,
      #actions button {
        font: inherit;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-size: 11px;
        color: #e8e2d0;
        text-decoration: none;
        background: #12161c;
        border: 1px solid #2a3038;
        border-radius: 6px;
        padding: 4px 8px;
        cursor: pointer;
      }
      #states a[aria-current='page'] {
        border-color: #c9a35b;
        color: #f7e0a3;
      }
      #stats {
        font: 400 11px 'JetBrains Mono', monospace;
        color: rgba(232, 226, 208, 0.4);
      }
    </style>
  </head>
  <body>
    <canvas id="map" width="390" height="520"></canvas>
    <div id="panel">
      <h1>Map harness</h1>
      <p id="caption"></p>
      <div id="states"></div>
      <div id="actions"></div>
      <div id="stats"></div>
    </div>
    <script type="module" src="./dev.ts"></script>
  </body>
</html>
